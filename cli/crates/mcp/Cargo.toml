[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-seams = ["state/test-seams"]

[dependencies]
base64.workspace = true
observe.workspace = true
protocol.workspace = true
rmcp = { workspace = true, default-features = false, features = ["client"] }
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
state.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync"] }

[dev-dependencies]
jsonschema.workspace = true
libc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
