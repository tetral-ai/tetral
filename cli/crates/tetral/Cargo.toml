[package]
name = "tetral"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-seams = [
    "appserver/test-seams",
    "drive/test-seams",
    "execution/test-seams",
    "state/test-seams",
]

[dependencies]
appserver.workspace = true
clap = { workspace = true, features = ["derive"] }
codex-linux-sandbox.workspace = true
codex-sandboxing.workspace = true
drive.workspace = true
execution.workspace = true
flate2.workspace = true
observe.workspace = true
protocol.workspace = true
sdk.workspace = true
serde_json.workspace = true
session.workspace = true
state.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tempfile.workspace = true
