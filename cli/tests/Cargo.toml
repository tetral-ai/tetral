[package]
name = "tetral-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64.workspace = true
protocol.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }
reqwest = { workspace = true, features = ["blocking", "json"] }
rustls.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
sdk = { workspace = true, features = ["test-seams"] }
serde_json.workspace = true
sha2.workspace = true
state = { workspace = true, features = ["test-seams"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
drive.workspace = true
fuser.workspace = true
