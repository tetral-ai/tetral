[package]
name = "tetral-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64.workspace = true
protocol.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }
reqwest = { workspace = true, features = ["blocking", "json"] }
rustls.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
sdk = { workspace = true, features = ["test-seams"] }
serde_json.workspace = true
sha2.workspace = true
state = { workspace = true, features = ["test-seams"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
drive = { workspace = true, features = ["test-seams"] }
execution.workspace = true
flate2.workspace = true
mcp.workspace = true
session.workspace = true
tar.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
fuser.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
async-trait.workspace = true
nfsserve.workspace = true
