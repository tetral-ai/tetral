# `cargo about generate`, run by scripts/package.sh, writes each release
# archive's THIRD-PARTY-NOTICES from about.hbs. The accepted licences are
# those deny.toml allows; a crate under any other licence, or one whose
# licence cannot be identified, fails the packaging.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Development dependencies are not built into `tetral`.
ignore-dev-dependencies = true

# The workspace's own crates, which set `publish = false`, are not third-party.
[private]
ignore = true
