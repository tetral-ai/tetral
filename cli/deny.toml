# `cargo deny check advisories licenses sources`, run in this directory,
# checks every dependency of the workspace against the RustSec advisories,
# the licence list below and the sources below. No AGPL licence enters the
# list, and about.toml accepts the same licences.

[advisories]
yanked = "deny"
# Advisories that the CLI does not take the fix of: each crate reaches the
# CLI only through the Codex crates at the pinned tag, or through a crates.io
# library whose newest release does not allow the fixed version, or is rmcp,
# whose version the MCP proxy contract fixes. The raise that fixes an
# advisory removes its entry.
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unmaintained with no successor release; it comes only through Codex's starlark dependency" },
    { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained with no successor release; it comes only through Codex's starlark dependency" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained with no successor release; it comes only through Codex's starlark dependency" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is unmaintained with no successor release; it comes only through Codex's starlark dependency" },
    { id = "RUSTSEC-2026-0118", reason = "no fixed hickory-proto release; it needs hickory's dnssec features, which are not compiled in, and the CLI calls no codex-network-proxy API, its only user" },
    { id = "RUSTSEC-2026-0119", reason = "fixed only in hickory-proto 0.26.1, which Codex's rama-dns does not allow; the CLI calls no codex-network-proxy API, its only user" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained with no successor release; it comes only through Codex's rama-core, whose tokio-graceful depends on loom, and so on pin-utils, only under cfg(loom)" },
    { id = "RUSTSEC-2026-0457", reason = "rmcp's OAuth client is its auth feature, which is not compiled; the CLI's only MCP use is the local cua server over stdin and stdout, with rmcp at the =3.5.1 the MCP proxy contract fixes" },
    { id = "RUSTSEC-2026-0459", reason = "fixed only in libsqlite3-sys 0.39, which sqlx-sqlite 0.9.0, sqlx's newest release, does not allow; the only SQLite file the CLI opens is sync-state.db below its state root, which no task can write" },
    { id = "RUSTSEC-2026-0461", reason = "rmcp's Streamable HTTP server transport is a feature that is not compiled; the CLI's only MCP use is the local cua server over stdin and stdout, with rmcp at the =3.5.1 the MCP proxy contract fixes" },
    { id = "RUSTSEC-2026-0462", reason = "rmcp's Streamable HTTP client transport is a feature that is not compiled; the CLI's only MCP use is the local cua server over stdin and stdout, with rmcp at the =3.5.1 the MCP proxy contract fixes" },
    { id = "RUSTSEC-2026-0487", reason = "the SVCB text parser is behind hickory-proto's text-parsing feature, which nothing in the CLI's graph enables; fixed only in hickory-proto 0.26.2, which Codex's rama-dns does not allow" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# crates.io and the Codex crates' Git sources only: Codex itself and the Git
# dependencies that its pinned tag uses (UPSTREAM.md). Any other registry or
# Git source fails the check.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/openai/codex",
    "https://github.com/microsoft/mxc",
    "https://github.com/openai-oss-forks/tokio-tungstenite",
    "https://github.com/openai-oss-forks/tungstenite-rs",
]
