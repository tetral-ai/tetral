apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: tetral-public-edge
  namespace: tetral-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tetral-public-edge
  timeout:
    http:
      requestTimeout: 0s
      maxStreamDuration: 0s
      streamIdleTimeout: 1800s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: tetral-public-http
  namespace: tetral-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tetral-public-edge
      sectionName: http
  headers:
    requestID: Generate
    earlyRequestHeaders:
      remove:
        - x-forwarded-for
        - forwarded
        - x-real-ip
        - x-envoy-external-address
      removeOnMatch:
        - type: Prefix
          value: x-tetral-
        - type: Prefix
          value: x-original-
  clientIPDetection:
    directSourceIP: {}
  path:
    escapedSlashesAction: RejectRequest
    disableMergeSlashes: false
  timeout:
    http:
      requestReceivedTimeout: 0s
      streamIdleTimeout: 1800s
  tls:
    minVersion: "1.3"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: tetral-public-api-https
  namespace: tetral-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tetral-public-edge
      sectionName: api-https
  headers:
    requestID: Generate
    earlyRequestHeaders:
      remove:
        - x-forwarded-for
        - forwarded
        - x-real-ip
        - x-envoy-external-address
      removeOnMatch:
        - type: Prefix
          value: x-tetral-
        - type: Prefix
          value: x-original-
  clientIPDetection:
    directSourceIP: {}
  path:
    escapedSlashesAction: RejectRequest
    disableMergeSlashes: false
  timeout:
    http:
      requestReceivedTimeout: 0s
      streamIdleTimeout: 1800s
  tls:
    minVersion: "1.3"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: tetral-public-git-https
  namespace: tetral-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tetral-public-edge
      sectionName: git-https
  headers:
    requestID: Generate
    earlyRequestHeaders:
      remove:
        - x-forwarded-for
        - forwarded
        - x-real-ip
        - x-envoy-external-address
      removeOnMatch:
        # RE2 has no negative lookahead. This finite complement removes every
        # X-Tetral-* name except the exact Git ticket, including all near matches.
        - type: RegularExpression
          value: "(?i)^x-tetral-(|[^g].*|g[^i].*|g|gi[^t].*|gi|git[^\\-].*|git|git-[^t].*|git-|git-t[^i].*|git-t|git-ti[^c].*|git-ti|git-tic[^k].*|git-tic|git-tick[^e].*|git-tick|git-ticke[^t].*|git-ticke|git-ticket.+)$"
        - type: Prefix
          value: x-original-
  clientIPDetection:
    directSourceIP: {}
  path:
    escapedSlashesAction: RejectRequest
    disableMergeSlashes: false
  timeout:
    http:
      requestReceivedTimeout: 0s
      streamIdleTimeout: 1800s
  tls:
    minVersion: "1.3"
---
# The selected SecurityPolicy API does not expose encode_raw_headers. Match
# the one generated API authorization filter by its full policy-owned name.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: tetral-auth-raw-headers
  namespace: tetral-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: tetral-public-edge
  type: JSONPatch
  jsonPatches:
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: tetral-system/tetral-public-edge/api-https
      operation:
        op: add
        jsonPath: "$..http_filters[?(@.name == 'envoy.filters.http.ext_authz/securitypolicy/tetral-system/tetral-public-api')].typed_config"
        path: /encode_raw_headers
        value: true
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: tetral-system/tetral-public-edge/api-https
      operation:
        op: add
        jsonPath: "$..http_filters[?(@.name == 'envoy.filters.http.ext_authz/securitypolicy/tetral-system/tetral-public-api')].typed_config"
        path: /validate_mutations
        value: true
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: tetral-public-edge
  namespace: tetral-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          image: "docker.io/envoyproxy/envoy:distroless-v1.39.2@sha256:dced08cf7c472e1a1d067f906878266078eeeb63c110b4961882c039a622853a"
      envoyServiceAccount:
        name: tetral-public-edge
  telemetry:
    # Application outcomes carry bounded, sanitized correlation. In particular,
    # Git tickets in paths/query parameters must never enter a proxy access log.
    accessLog:
      disable: true
---
# Controller, GatewayClass and CRDs are separately installed dependencies.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tetral-public-edge
  namespace: tetral-system
spec:
  gatewayClassName: "tetral-envoy-gateway"
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: tetral-public-edge
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: api-https
      hostname: "api.tetral.example"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: "tetral-api-public-tls"
    - name: git-https
      hostname: "git.tetral.example"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: "tetral-git-public-tls"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tetral-public-redirect
  namespace: tetral-system
spec:
  parentRefs:
    - name: tetral-public-edge
      sectionName: http
  hostnames: ["api.tetral.example", "git.tetral.example"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Only this exact method and path bypass API authorization. All other /v1
# matches are covered by the protected route below.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tetral-token-exchange
  namespace: tetral-system
spec:
  parentRefs:
    - name: tetral-public-edge
      sectionName: api-https
  hostnames: ["api.tetral.example"]
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /v1/oauth/token
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Authorization, X-Api-Key]
      backendRefs:
        - name: auth
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tetral-public-api
  namespace: tetral-system
spec:
  parentRefs:
    - name: tetral-public-edge
      sectionName: api-https
  hostnames: ["api.tetral.example"]
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: '^/v1/sessions/[^/]+/events/stream$'
        - path:
            type: RegularExpression
            value: '^/v1/sessions/[^/]+/threads/[^/]+/stream$'
      backendRefs:
        - name: event-stream
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1/api_keys
      backendRefs:
        - name: auth
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: api
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tetral-public-git
  namespace: tetral-system
spec:
  parentRefs:
    - name: tetral-public-edge
      sectionName: git-https
  hostnames: ["git.tetral.example"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Authorization, X-Api-Key]
      backendRefs:
        - name: git-proxy
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tetral-public-api
  namespace: tetral-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tetral-public-api
  extAuth:
    grpc:
      backendRefs:
        - name: auth
          port: 9095
    timeout: 5s
    failOpen: false
    statusOnError: 503
    recomputeRoute: false
