apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-runner
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: job-runner
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-runner
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: job-runner
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: job-runner
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/nativeSidecar: "true"
        sidecar.istio.io/proxyImage: "docker.io/istio/proxyv2:1.31.1@sha256:d86cba0dd1eb15c00b6901c69ce5ae3d2d5f8427a47751098cf8c3ab2a4a62e9"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true,"terminationDrainDuration":"5s"}'
        traffic.sidecar.istio.io/excludeOutboundPorts: "19090"
      labels:
        app.kubernetes.io/name: job-runner
        app.kubernetes.io/part-of: tetral
        istio.io/rev: "1-31-1"
    spec:
      serviceAccountName: job-runner
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: job-runner
          image: ghcr.io/tetral-ai/tetral:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/job-runner
          env:
            - name: TETRAL_DATABASE_TLS_CA_PATH
              value: /var/run/tetral/store-trust/database-ca.crt
            - name: TETRAL_DATABASE_TLS_SERVER_NAME
              value: "tetral-postgres.tetral-system.svc.cluster.local"
            - name: TETRAL_DB_MAX_OPEN_CONNS
              value: "20"
            - name: TETRAL_BLOB_TLS_CA_PATH
              value: /var/run/tetral/store-trust/object-store-ca.crt
            - name: TETRAL_BLOB_TLS_SERVER_NAME
              value: "tetral-object-store.tetral-system.svc.cluster.local"
            - name: TETRAL_DRAIN_TIMEOUT_MS
              value: "30000"
            - name: TETRAL_CANCEL_JOIN_TIMEOUT_MS
              value: "5000"
            - name: TETRAL_TRANSPORT_PROFILE
              value: "standard-routed"
            - name: TETRAL_ROUTING_PROXY_REQUIRED
              value: "true"
            - name: TETRAL_BRIDGE_JOB_RUNNER_HTTP_ADDR
              value: :8081
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              value: "local"
            - name: TETRAL_SERVICE_VERSION
              value: "dev"
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "tetral-database"
                  key: job-runner-url
            - name: TETRAL_QUEUE_GRPC_ADDR
              value: queue.tetral-system.svc.cluster.local:9090
            - name: TETRAL_BRIDGE_JOB_RUNNER_LEASE_OWNER
              value: bridge-job-runner
            - name: TETRAL_BRIDGE_JOB_RUNNER_LEASE_DURATION_MS
              value: '30000'
            - name: TETRAL_BRIDGE_JOB_RUNNER_HEARTBEAT_INTERVAL_MS
              value: '10000'
            - name: TETRAL_BRIDGE_JOB_RUNNER_MAX_JOBS
              value: '8'
            - name: TETRAL_BRIDGE_JOB_RUNNER_POLL_INTERVAL_MS
              value: '1000'
            - name: TETRAL_KUBERNETES_NAMESPACE
              value: tetral-agent-runtime
            - name: TETRAL_AGENT_RUNTIME_LABEL_SELECTOR
              value: app.kubernetes.io/name=agent-runtime
            - name: TETRAL_AGENT_RUNTIME_GRPC_PORT
              value: "19090"
            - name: TETRAL_BRIDGE_RUNTIME_POD_TOKEN_PATH
              value: /var/run/secrets/tetral-internal-grpc/agent-runtime/token
            - name: TETRAL_BRIDGE_JOB_RUNNER_MCP_CONNECTOR_GRPC_ADDR
              value: mcp-connector.tetral-system.svc.cluster.local:9091
            - name: TETRAL_BRIDGE_JOB_RUNNER_GATEWAY_TOKEN_PATH
              value: /var/run/secrets/tetral-internal-grpc/mcp-connector/token
            - name: TETRAL_BLOB_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: "tetral-blob"
                  key: endpoint
            - name: TETRAL_BLOB_REGION
              valueFrom:
                secretKeyRef:
                  name: "tetral-blob"
                  key: region
            - name: TETRAL_BLOB_BUCKET
              valueFrom:
                secretKeyRef:
                  name: "tetral-blob"
                  key: bucket
            - name: TETRAL_BLOB_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: "tetral-blob"
                  key: access-key
            - name: TETRAL_BLOB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: "tetral-blob"
                  key: secret-key
          ports:
            - name: http-job
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: http-job
          readinessProbe:
            httpGet:
              path: /ready
              port: http-job
          resources:

            limits:
              cpu: 500m
              ephemeral-storage: 512Mi
              memory: 512Mi
            requests:
              cpu: 100m
              ephemeral-storage: 128Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: store-trust
              mountPath: /var/run/tetral/store-trust
              readOnly: true
            - name: bridge-runtime-pod-token
              mountPath: /var/run/secrets/tetral-internal-grpc/agent-runtime
              readOnly: true
            - name: job-runner-mcp-token
              mountPath: /var/run/secrets/tetral-internal-grpc/mcp-connector
              readOnly: true
            - name: job-runner-kubernetes-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: store-trust
          configMap:
            name: "tetral-store-trust"
        - name: bridge-runtime-pod-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: tetral-internal-grpc
                  expirationSeconds: 600
                  path: token
        - name: job-runner-mcp-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: tetral-internal-grpc
                  expirationSeconds: 600
                  path: token
        - name: job-runner-kubernetes-api
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: job-runner
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: job-runner
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: job-runner
  ports:
    - name: metrics-job
      port: 8081
      targetPort: http-job
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: job-runner
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: job-runner
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/egress-intent: "blob.example.internal"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: job-runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tetral-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-connector
      ports:
        - protocol: TCP
          port: 9091
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: queue
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-agent-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
      ports:
        - protocol: TCP
          port: 19090
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: job-runner-apiserver-egress
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: job-runner
    app.kubernetes.io/part-of: tetral
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: job-runner
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
            - port: '6443'
              protocol: TCP
