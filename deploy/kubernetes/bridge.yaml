apiVersion: v1
kind: ConfigMap
metadata:
  name: bridge-config
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: bridge
    app.kubernetes.io/part-of: tetral
data:
  TETRAL_PROVIDER_RESCHEDULE_BUDGET: '3'
  TETRAL_COMPACTION_RESCHEDULE_BUDGET: '2'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bridge
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: bridge
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: bridge
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bridge
        app.kubernetes.io/part-of: tetral
    spec:
      serviceAccountName: bridge
      automountServiceAccountToken: false
      containers:
        - name: bridge-api
          image: ghcr.io/tetral-ai/tetral:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/bridge-api
          env:
            - name: TETRAL_BRIDGE_API_HTTP_ADDR
              value: :8080
            - name: TETRAL_BRIDGE_API_GRPC_ADDR
              value: :9090
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              value: local
            - name: TETRAL_SERVICE_VERSION
              value: dev
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tetral-database
                  key: bridge-url
            - name: TETRAL_INTERNAL_GRPC_AUDIENCE
              value: tetral-internal-grpc
            - name: TETRAL_INTERNAL_ALLOWED_SERVICE_ACCOUNTS
              value: tetral-agent-runtime/agent-runtime,tetral-system/provider-gateway,tetral-system/mcp-connector
            - name: TETRAL_BRIDGE_MCP_CONNECTOR_GRPC_ADDR
              value: mcp-connector.tetral-system.svc.cluster.local:9091
            - name: TETRAL_BRIDGE_GATEWAY_TOKEN_PATH
              value: /var/run/secrets/tetral-internal-grpc/mcp-connector/token
            - name: TETRAL_RUNTIME_BINDING_TOKEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-binding-token
                  key: hmac-key
            - name: TETRAL_PROVIDER_RESCHEDULE_BUDGET
              valueFrom:
                configMapKeyRef:
                  name: bridge-config
                  key: TETRAL_PROVIDER_RESCHEDULE_BUDGET
            - name: TETRAL_COMPACTION_RESCHEDULE_BUDGET
              valueFrom:
                configMapKeyRef:
                  name: bridge-config
                  key: TETRAL_COMPACTION_RESCHEDULE_BUDGET
            - name: KUBERNETES_TOKEN_REVIEW_REVIEWER_TOKEN_PATH
              value: /var/run/secrets/tetral-kubernetes-api/bridge-api-tokenreview/token
            - name: KUBERNETES_API_SERVER_URL
              value: https://kubernetes.default.svc
            - name: KUBERNETES_API_CA_CERT_PATH
              value: /var/run/secrets/tetral-kubernetes-api/ca.crt
            - name: TETRAL_BLOB_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: tetral-blob
                  key: endpoint
            - name: TETRAL_BLOB_REGION
              valueFrom:
                secretKeyRef:
                  name: tetral-blob
                  key: region
            - name: TETRAL_BLOB_BUCKET
              valueFrom:
                secretKeyRef:
                  name: tetral-blob
                  key: bucket
            - name: TETRAL_BLOB_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tetral-blob
                  key: access-key
            - name: TETRAL_BLOB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tetral-blob
                  key: secret-key
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bridge-api-kubernetes-api
              mountPath: /var/run/secrets/tetral-kubernetes-api
              readOnly: true
            - name: bridge-api-mcp-token
              mountPath: /var/run/secrets/tetral-internal-grpc/mcp-connector
              readOnly: true
      volumes:
        - name: bridge-api-kubernetes-api
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 600
                  path: bridge-api-tokenreview/token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: bridge-api-mcp-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: tetral-internal-grpc
                  expirationSeconds: 600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: bridge
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: bridge
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: bridge
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/egress-intent: "blob.example.internal"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bridge
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-agent-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
      ports:
        - protocol: TCP
          port: 9090
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: provider-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-connector
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tetral-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-connector
      ports:
        - protocol: TCP
          port: 9091
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bridge-apiserver-egress
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: bridge
    app.kubernetes.io/part-of: tetral
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bridge
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
            - port: '6443'
              protocol: TCP
