apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: git-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-proxy
        app.kubernetes.io/part-of: tetral
    spec:
      serviceAccountName: git-proxy
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1800
      containers:
        - name: git-proxy
          image: ghcr.io/tetral-ai/tetral:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/git-proxy
          env:
            - name: TETRAL_GIT_PROXY_HTTP_ADDR
              value: ":8080"
            - name: TETRAL_GIT_PROXY_METRICS_ADDR
              value: ":8081"
            - name: TETRAL_GIT_PROXY_PUBLIC_BASE_URL
              value: https://git.tetral.example
            - name: TETRAL_GIT_PROXY_DRAIN_GRACE_SECONDS
              value: "1800"
            - name: TETRAL_GIT_PROXY_LEGACY_PATH_CUTOVER
              value: "true"
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              value: local
            - name: TETRAL_SERVICE_VERSION
              value: dev
            - name: TETRAL_SCHEMA_MODE
              value: verify
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tetral-database
                  key: git-proxy-url
            - name: ENGINE_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: engine-vault-key
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
    tetral.ai/exposure: public
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: git-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 8081
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/egress-intent: "github.com"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: git-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tetral.ai/network-role: public-ingress
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tetral-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/hpa-metric-source: "prometheus-adapter: gitproxy_active_connections and rate(gitproxy_bytes_relayed_total[2m])"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: git-proxy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: gitproxy_active_connections
        target:
          type: AverageValue
          averageValue: "100"
    - type: Pods
      pods:
        metric:
          name: gitproxy_bytes_relayed_per_second
          selector:
            matchLabels:
              direction: in
        target:
          type: AverageValue
          averageValue: 20Mi
    - type: Pods
      pods:
        metric:
          name: gitproxy_bytes_relayed_per_second
          selector:
            matchLabels:
              direction: out
        target:
          type: AverageValue
          averageValue: 20Mi
