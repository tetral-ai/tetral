apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
data:
  TETRAL_AUTH_HTTP_ADDR: ":8080"
  TETRAL_AUTH_METRICS_ADDR: ":8081"
  TETRAL_DEPLOYMENT_ENVIRONMENT: "local"
  TETRAL_SERVICE_VERSION: "dev"
  ENGINE_BOOTSTRAP_WORKSPACE_ID: "existing-workspace-id"
  TETRAL_AUTH_INTERNAL_PRINCIPAL_TTL_SECONDS: "60"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: tetral
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: auth
      automountServiceAccountToken: false
      containers:
        - name: auth
          image: ghcr.io/tetral-ai/tetral:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/tetral-auth
          env:
            - name: TETRAL_LOG_BURST
              value: "1"
            - name: TETRAL_LOG_LEVEL
              value: "info"
            - name: TETRAL_LOG_MAX_RECORD_BYTES
              value: "16384"
            - name: TETRAL_LOG_SUMMARY_INTERVAL_MS
              value: "30000"
            - name: TETRAL_DATABASE_TLS_CA_PATH
              value: /var/run/tetral/store-trust/database-ca.crt
            - name: TETRAL_DATABASE_TLS_SERVER_NAME
              value: "tetral-postgres.tetral-system.svc.cluster.local"
            - name: TETRAL_DB_MAX_OPEN_CONNS
              value: "20"
            - name: TETRAL_HTTP_TRANSPORT
              value: "plaintext"
            - name: TETRAL_AUTH_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_AUTH_HTTP_ADDR
            - name: TETRAL_AUTH_METRICS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_AUTH_METRICS_ADDR
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_DEPLOYMENT_ENVIRONMENT
            - name: TETRAL_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_SERVICE_VERSION
            - name: ENGINE_BOOTSTRAP_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: ENGINE_BOOTSTRAP_WORKSPACE_ID
            - name: TETRAL_AUTH_INTERNAL_PRINCIPAL_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_AUTH_INTERNAL_PRINCIPAL_TTL_SECONDS
            - name: ENGINE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "auth-bootstrap"
                  key: engine-api-key
            - name: TETRAL_AUTH_INTERNAL_PRINCIPAL_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: "auth-internal-principal"
                  key: private_key_b64
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "auth-database"
                  key: url
            - name: TETRAL_AUTH_GRPC_ADDR
              value: ":9095"
            - name: TETRAL_AUTH_GRPC_TRANSPORT
              value: "plaintext"
          ports:
            - name: grpc-check
              containerPort: 9095
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          volumeMounts:

            - name: store-trust
              mountPath: /var/run/tetral/store-trust
              readOnly: true
          resources:

            limits:
              cpu: 500m
              ephemeral-storage: 512Mi
              memory: 512Mi
            requests:
              cpu: 50m
              ephemeral-storage: 64Mi
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:

        - name: store-trust
          configMap:
            name: "tetral-store-trust"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
    tetral.ai/exposure: public
spec:
  sessionAffinity: None
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: grpc-check
      port: 9095
      targetPort: grpc-check
      appProtocol: kubernetes.io/h2c
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: auth-metrics
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tetral.ai/network-role: public-ingress
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9095
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-system
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tetral-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
