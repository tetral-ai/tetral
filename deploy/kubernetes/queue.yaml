apiVersion: v1
kind: ConfigMap
metadata:
  name: queue-config
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
data:
  TETRAL_QUEUE_HTTP_ADDR: ":8080"
  TETRAL_QUEUE_GRPC_ADDR: ":9090"
  TETRAL_DEPLOYMENT_ENVIRONMENT: local
  TETRAL_SERVICE_VERSION: dev
  TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS: "30"
  TETRAL_QUEUE_LEASE_RECLAIM_LIMIT: "100"
  TETRAL_QUEUE_RETRY_BASE_MS: "1000"
  TETRAL_QUEUE_RETRY_CAP_MS: "60000"
  TETRAL_QUEUE_RETRY_MAX_ATTEMPTS: "10"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queue
        app.kubernetes.io/part-of: tetral
    spec:
      serviceAccountName: queue
      automountServiceAccountToken: false
      containers:
        - name: queue
          image: ghcr.io/tetral-ai/tetral:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/tetral-queue
          env:
            - name: TETRAL_QUEUE_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_HTTP_ADDR
            - name: TETRAL_QUEUE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_GRPC_ADDR
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_DEPLOYMENT_ENVIRONMENT
            - name: TETRAL_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_SERVICE_VERSION
            - name: TETRAL_SCHEMA_MODE
              value: verify
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: queue-database
                  key: url
            - name: TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS
            - name: TETRAL_QUEUE_LEASE_RECLAIM_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_LEASE_RECLAIM_LIMIT
            - name: TETRAL_QUEUE_RETRY_BASE_MS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_BASE_MS
            - name: TETRAL_QUEUE_RETRY_CAP_MS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_CAP_MS
            - name: TETRAL_QUEUE_RETRY_MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_MAX_ATTEMPTS
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: queue
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: queue
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bridge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bridge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tetral-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
