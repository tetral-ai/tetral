apiVersion: v1
kind: ConfigMap
metadata:
  name: queue-config
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
data:
  TETRAL_QUEUE_HTTP_ADDR: ":8080"
  TETRAL_QUEUE_GRPC_ADDR: ":9090"
  TETRAL_DEPLOYMENT_ENVIRONMENT: "local"
  TETRAL_SERVICE_VERSION: "dev"
  TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS: "30"
  TETRAL_QUEUE_LEASE_RECLAIM_LIMIT: "100"
  TETRAL_QUEUE_RETRY_BASE_MS: "1000"
  TETRAL_QUEUE_RETRY_CAP_MS: "60000"
  TETRAL_QUEUE_RETRY_MAX_ATTEMPTS: "10"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queue
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: queue
        app.kubernetes.io/part-of: tetral
    spec:
      serviceAccountName: queue
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: queue
          image: ghcr.io/tetral-ai/tetral:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/tetral-queue
          env:
            - name: TETRAL_DATABASE_TLS_CA_PATH
              value: /var/run/tetral/store-trust/database-ca.crt
            - name: TETRAL_DATABASE_TLS_SERVER_NAME
              value: "tetral-postgres.tetral-system.svc.cluster.local"
            - name: TETRAL_DB_MAX_OPEN_CONNS
              value: "20"
            - name: TETRAL_QUEUE_DRAIN_TIMEOUT_MS
              value: "10000"
            - name: TETRAL_TRANSPORT_PROFILE
              value: "standard-routed"
            - name: TETRAL_QUEUE_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_HTTP_ADDR
            - name: TETRAL_QUEUE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_GRPC_ADDR
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_DEPLOYMENT_ENVIRONMENT
            - name: TETRAL_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_SERVICE_VERSION
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "queue-database"
                  key: url
            - name: TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS
            - name: TETRAL_QUEUE_LEASE_RECLAIM_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_LEASE_RECLAIM_LIMIT
            - name: TETRAL_QUEUE_RETRY_BASE_MS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_BASE_MS
            - name: TETRAL_QUEUE_RETRY_CAP_MS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_CAP_MS
            - name: TETRAL_QUEUE_RETRY_MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_MAX_ATTEMPTS
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: store-trust
              mountPath: /var/run/tetral/store-trust
              readOnly: true
          resources:

            limits:
              cpu: 500m
              ephemeral-storage: 512Mi
              memory: 512Mi
            requests:
              cpu: 100m
              ephemeral-storage: 128Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: store-trust
          configMap:
            name: "tetral-store-trust"
---
apiVersion: v1
kind: Service
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: queue
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: queue
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: job-runner
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: job-runner
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tetral-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
