apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runtime
  namespace: tetral-agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: tetral-agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/nativeSidecar: "true"
        sidecar.istio.io/proxyImage: "docker.io/istio/proxyv2:1.31.1@sha256:d86cba0dd1eb15c00b6901c69ce5ae3d2d5f8427a47751098cf8c3ab2a4a62e9"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true,"terminationDrainDuration":"5s"}'
        traffic.sidecar.istio.io/excludeInboundPorts: "19090"
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/part-of: tetral
        istio.io/rev: "1-31-1"
    spec:
      serviceAccountName: agent-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      containers:
        - name: agent-runtime
          image: ghcr.io/tetral-ai/agent-runtime:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command:
            - bun
            - /app/dist/command.js
          env:
            - name: TETRAL_LOG_BURST
              value: "1"
            - name: TETRAL_LOG_LEVEL
              value: "info"
            - name: TETRAL_LOG_MAX_RECORD_BYTES
              value: "16384"
            - name: TETRAL_LOG_SUMMARY_INTERVAL_MS
              value: "30000"
            - name: TETRAL_RUNTIME_DRAIN_TIMEOUT_MS
              value: "60000"
            - name: TETRAL_RUNTIME_SETTLEMENT_TIMEOUT_MS
              value: "15000"
            - name: TETRAL_RUNTIME_SETTLEMENT_ATTEMPT_TIMEOUT_MS
              value: "5000"
            - name: TETRAL_RUNTIME_LOCAL_JOIN_TIMEOUT_MS
              value: "5000"
            - name: TETRAL_RUNTIME_PROXY_JOIN_TIMEOUT_MS
              value: "5000"
            - name: TETRAL_TRANSPORT_PROFILE
              value: "standard-routed"
            - name: TETRAL_ROUTING_PROXY_REQUIRED
              value: "true"
            - name: TETRAL_RUNTIME_POD_HTTP_ADDR
              value: 0.0.0.0:8080
            - name: TETRAL_RUNTIME_POD_GRPC_PORT
              value: "19090"
            - name: TETRAL_RUNTIME_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TETRAL_RUNTIME_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TETRAL_RUNTIME_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: TETRAL_RUNTIME_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              value: "local"
            - name: TETRAL_SERVICE_VERSION
              value: "dev"
            - name: TETRAL_RUNTIME_POD_GRPC_AUDIENCE
              value: tetral-internal-grpc
            - name: TETRAL_INTERNAL_ALLOWED_SERVICE_ACCOUNTS
              value: tetral-system/job-runner
            - name: TETRAL_RUNTIME_POD_OUTBOUND_GRPC_TOKEN_PATH
              value: /var/run/secrets/tetral-internal-grpc/runtime-pod/token
            - name: TETRAL_BRIDGE_API_GRPC_ADDR
              value: bridge.tetral-system.svc.cluster.local:9090
            - name: TETRAL_GATEWAY_GRPC_ADDR
              value: dns:///provider-gateway.tetral-system.svc.cluster.local:9090
            - name: TETRAL_MCP_CONNECTOR_GRPC_ADDR
              value: dns:///mcp-connector.tetral-system.svc.cluster.local:9091
            - name: TETRAL_WEB_CONNECTOR_GRPC_ADDR
              value: dns:///web-connector.tetral-system.svc.cluster.local:9092
            - name: TETRAL_RUNTIME_APPROVAL_REVIEWER_MODEL
              value: deepseek/deepseek-v4-pro
            - name: TETRAL_RUNTIME_SKILL_GUIDANCE_DESCRIPTION_BUDGET_BYTES
              value: "32768"
            - name: TETRAL_RUNTIME_PROVIDER_STREAM_TIMEOUT_MS
              value: "1800000"
            - name: KUBERNETES_TOKEN_REVIEW_REVIEWER_TOKEN_PATH
              value: /var/run/secrets/tetral-kubernetes-api/runtime-pod-tokenreview/token
            - name: KUBERNETES_API_SERVER_URL
              value: https://kubernetes.default.svc
            - name: KUBERNETES_API_CA_CERT_PATH
              value: /var/run/secrets/tetral-kubernetes-api/ca.crt
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 19090
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:

            limits:
              cpu: "1"
              ephemeral-storage: 1Gi
              memory: 1Gi
            requests:
              cpu: 250m
              ephemeral-storage: 256Mi
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-pod-internal-grpc-token
              mountPath: /var/run/secrets/tetral-internal-grpc/runtime-pod
              readOnly: true
            - name: runtime-pod-kubernetes-api
              mountPath: /var/run/secrets/tetral-kubernetes-api
              readOnly: true
      volumes:
        - name: runtime-pod-internal-grpc-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: tetral-internal-grpc
                  expirationSeconds: 600
                  path: token
        - name: runtime-pod-kubernetes-api
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 600
                  path: runtime-pod-tokenreview/token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: tetral-agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-runtime
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc-direct
      port: 19090
      targetPort: 19090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-runtime
  namespace: tetral-agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: tetral
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-system
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: job-runner
      ports:
        - protocol: TCP
          port: 19090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bridge
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: provider-gateway
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-connector
      ports:
        - protocol: TCP
          port: 9091
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: web-connector
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
