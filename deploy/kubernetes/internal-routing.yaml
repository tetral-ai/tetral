apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: tetral-runner-queue
  namespace: tetral-system
spec:
  host: queue.tetral-system.svc.cluster.local
  exportTo: ["."]
  workloadSelector:
    matchLabels:
      app.kubernetes.io/name: job-runner
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 9090
        loadBalancer:
          simple: LEAST_REQUEST
        connectionPool:
          tcp:
            connectTimeout: 1s
          http:
            h2UpgradePolicy: UPGRADE
        outlierDetection:
          splitExternalLocalOriginErrors: true
          consecutiveLocalOriginFailures: 2
          consecutive5xxErrors: 0
          consecutiveGatewayErrors: 0
          baseEjectionTime: 10s
          maxEjectionPercent: 100
          minHealthPercent: 0
        tls:
          mode: DISABLE
---
