apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: tetral-runner-queue
  namespace: tetral-system
spec:
  hosts: ["queue.tetral-system.svc.cluster.local"]
  gateways: [mesh]
  exportTo: ["."]
  http:
    - match:
        - port: 9090
          sourceNamespace: tetral-system
          sourceLabels:
            app.kubernetes.io/name: job-runner
      timeout: 5s
      retries:
        attempts: 0
      route:
        - destination:
            host: queue.tetral-system.svc.cluster.local
            port:
              number: 9090
          weight: 100
