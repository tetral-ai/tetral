apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-runner-visibility
  namespace: tetral-agent-runtime
  labels:
    app.kubernetes.io/name: job-runner
    app.kubernetes.io/part-of: tetral
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-runner-visibility
  namespace: tetral-agent-runtime
  labels:
    app.kubernetes.io/name: job-runner
    app.kubernetes.io/part-of: tetral
subjects:
  - kind: ServiceAccount
    name: job-runner
    namespace: tetral-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-runner-visibility
