apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tetral-agent-runtime-istiod
  namespace: tetral-agent-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istiod
              istio.io/rev: "1-31-1"
      ports:
        - protocol: TCP
          port: 15012
---
