apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: tetral-bridge-protected
  namespace: tetral-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bridge
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # Canonical inventory retains full URI; Istio adds its prefix.
              - "cluster.local/ns/tetral-agent-runtime/sa/agent-runtime"
              # Canonical inventory retains full URI; Istio adds its prefix.
              - "cluster.local/ns/tetral-system/sa/mcp-connector"
              # Canonical inventory retains full URI; Istio adds its prefix.
              - "cluster.local/ns/tetral-system/sa/provider-gateway"
      to:
        - operation:
            ports: ["9090"]
    # Probes and nonbusiness listeners retain their owning NetworkPolicy.
    - to:
        - operation:
            notPorts: ["9090"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: tetral-mcp-connector-protected
  namespace: tetral-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-connector
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # Canonical inventory retains full URI; Istio adds its prefix.
              - "cluster.local/ns/tetral-agent-runtime/sa/agent-runtime"
              # Canonical inventory retains full URI; Istio adds its prefix.
              - "cluster.local/ns/tetral-system/sa/job-runner"
              # Canonical inventory retains full URI; Istio adds its prefix.
              - "cluster.local/ns/tetral-system/sa/bridge"
      to:
        - operation:
            ports: ["9091"]
    # Probes and nonbusiness listeners retain their owning NetworkPolicy.
    - to:
        - operation:
            notPorts: ["9091"]
---
