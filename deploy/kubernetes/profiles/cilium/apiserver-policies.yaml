apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-runtime-apiserver-egress
  namespace: tetral-agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: tetral
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
            - port: '6443'
              protocol: TCP
---
