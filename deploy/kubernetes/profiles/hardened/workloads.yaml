  namespace: tetral-agent-runtime
data:
  leaf.yaml: |
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: tetral.runtime.direct_leaf
        tls_certificate:
          certificate_chain:
            filename: /var/run/tetral/runtime-direct/leaf/tls.crt
          private_key:
            filename: /var/run/tetral/runtime-direct/leaf/tls.key
          watched_directory:
            path: /var/run/tetral/runtime-direct/leaf
  validation.yaml: |
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: tetral.runtime.direct_validation
        validation_context:
          trusted_ca:
            filename: /var/run/tetral/runtime-direct/trust/ca.crt
          watched_directory:
            path: /var/run/tetral/runtime-direct/trust
          match_typed_subject_alt_names:
            - san_type: URI
              matcher:
                exact: spiffe://cluster.local/ns/tetral-system/sa/job-runner
