apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: tetral-agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/nativeSidecar: "true"
        sidecar.istio.io/proxyImage: "docker.io/istio/proxyv2:1.31.1@sha256:d86cba0dd1eb15c00b6901c69ce5ae3d2d5f8427a47751098cf8c3ab2a4a62e9"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true,"terminationDrainDuration":"5s","proxyStatsMatcher":{"inclusionPrefixes":["sds.tetral.runtime.direct_leaf.","sds.tetral.runtime.direct_validation."]}}'
        traffic.sidecar.istio.io/excludeInboundPorts: "19443"
        sidecar.istio.io/userVolume: "[{\"name\":\"runtime-direct-leaf\",\"secret\":{\"secretName\":\"tetral-runtime-direct-tls\"}},{\"configMap\":{\"name\":\"tetral-runtime-direct-trust\"},\"name\":\"runtime-direct-trust\"},{\"configMap\":{\"name\":\"tetral-runtime-direct-sds\"},\"name\":\"runtime-direct-sds\"}]"
