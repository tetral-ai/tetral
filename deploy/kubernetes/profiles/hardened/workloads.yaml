  TETRAL_SANDBOX_JOB_POLL_INTERVAL: 1s
  TETRAL_SANDBOX_ENVIRONMENT_BUILD_WARN_AFTER: "10m"
  TETRAL_SANDBOX_ENVIRONMENT_BUILD_TIMEOUT: "30m"
