namespaces:
  create: false

# Where Tetral's dependencies live is a property of the cluster, not of
# Tetral, so every such location is a value here rather than a literal in
# a template: the API server, the database, the public edge data plane
# (publicIngressPeers), the DNS service, and the outbound-HTTPS allowance.
# The defaults reproduce the canonical manifests and are illustrative. With
# Cilium disabled, apiServerPeers and apiServerPort must name the API server
# endpoint that NetworkPolicy evaluates after Service translation - typically
# the control-plane endpoint addresses and their port, not the kubernetes
# ClusterIP 10.96.0.1:443. Each peer list is a plain NetworkPolicy peer list
# and accepts every peer shape that API allows - except
# ciliumDNSEndpointSelectors, which is a Cilium endpoint selector and
# uses Cilium's own label syntax.
#
# An empty list is refused at render time. Kubernetes reads an empty peer
# list as "match everything", so emptying one of these would widen the
# policy rather than narrow it.
network:
  apiServerPeers:
    - ipBlock:
        cidr: 10.96.0.1/32
  apiServerPort: 443
  databasePeers:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: tetral-postgres
  # Must match the port in the database DSN carried by the Secrets. Managed
  # PostgreSQL often does not listen on 5432, and a pooler in front of it
  # often does not either.
  databasePort: 5432
  publicIngressPeers:
    - namespaceSelector:
        matchLabels:
          tetral.ai/network-role: public-ingress
  # Cluster DNS. Every workload resolves names, so an override that does not
  # match the cluster's DNS topology - a different namespace, different pod
  # labels, NodeLocal DNSCache - breaks every service at once rather than one.
  dnsPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  # The same DNS dependency expressed for the opt-in git-proxy FQDN policy.
  # When cilium.gitProxyFQDNPolicy is enabled, its CiliumNetworkPolicy carries
  # the L7 DNS rule that teaches Cilium the addresses behind the toFQDNs
  # allowance, so this selector has to track dnsPeers.
  ciliumDNSEndpointSelectors:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
  # Outbound HTTPS for the workloads that call operator-selected endpoints:
  # API, Bridge, Job Runner and Web Connector blob storage; the Sandbox
  # provider and blob storage; Provider Gateway model providers; MCP
  # Connector remote MCP servers; Web Connector search and reader; and the
  # git-proxy upstream. The default is unrestricted because those endpoints are
  # operator-chosen and resolve dynamically. NetworkPolicy is a union of
  # allows, so this cannot be narrowed by adding another policy - a deployment
  # that requires an egress gateway or a fixed provider range narrows it here.
  externalEgressPeers:
    - ipBlock:
        cidr: 0.0.0.0/0
  # Must match explicit ports in the operator-selected provider, sandbox,
  # blob, and web endpoint URLs.
  externalEgressPorts:
    - 443

cilium:
  enabled: false
  # Opt-in network-layer GitHub restriction for git-proxy. This requires a CNI
  # whose L7 DNS interception works. It is measured broken on Cilium 1.19.6
  # with k3s, VXLAN, and legacy host routing (cilium/cilium#46284); enabling it
  # there makes git-proxy unable to resolve any name.
  gitProxyFQDNPolicy: false

sandbox:
  # Applied on the first build claim; active builds retain their saved policy.
  environmentBuildWarnAfter: 10m
  environmentBuildTimeout: 30m
  # Enables Sandbox-only debug lines for queue wait decisions and bounded
  # command summaries. Provider completion timings remain at info level.
  debugLogging: false

edge:
  enabled: false
  gatewayClassName: tetral-envoy-gateway
  apiHost: api.tetral.example
  apiTLSSecretName: tetral-api-public-tls
  gitTLSSecretName: tetral-git-public-tls
  trustConfigMap: tetral-edge-native-trust
  clientLeafSecret: tetral-edge-client-tls
  serverLeafSecrets:
    auth: tetral-auth-edge-tls
    api: tetral-api-edge-tls
    event-stream: tetral-event-stream-edge-tls
    git-proxy: tetral-git-proxy-edge-tls

image:
  registry: ghcr.io/tetral-ai
  # Empty means Chart.appVersion: 0.0.0-dev in a source checkout and the exact
  # numbered version in a packaged release. Operators may still override it.
  tag: ""
  digests:
    tetral: ""
    gateway: ""
    agent-runtime: ""
    sandbox: ""

secrets:
  apiDatabase: api-database
  apiSecrets: api-secrets
  authBootstrap: auth-bootstrap
  authDatabase: auth-database
  authInternalPrincipal: auth-internal-principal
  gatewayWebBlob: gateway-web-blob
  gatewayWebKeypool: gateway-web-keypool
  queueDatabase: queue-database
  runtimeBindingToken: runtime-binding-token
  sandboxBlob: sandbox-blob
  sandboxDaytona: sandbox-daytona
  sandboxR2Parent: sandbox-r2-parent
  tetralBlob: tetral-blob
  tetralDatabase: tetral-database
  eventStreamDatabase: tetral-event-stream-database

daytona:
  sandboxAPIURL: https://daytona.example.internal/api
  # Daytona region the platform creates sandboxes in. Daytona Cloud has no
  # region literally named "default" — asking for one answers "Region not
  # found" and no sandbox is ever created — so this must name a real region
  # (Daytona Cloud ships "us" and "eu").
  target: us

blob:
  endpoint: https://blob.example.internal
  region: local
  bucket: tetral-files
  r2AccountID: replace-me

web:
  searchEndpoint: https://s.jina.ai/
  readerEndpoint: https://r.jina.ai/

gitProxyHost: git.tetral.example
bootstrapWorkspaceID: existing-workspace-id

observability:
  deploymentEnvironment: local
  serviceVersion: dev
  # Restart-required controls shared by every application process.
  logLevel: info
  logMaxRecordBytes: 16384
  logSummaryIntervalMs: 30000
  logBurst: 1

queue:
  leaseReclaimIntervalSeconds: 30
  leaseReclaimLimit: 100
  retryBaseMs: 1000
  retryCapMs: 60000
  retryMaxAttempts: 10

jobRunner:
  leaseDurationMs: 30000
  heartbeatIntervalMs: 10000
  maxJobs: 8
  pollIntervalMs: 1000

resources:
  agentRuntime:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi
  api:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi
  auth:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  bridgeAPI:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi
  jobRunner:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  cleanup:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 512Mi
  eventStream:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  providerGateway:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi
  mcpConnector:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  webConnector:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  gitProxy:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 512Mi
  queue:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  sandbox:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 2Gi

# Each Deployment starts independently; enabled provider autoscaling retains its floor of two.
replicas:
  # Event Stream distributes new SSE connections; active streams stay on their Pod.
  eventStream: 1
  api: 1
  auth: 1
  bridge: 1
  jobRunner: 1
  sandbox: 1
  providerGateway: 1
  mcpConnector: 1
  webConnector: 1
autoscaling:
  providerGateway:
    enabled: true
    maxReplicas: 10

# Istiod is installed separately; these workload routes are mandatory in both
# profiles and are not a chart option. The revision must equal the locked Istio
# revision 1-31-1; any other value is rejected.
routing:
  revision: 1-31-1
  trustDomain: cluster.local
transport:
  profile: standard-routed
  # Operator-provided public trust; no workload receives an issuer signing key.
  storeTrustConfigMap: tetral-store-trust
  databaseServerName: tetral-postgres.tetral-system.svc.cluster.local
  blobServerName: tetral-object-store.tetral-system.svc.cluster.local
  runtimeDirectTrustConfigMap: tetral-runtime-direct-trust
  runtimeDirectLeafSecret: tetral-runtime-direct-tls
  runnerDirectLeafSecret: tetral-runner-direct-tls
  runtimeServerName: agent-runtime.tetral-agent-runtime.svc.cluster.local
  # Aggregate server capacity includes rollout surge, both Bun generations and reserve.
  databaseCapacity: null
  databaseReserve: 8
  goPoolMax: 20
  bunPoolMax: 10
  externalDatabaseConnections: null

# Core NATS is an independently installed, pinned official-chart release.
# Disable only previews; PostgreSQL formal SSE always remains active.
preview:
  enabled: true
  brokerAddress: tetral-nats.tetral-system.svc.cluster.local:4222
  publisherSecret: tetral-nats-publisher
  subscriberSecret: tetral-nats-subscriber
  trustConfigMap: tetral-nats-client-trust
  publisherLeafSecret: tetral-nats-publisher-tls
  subscriberLeafSecret: tetral-nats-subscriber-tls
  gateway:
    queueBytes: 4194304
    queueFrames: 1024
    batchBytes: 262144
    batchFrames: 64
    connectTimeoutMs: 1000
    flushTimeoutMs: 1000
    retryMaxMs: 5000
    credentialPollMs: 250
    pingIntervalMs: 1000
    maxPingOut: 1
  subscriber:
    connectTimeoutMs: 1000
    reconnectWaitMs: 1000
    pingIntervalMs: 120000
    maxPingOut: 2

# Projections of Event Stream's typed defaults, including formal SSE timers.
eventStream:
  pollIntervalMs: 1000
  heartbeatIntervalMs: 1000
  writeTimeoutMs: 10000
  previewSetupTimeoutMs: 1000
  hubMaxBytes: 8388608
  hubMaxFrames: 2048
  viewerMaxBytes: 262144
  viewerMaxFrames: 128
  subscriptionMaxBytes: 8388608
  subscriptionMaxFrames: 2048
  activeRequests: 32

# Resolved against each workload replica/HPA bound in the connection ledger.
rollout:
  maxSurge: 1

# Application drains and cancellation joins are bounded inside each Pod grace.
lifecycle:
  # Checked projections of the Runtime typed phase defaults; Pod grace adds a fixed 5s signal margin.
  runtimeDrainMs: 60000
  runtimeSettlementMs: 15000
  # Per-attempt final settlement cap, clipped to method/caller/remaining phase; not another phase allocation.
  settlementAttemptTimeoutMs: 5000
  runtimeLocalJoinMs: 5000
  runtimeProxyJoinMs: 5000
  runtimeGraceSeconds: 90
  bridgeDrainMs: 40000
  runnerDrainMs: 30000
  sandboxDrainMs: 30000
  cancelJoinMs: 5000
  providerDrainMs: 30000
  providerJoinMs: 5000
  mcpDrainMs: 30000
  mcpJoinMs: 5000
  webDrainMs: 10000
  queueDrainMs: 10000

# Optional native leaf automation. The issuer is an operator-installed,
# separately scoped intermediate; signing material never enters this chart.
# Leaf lifetimes are fixed by the chart at 24h with an 8h renewal lead and
# per-renewal key rotation; they are a security contract, not a value.
nativeCertificates:
  enabled: false
  issuerName: tetral-native

# Federation URLs, CA trust and private CIDRs are imported by tetral-auth-policy
# into Auth's durable registry. Only Auth may make the corresponding native
# HTTPS requests. Supply exact public CIDRs or private namespace/Pod peers.
authIssuerNetwork:
  enabled: false
  peers: []
  ports:
    - 443
