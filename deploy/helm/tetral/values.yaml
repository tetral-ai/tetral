namespaces:
  create: false

# Where Tetral's dependencies live is a property of the cluster, not of
# Tetral, so every such location is a value here rather than a literal in
# a template: the API server, the database, the ingress controller, the
# DNS service, and the outbound-HTTPS allowance. The defaults reproduce
# the canonical manifests, so a cluster shaped like the kubeadm default
# needs none of them. Each peer list is a plain NetworkPolicy peer list
# and accepts every peer shape that API allows - except
# ciliumDNSEndpointSelectors, which is a Cilium endpoint selector and
# uses Cilium's own label syntax.
#
# An empty list is refused at render time. Kubernetes reads an empty peer
# list as "match everything", so emptying one of these would widen the
# policy rather than narrow it.
network:
  apiServerPeers:
    - ipBlock:
        cidr: 10.96.0.1/32
  databasePeers:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: tetral-postgres
  # Must match the port in the database DSN carried by the Secrets. Managed
  # PostgreSQL often does not listen on 5432, and a pooler in front of it
  # often does not either.
  databasePort: 5432
  publicIngressPeers:
    - namespaceSelector:
        matchLabels:
          tetral.ai/network-role: public-ingress
  # Cluster DNS. Every workload resolves names, so an override that does not
  # match the cluster's DNS topology - a different namespace, different pod
  # labels, NodeLocal DNSCache - breaks every service at once rather than one.
  dnsPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  # The same DNS dependency expressed for the opt-in git-proxy FQDN policy.
  # When cilium.gitProxyFQDNPolicy is enabled, its CiliumNetworkPolicy carries
  # the L7 DNS rule that teaches Cilium the addresses behind the toFQDNs
  # allowance, so this selector has to track dnsPeers.
  ciliumDNSEndpointSelectors:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
  # Outbound HTTPS for the five workloads that call third-party APIs (model
  # providers, the sandbox provider, blob storage, the web reader, and
  # git-proxy). The default is unrestricted because those endpoints are
  # operator-chosen and resolve dynamically. NetworkPolicy is a union of
  # allows, so this cannot be narrowed by adding another policy - a deployment
  # that requires an egress gateway or a fixed provider range narrows it here.
  externalEgressPeers:
    - ipBlock:
        cidr: 0.0.0.0/0
  # Must match explicit ports in the operator-selected provider, sandbox,
  # blob, and web endpoint URLs.
  externalEgressPorts:
    - 443

cilium:
  enabled: true
  # Opt-in network-layer GitHub restriction for git-proxy. This requires a CNI
  # whose L7 DNS interception works. It is measured broken on Cilium 1.19.6
  # with k3s, VXLAN, and legacy host routing (cilium/cilium#46284); enabling it
  # there makes git-proxy unable to resolve any name.
  gitProxyFQDNPolicy: false

sandbox:
  # Enables Sandbox-only debug lines for queue wait decisions and bounded
  # command summaries. Provider completion timings remain at info level.
  debugLogging: false

edge:
  enabled: false
  tlsSecretName: git-proxy-tls

image:
  registry: ghcr.io/tetral-ai
  # Empty means Chart.appVersion: 0.0.0-dev in a source checkout and the exact
  # numbered version in a packaged release. Operators may still override it.
  tag: ""
  digests:
    tetral: ""
    gateway: ""
    agent-runtime: ""
    sandbox: ""

secrets:
  apiDatabase: api-database
  apiSecrets: api-secrets
  authBootstrap: auth-bootstrap
  authDatabase: auth-database
  authInternalPrincipal: auth-internal-principal
  gatewayWebBlob: gateway-web-blob
  gatewayWebKeypool: gateway-web-keypool
  queueDatabase: queue-database
  runtimeBindingToken: runtime-binding-token
  sandboxBlob: sandbox-blob
  sandboxDaytona: sandbox-daytona
  sandboxR2Parent: sandbox-r2-parent
  tetralBlob: tetral-blob
  tetralDatabase: tetral-database
  eventStreamDatabase: tetral-event-stream-database

daytona:
  sandboxAPIURL: https://daytona.example.internal/api
  # Daytona region the platform creates sandboxes in. Daytona Cloud has no
  # region literally named "default" — asking for one answers "Region not
  # found" and no sandbox is ever created — so this must name a real region
  # (Daytona Cloud ships "us" and "eu").
  target: us

blob:
  endpoint: https://blob.example.internal
  region: local
  bucket: tetral-files
  r2AccountID: replace-me

web:
  searchEndpoint: https://s.jina.ai/
  readerEndpoint: https://r.jina.ai/

gitProxyHost: git.tetral.example
bootstrapWorkspaceID: existing-workspace-id

observability:
  deploymentEnvironment: local
  serviceVersion: dev

resources:
  agentRuntime:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi
  api:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi
  auth:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  bridgeAPI:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi
  bridgeJobRunner:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  cleanup:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 512Mi
  eventStream:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  providerGateway:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi
  mcpConnector:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  webConnector:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  gitProxy:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 512Mi
  queue:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
  sandbox:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 2Gi
