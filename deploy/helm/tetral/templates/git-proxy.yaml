apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: git-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-proxy
        app.kubernetes.io/part-of: tetral
    spec:
      serviceAccountName: git-proxy
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1800
      containers:
        - name: git-proxy
          image: {{ .Values.image.registry }}/tetral:{{ include "tetral.imageTag" . }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/git-proxy
          env:
            - name: TETRAL_GIT_PROXY_HTTP_ADDR
              value: ":8080"
            - name: TETRAL_GIT_PROXY_METRICS_ADDR
              value: ":8081"
            - name: TETRAL_GIT_PROXY_PUBLIC_BASE_URL
              value: "https://{{ .Values.gitProxyHost }}"
            - name: TETRAL_GIT_PROXY_DRAIN_GRACE_SECONDS
              value: "1800"
            - name: TETRAL_GIT_PROXY_LEGACY_PATH_CUTOVER
              value: "true"
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.observability.deploymentEnvironment | quote }}
            - name: TETRAL_SERVICE_VERSION
              value: {{ .Values.observability.serviceVersion | quote }}
            - name: TETRAL_SCHEMA_MODE
              value: verify
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.tetralDatabase | quote }}
                  key: git-proxy-url
            - name: ENGINE_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.apiSecrets | quote }}
                  key: engine-vault-key
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
{{ toYaml .Values.resources.gitProxy | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
    tetral.ai/exposure: public
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: git-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 8081
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/egress-intent: "github.com"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: git-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
{{- toYaml .Values.network.publicIngressPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
{{- toYaml .Values.network.databasePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.network.databasePort }}
{{- if not .Values.cilium.enabled }}
    - to:
{{- toYaml .Values.network.dnsPeers | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
---
{{ if .Values.cilium.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: git-proxy-github-egress
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: git-proxy
  egress:
    - toEndpoints:
{{- toYaml .Values.network.ciliumDNSEndpointSelectors | nindent 8 }}
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{ end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/hpa-metric-source: "prometheus-adapter: gitproxy_active_connections and rate(gitproxy_bytes_relayed_total[2m])"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: git-proxy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: gitproxy_active_connections
        target:
          type: AverageValue
          averageValue: "100"
    - type: Pods
      pods:
        metric:
          name: gitproxy_bytes_relayed_per_second
          selector:
            matchLabels:
              direction: in
        target:
          type: AverageValue
          averageValue: 20Mi
    - type: Pods
      pods:
        metric:
          name: gitproxy_bytes_relayed_per_second
          selector:
            matchLabels:
              direction: out
        target:
          type: AverageValue
          averageValue: 20Mi
