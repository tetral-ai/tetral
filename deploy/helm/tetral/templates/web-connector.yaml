---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-connector-config
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: web-connector
    app.kubernetes.io/part-of: tetral
data:
  TETRAL_WEB_SEARCH_ENDPOINT: {{ .Values.web.searchEndpoint | quote }}
  TETRAL_WEB_READER_ENDPOINT: {{ .Values.web.readerEndpoint | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-connector
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: web-connector
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-connector
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: web-connector
    app.kubernetes.io/part-of: tetral
spec:
  replicas: {{ .Values.replicas.webConnector }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: {{ .Values.rollout.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: web-connector
  template:
    metadata:
      annotations:
{{- if eq .Values.transport.profile "hardened" }}
{{ include "tetral.routingAnnotations" (dict "root" . "role" "web-connector") | indent 8 }}
{{- else }}
        sidecar.istio.io/inject: "false"
{{- end }}
      labels:
        app.kubernetes.io/name: web-connector
        app.kubernetes.io/part-of: tetral
{{- if eq .Values.transport.profile "hardened" }}
        istio.io/rev: {{ .Values.routing.revision | quote }}
{{- end }}
    spec:
      serviceAccountName: web-connector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: web-connector
          image: {{ include "tetral.image" (dict "root" . "name" "tetral") }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/web-connector
          env:
{{ include "tetral.storeTLSEnv" (dict "root" . "database" false "blob" true "bun" false) | trim | indent 12 }}
            - name: TETRAL_SERVICE_DRAIN_TIMEOUT_MS
              value: {{ .Values.lifecycle.webDrainMs | quote }}
            - name: TETRAL_CANCEL_JOIN_TIMEOUT_MS
              value: {{ .Values.lifecycle.cancelJoinMs | quote }}
            - name: TETRAL_TRANSPORT_PROFILE
              value: {{ .Values.transport.profile | quote }}
{{- if eq .Values.transport.profile "hardened" }}
            - name: TETRAL_ROUTING_PROXY_REQUIRED
              value: "true"
{{- end }}
            - name: TETRAL_WEB_CONNECTOR_GRPC_ADDR
              value: 0.0.0.0:9092
            - name: TETRAL_WEB_CONNECTOR_METRICS_ADDR
              value: 0.0.0.0:9464
            - name: TETRAL_WEB_SEARCH_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: web-connector-config
                  key: TETRAL_WEB_SEARCH_ENDPOINT
            - name: TETRAL_WEB_READER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: web-connector-config
                  key: TETRAL_WEB_READER_ENDPOINT
            - name: TETRAL_WEB_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gatewayWebKeypool | quote }}
                  key: TETRAL_WEB_API_KEYS
            - name: TETRAL_BLOB_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gatewayWebBlob | quote }}
                  key: TETRAL_BLOB_ENDPOINT
            - name: TETRAL_BLOB_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gatewayWebBlob | quote }}
                  key: TETRAL_BLOB_REGION
            - name: TETRAL_BLOB_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gatewayWebBlob | quote }}
                  key: TETRAL_BLOB_BUCKET
            - name: TETRAL_BLOB_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gatewayWebBlob | quote }}
                  key: TETRAL_BLOB_ACCESS_KEY
            - name: TETRAL_BLOB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gatewayWebBlob | quote }}
                  key: TETRAL_BLOB_SECRET_KEY
            - name: TETRAL_RUNTIME_BINDING_TOKEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtimeBindingToken | quote }}
                  key: hmac-key
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.observability.deploymentEnvironment | quote }}
            - name: TETRAL_SERVICE_VERSION
              value: {{ .Values.observability.serviceVersion | quote }}
            - name: TETRAL_INTERNAL_GRPC_AUDIENCE
              value: tetral-internal-grpc
            - name: TETRAL_INTERNAL_ALLOWED_SERVICE_ACCOUNTS
              value: tetral-agent-runtime/agent-runtime
            - name: KUBERNETES_TOKEN_REVIEW_REVIEWER_TOKEN_PATH
              value: /var/run/secrets/tetral-kubernetes-api/web-connector-tokenreview/token
            - name: KUBERNETES_API_SERVER_URL
              value: https://kubernetes.default.svc
            - name: KUBERNETES_API_CA_CERT_PATH
              value: /var/run/secrets/tetral-kubernetes-api/ca.crt
          ports:
            - name: web-grpc
              containerPort: 9092
            - name: web-metrics
              containerPort: 9464
          livenessProbe:
            httpGet:
              path: /health
              port: web-metrics
          readinessProbe:
            httpGet:
              path: /ready
              port: web-metrics
          resources:
{{ toYaml .Values.resources.webConnector | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: store-trust
              mountPath: /var/run/tetral/store-trust
              readOnly: true
            - name: web-connector-kubernetes-api
              mountPath: /var/run/secrets/tetral-kubernetes-api
              readOnly: true
      volumes:
        - name: store-trust
          configMap:
            name: {{ .Values.transport.storeTrustConfigMap | quote }}
        - name: web-connector-kubernetes-api
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 600
                  path: web-connector-tokenreview/token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: web-connector
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: web-connector
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web-connector
  ports:
    - name: web-grpc
      port: 9092
      targetPort: web-grpc
    - name: web-metrics
      port: 9464
      targetPort: web-metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-connector
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: web-connector
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/egress-intent: "{{ (urlParse .Values.web.searchEndpoint).host }}, {{ (urlParse .Values.web.readerEndpoint).host }}, {{ (urlParse .Values.blob.endpoint).host }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-connector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 9464
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-agent-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
      ports:
        - protocol: TCP
          port: 9092
  egress:
    - to:
{{- toYaml .Values.network.dnsPeers | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
{{- toYaml .Values.network.apiServerPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
    - to:
{{- toYaml .Values.network.externalEgressPeers | nindent 8 }}
      ports:
{{- range .Values.network.externalEgressPorts }}
        - protocol: TCP
          port: {{ . }}
{{- end }}
{{- if .Values.cilium.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: web-connector-apiserver-egress
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: web-connector
    app.kubernetes.io/part-of: tetral
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: web-connector
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
            - port: '6443'
              protocol: TCP
{{- end }}
