---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-connector
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: mcp-connector
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-connector
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: mcp-connector
    app.kubernetes.io/part-of: tetral
spec:
  replicas: {{ .Values.replicas.mcpConnector }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-connector
        app.kubernetes.io/part-of: tetral
    spec:
      serviceAccountName: mcp-connector
      automountServiceAccountToken: false
      containers:
        - name: mcp-connector
          image: {{ include "tetral.image" (dict "root" . "name" "gateway") }}
          imagePullPolicy: IfNotPresent
          command:
            - bun
            - /app/dist/mcp-connector/src-command.js
          env:
            - name: TETRAL_MCP_CONNECTOR_GRPC_ADDR
              value: 0.0.0.0:9091
            - name: TETRAL_MCP_CONNECTOR_HTTP_ADDR
              value: 0.0.0.0:8081
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.observability.deploymentEnvironment | quote }}
            - name: TETRAL_SERVICE_VERSION
              value: {{ .Values.observability.serviceVersion | quote }}
            - name: TETRAL_INTERNAL_GRPC_AUDIENCE
              value: tetral-internal-grpc
            - name: TETRAL_INTERNAL_ALLOWED_SERVICE_ACCOUNTS
              value: tetral-agent-runtime/agent-runtime
            - name: TETRAL_MCP_CONNECTOR_ALLOWED_BRIDGE_SERVICE_ACCOUNTS
              value: tetral-system/bridge,tetral-system/job-runner
            - name: TETRAL_BRIDGE_API_GRPC_ADDR
              value: bridge.tetral-system.svc.cluster.local:9090
            - name: TETRAL_MCP_CONNECTOR_BRIDGE_TOKEN_PATH
              value: /var/run/secrets/tetral-internal-grpc/bridge/token
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.tetralDatabase | quote }}
                  key: gateway-url
            - name: ENGINE_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.apiSecrets | quote }}
                  key: engine-vault-key
            - name: TETRAL_RUNTIME_BINDING_TOKEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtimeBindingToken | quote }}
                  key: hmac-key
            - name: KUBERNETES_TOKEN_REVIEW_REVIEWER_TOKEN_PATH
              value: /var/run/secrets/tetral-kubernetes-api/mcp-connector-tokenreview/token
            - name: KUBERNETES_API_SERVER_URL
              value: https://kubernetes.default.svc
            - name: KUBERNETES_API_CA_CERT_PATH
              value: /var/run/secrets/tetral-kubernetes-api/ca.crt
          ports:
            - name: mcp-grpc
              containerPort: 9091
            - name: mcp-http
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp-http
          readinessProbe:
            httpGet:
              path: /readyz
              port: mcp-http
          resources:
{{ toYaml .Values.resources.mcpConnector | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: mcp-connector-kubernetes-api
              mountPath: /var/run/secrets/tetral-kubernetes-api
              readOnly: true
            - name: mcp-connector-bridge-token
              mountPath: /var/run/secrets/tetral-internal-grpc/bridge
              readOnly: true
      volumes:
        - name: mcp-connector-kubernetes-api
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 600
                  path: mcp-connector-tokenreview/token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: mcp-connector-bridge-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: tetral-internal-grpc
                  expirationSeconds: 600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-connector
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: mcp-connector
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-connector
  ports:
    - name: mcp-grpc
      port: 9091
      targetPort: mcp-grpc
    - name: mcp-http
      port: 8081
      targetPort: mcp-http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-connector
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: mcp-connector
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/egress-intent: "api.githubcopilot.com"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-connector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8081
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-agent-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
      ports:
        - protocol: TCP
          port: 9091
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bridge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: job-runner
      ports:
        - protocol: TCP
          port: 9091
  egress:
    - to:
{{- toYaml .Values.network.databasePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.network.databasePort }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bridge
      ports:
        - protocol: TCP
          port: 9090
    - to:
{{- toYaml .Values.network.dnsPeers | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
{{- toYaml .Values.network.apiServerPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
    - to:
{{- toYaml .Values.network.externalEgressPeers | nindent 8 }}
      ports:
{{- range .Values.network.externalEgressPorts }}
        - protocol: TCP
          port: {{ . }}
{{- end }}
{{- if .Values.cilium.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-connector-apiserver-egress
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: mcp-connector
    app.kubernetes.io/part-of: tetral
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-connector
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
            - port: '6443'
              protocol: TCP
{{- end }}
