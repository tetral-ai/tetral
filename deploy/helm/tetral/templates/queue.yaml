apiVersion: v1
kind: ConfigMap
metadata:
  name: queue-config
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
data:
  TETRAL_QUEUE_HTTP_ADDR: ":8080"
  TETRAL_QUEUE_GRPC_ADDR: ":9090"
  TETRAL_DEPLOYMENT_ENVIRONMENT: {{ .Values.observability.deploymentEnvironment | quote }}
  TETRAL_SERVICE_VERSION: {{ .Values.observability.serviceVersion | quote }}
  TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS: "30"
  TETRAL_QUEUE_LEASE_RECLAIM_LIMIT: "100"
  TETRAL_QUEUE_RETRY_BASE_MS: "1000"
  TETRAL_QUEUE_RETRY_CAP_MS: "60000"
  TETRAL_QUEUE_RETRY_MAX_ATTEMPTS: "10"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: {{ .Values.rollout.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: queue
  template:
    metadata:
      annotations:
{{- if eq .Values.transport.profile "hardened" }}
{{ include "tetral.routingAnnotations" (dict "root" . "role" "queue") | indent 8 }}
{{- else }}
        sidecar.istio.io/inject: "false"
{{- end }}
      labels:
        app.kubernetes.io/name: queue
        app.kubernetes.io/part-of: tetral
{{- if eq .Values.transport.profile "hardened" }}
        istio.io/rev: {{ .Values.routing.revision | quote }}
{{- end }}
    spec:
      serviceAccountName: queue
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: queue
          image: {{ include "tetral.image" (dict "root" . "name" "tetral") }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/tetral-queue
          env:
{{ include "tetral.storeTLSEnv" (dict "root" . "database" true "blob" false "bun" false) | trim | indent 12 }}
            - name: TETRAL_DRAIN_TIMEOUT_MS
              value: {{ .Values.lifecycle.queueDrainMs | quote }}
            - name: TETRAL_CANCEL_JOIN_TIMEOUT_MS
              value: {{ .Values.lifecycle.cancelJoinMs | quote }}
            - name: TETRAL_TRANSPORT_PROFILE
              value: {{ .Values.transport.profile | quote }}
{{- if eq .Values.transport.profile "hardened" }}
            - name: TETRAL_ROUTING_PROXY_REQUIRED
              value: "true"
{{- end }}
            - name: TETRAL_QUEUE_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_HTTP_ADDR
            - name: TETRAL_QUEUE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_GRPC_ADDR
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_DEPLOYMENT_ENVIRONMENT
            - name: TETRAL_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_SERVICE_VERSION
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.queueDatabase | quote }}
                  key: url
            - name: TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS
            - name: TETRAL_QUEUE_LEASE_RECLAIM_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_LEASE_RECLAIM_LIMIT
            - name: TETRAL_QUEUE_RETRY_BASE_MS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_BASE_MS
            - name: TETRAL_QUEUE_RETRY_CAP_MS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_CAP_MS
            - name: TETRAL_QUEUE_RETRY_MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_MAX_ATTEMPTS
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: store-trust
              mountPath: /var/run/tetral/store-trust
              readOnly: true
          resources:
{{ toYaml .Values.resources.queue | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: store-trust
          configMap:
            name: {{ .Values.transport.storeTrustConfigMap | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: queue
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: queue
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: job-runner
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: job-runner
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
{{- toYaml .Values.network.databasePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.network.databasePort }}
    - to:
{{- toYaml .Values.network.dnsPeers | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
