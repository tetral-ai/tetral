apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
data:
  TETRAL_AUTH_HTTP_ADDR: ":8080"
  TETRAL_AUTH_METRICS_ADDR: ":8081"
  TETRAL_DEPLOYMENT_ENVIRONMENT: {{ .Values.observability.deploymentEnvironment | quote }}
  TETRAL_SERVICE_VERSION: {{ .Values.observability.serviceVersion | quote }}
  ENGINE_BOOTSTRAP_WORKSPACE_ID: {{ .Values.bootstrapWorkspaceID | quote }}
  TETRAL_AUTH_INTERNAL_PRINCIPAL_TTL_SECONDS: "60"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: {{ .Values.replicas.auth }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: {{ .Values.rollout.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: tetral
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: auth
      automountServiceAccountToken: false
      containers:
        - name: auth
          image: {{ include "tetral.image" (dict "root" . "name" "tetral") }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/tetral-auth
          env:
{{ include "tetral.diagnosticEnv" . | trim | indent 12 }}
{{ include "tetral.storeTLSEnv" (dict "root" . "database" true "blob" false "bun" false) | trim | indent 12 }}
{{ include "tetral.edgeHTTPEnv" (dict "root" .) | trim | indent 12 }}
            - name: TETRAL_AUTH_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_AUTH_HTTP_ADDR
            - name: TETRAL_AUTH_METRICS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_AUTH_METRICS_ADDR
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_DEPLOYMENT_ENVIRONMENT
            - name: TETRAL_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_SERVICE_VERSION
            - name: ENGINE_BOOTSTRAP_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: ENGINE_BOOTSTRAP_WORKSPACE_ID
            - name: TETRAL_AUTH_INTERNAL_PRINCIPAL_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_AUTH_INTERNAL_PRINCIPAL_TTL_SECONDS
            - name: ENGINE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authBootstrap | quote }}
                  key: engine-api-key
            - name: TETRAL_AUTH_INTERNAL_PRINCIPAL_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authInternalPrincipal | quote }}
                  key: private_key_b64
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authDatabase | quote }}
                  key: url
            - name: TETRAL_AUTH_GRPC_ADDR
              value: ":9095"
            - name: TETRAL_AUTH_GRPC_TRANSPORT
              value: {{ ternary "native-mtls" "plaintext" (eq .Values.transport.profile "hardened") | quote }}
{{- if eq .Values.transport.profile "hardened" }}
            - name: TETRAL_AUTH_GRPC_TLS_CA_PATH
              value: /var/run/tetral/edge-trust/ca.crt
            - name: TETRAL_AUTH_GRPC_TLS_CERT_PATH
              value: /var/run/tetral/edge-leaf/tls.crt
            - name: TETRAL_AUTH_GRPC_TLS_KEY_PATH
              value: /var/run/tetral/edge-leaf/tls.key
            - name: TETRAL_AUTH_GRPC_TLS_EDGE_CLIENT_URI
              value: {{ printf "spiffe://%s/ns/envoy-gateway-system/sa/tetral-public-edge" .Values.routing.trustDomain | quote }}
{{- end }}
          ports:
            - name: grpc-check
              containerPort: 9095
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          volumeMounts:
{{ include "tetral.edgeHTTPMounts" . | trim | indent 12 }}
            - name: store-trust
              mountPath: /var/run/tetral/store-trust
              readOnly: true
          resources:
{{ toYaml .Values.resources.auth | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
{{ include "tetral.edgeHTTPVolumes" (dict "root" . "name" "auth") | trim | indent 8 }}
        - name: store-trust
          configMap:
            name: {{ .Values.transport.storeTrustConfigMap | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
    tetral.ai/exposure: public
spec:
  sessionAffinity: None
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: grpc-check
      port: 9095
      targetPort: grpc-check
      appProtocol: kubernetes.io/h2c
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: auth-metrics
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
{{- toYaml .Values.network.publicIngressPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9095
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-system
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
{{- toYaml .Values.network.databasePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.network.databasePort }}
    - to:
{{- toYaml .Values.network.dnsPeers | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
