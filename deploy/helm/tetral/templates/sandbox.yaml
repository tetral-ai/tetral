apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-config
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: sandbox
    app.kubernetes.io/part-of: tetral
data:
  DAYTONA_API_URL: {{ .Values.daytona.sandboxAPIURL | quote }}
  DAYTONA_TARGET: {{ .Values.daytona.target | quote }}
  # Environment artifact builds start FROM this image; it must be the same
  # sandbox image this release deploys, or every packages build fails at its
  # first Dockerfile line.
  TETRAL_SANDBOX_BASE_IMAGE: {{ include "tetral.image" (dict "root" . "name" "sandbox") }}
  TETRAL_QUEUE_GRPC_ADDR: queue.tetral-system.svc.cluster.local:9090
  TETRAL_GIT_PROXY_HOST: {{ .Values.gitProxyHost | quote }}
  TETRAL_SANDBOX_LEASE_HEARTBEAT_INTERVAL: 15s
  TETRAL_SANDBOX_JOB_LEASE_DURATION: 120s
  TETRAL_SANDBOX_PROVIDER_COMMAND_TIMEOUT: 45s
  TETRAL_SANDBOX_LATE_COMMAND_MARGIN: 30s
  TETRAL_SANDBOX_JOB_POLL_INTERVAL: 1s
  TETRAL_SANDBOX_DEBUG_LOGGING: {{ .Values.sandbox.debugLogging | quote }}
  TETRAL_SANDBOX_ENVIRONMENT_BUILD_CONCURRENCY: "1"
  TETRAL_SANDBOX_ENVIRONMENT_READY_FANOUT_CONCURRENCY: "1"
  TETRAL_SANDBOX_WORKER_CONCURRENCY: "1"
  TETRAL_SANDBOX_DAYTONA_STOP_TIMEOUT: 30s
  TETRAL_SANDBOX_AUTO_STOP_INTERVAL: 30m
  TETRAL_SANDBOX_AUTO_ARCHIVE_INTERVAL: 24h
  TETRAL_SANDBOX_AUTO_DELETE_INTERVAL: 720h
  TETRAL_BLOB_ENDPOINT: {{ .Values.blob.endpoint | quote }}
  TETRAL_BLOB_REGION: {{ .Values.blob.region | quote }}
  TETRAL_BLOB_BUCKET: {{ .Values.blob.bucket | quote }}
  TETRAL_R2_ACCOUNT_ID: {{ .Values.blob.r2AccountID | quote }}
  TETRAL_RESOURCE_CRED_TTL: 24h
  TETRAL_RESOURCE_CRED_REFRESH_MARGIN: 30m
  TETRAL_RCLONE_VFS_CACHE_MAX_SIZE: 2G
  TETRAL_RCLONE_VFS_MIN_FREE: 1G
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: sandbox
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: sandbox
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox
        app.kubernetes.io/part-of: tetral
    spec:
      serviceAccountName: sandbox
      automountServiceAccountToken: false
      containers:
        - name: sandbox
          image: {{ include "tetral.image" (dict "root" . "name" "tetral") }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/tetral-sandbox
          env:
            - name: TETRAL_SANDBOX_HTTP_ADDR
              value: ":8080"
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.observability.deploymentEnvironment | quote }}
            - name: TETRAL_SERVICE_VERSION
              value: {{ .Values.observability.serviceVersion | quote }}
            - name: TETRAL_SCHEMA_MODE
              value: verify
            - name: TETRAL_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.tetralDatabase | quote }}
                  key: TETRAL_POSTGRES_DSN
            - name: DAYTONA_API_URL
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: DAYTONA_API_URL
            - name: DAYTONA_TARGET
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: DAYTONA_TARGET
                  optional: true
            - name: TETRAL_SANDBOX_BASE_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_BASE_IMAGE
            - name: DAYTONA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sandboxDaytona | quote }}
                  key: DAYTONA_API_KEY
            - name: TETRAL_QUEUE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_QUEUE_GRPC_ADDR
            - name: TETRAL_GIT_PROXY_HOST
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_GIT_PROXY_HOST
            - name: TETRAL_SANDBOX_LEASE_HEARTBEAT_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_LEASE_HEARTBEAT_INTERVAL
            - name: TETRAL_SANDBOX_JOB_LEASE_DURATION
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_JOB_LEASE_DURATION
            - name: TETRAL_SANDBOX_PROVIDER_COMMAND_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_PROVIDER_COMMAND_TIMEOUT
            - name: TETRAL_SANDBOX_LATE_COMMAND_MARGIN
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_LATE_COMMAND_MARGIN
            - name: TETRAL_SANDBOX_JOB_POLL_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_JOB_POLL_INTERVAL
            - name: TETRAL_SANDBOX_DEBUG_LOGGING
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_DEBUG_LOGGING
            - name: TETRAL_SANDBOX_ENVIRONMENT_BUILD_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_ENVIRONMENT_BUILD_CONCURRENCY
            - name: TETRAL_SANDBOX_ENVIRONMENT_READY_FANOUT_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_ENVIRONMENT_READY_FANOUT_CONCURRENCY
            - name: TETRAL_SANDBOX_WORKER_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_WORKER_CONCURRENCY
            - name: TETRAL_SANDBOX_DAYTONA_STOP_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_DAYTONA_STOP_TIMEOUT
            - name: TETRAL_SANDBOX_AUTO_STOP_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_AUTO_STOP_INTERVAL
            - name: TETRAL_SANDBOX_AUTO_ARCHIVE_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_AUTO_ARCHIVE_INTERVAL
            - name: TETRAL_SANDBOX_AUTO_DELETE_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_SANDBOX_AUTO_DELETE_INTERVAL
            - name: TETRAL_BLOB_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_BLOB_ENDPOINT
            - name: TETRAL_BLOB_REGION
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_BLOB_REGION
            - name: TETRAL_BLOB_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_BLOB_BUCKET
            - name: TETRAL_BLOB_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sandboxBlob | quote }}
                  key: TETRAL_BLOB_ACCESS_KEY
            - name: TETRAL_BLOB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sandboxBlob | quote }}
                  key: TETRAL_BLOB_SECRET_KEY
            - name: TETRAL_R2_ACCOUNT_ID
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_R2_ACCOUNT_ID
            - name: TETRAL_R2_PARENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sandboxR2Parent | quote }}
                  key: TETRAL_R2_PARENT_API_TOKEN
            - name: TETRAL_R2_PARENT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sandboxR2Parent | quote }}
                  key: TETRAL_R2_PARENT_ACCESS_KEY
            - name: TETRAL_RESOURCE_CRED_TTL
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_RESOURCE_CRED_TTL
            - name: TETRAL_RESOURCE_CRED_REFRESH_MARGIN
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_RESOURCE_CRED_REFRESH_MARGIN
            - name: TETRAL_RCLONE_VFS_CACHE_MAX_SIZE
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_RCLONE_VFS_CACHE_MAX_SIZE
            - name: TETRAL_RCLONE_VFS_MIN_FREE
              valueFrom:
                configMapKeyRef:
                  name: sandbox-config
                  key: TETRAL_RCLONE_VFS_MIN_FREE
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
{{ toYaml .Values.resources.sandbox | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: sandbox
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: sandbox
    app.kubernetes.io/part-of: tetral
  annotations:
    # Broad HTTPS egress is required for R2 temporary credential minting
    # (`api.cloudflare.com`) and provider-sandbox/blob endpoints documented
    # in tetral.ai/egress-intent.
    tetral.ai/egress-intent: "{{ (urlParse .Values.daytona.sandboxAPIURL).host }}, {{ (urlParse .Values.blob.endpoint).host }}, api.cloudflare.com"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: queue
      ports:
        - protocol: TCP
          port: 9090
    - to:
{{- toYaml .Values.network.databasePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.network.databasePort }}
    - to:
{{- toYaml .Values.network.externalEgressPeers | nindent 8 }}
      ports:
{{- range .Values.network.externalEgressPorts }}
        - protocol: TCP
          port: {{ . }}
{{- end }}
    - to:
{{- toYaml .Values.network.dnsPeers | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
