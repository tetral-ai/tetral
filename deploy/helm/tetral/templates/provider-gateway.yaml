---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-gateway
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: provider-gateway
    app.kubernetes.io/part-of: tetral
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-gateway
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: provider-gateway
    app.kubernetes.io/part-of: tetral
spec:
  replicas: {{ .Values.replicas.providerGateway }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: {{ .Values.rollout.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: provider-gateway
  template:
    metadata:
      annotations:
{{ include "tetral.routingAnnotations" (dict "root" . "role" "provider-gateway") | indent 8 }}
      labels:
        app.kubernetes.io/name: provider-gateway
        app.kubernetes.io/part-of: tetral
        istio.io/rev: {{ .Values.routing.revision | quote }}
    spec:
      serviceAccountName: provider-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: provider-gateway
          image: {{ include "tetral.image" (dict "root" . "name" "gateway") }}
          imagePullPolicy: IfNotPresent
          command:
            - bun
            - /app/dist/provider-gateway/src-command.js
          env:
{{ include "tetral.storeTLSEnv" (dict "root" . "database" true "blob" false "bun" true) | trim | indent 12 }}
            - name: TETRAL_SERVICE_DRAIN_TIMEOUT_MS
              value: {{ .Values.lifecycle.providerDrainMs | quote }}
            - name: TETRAL_SERVICE_CANCEL_JOIN_TIMEOUT_MS
              value: {{ .Values.lifecycle.providerJoinMs | quote }}
            - name: TETRAL_TRANSPORT_PROFILE
              value: {{ .Values.transport.profile | quote }}
            - name: TETRAL_ROUTING_PROXY_REQUIRED
              value: "true"
            - name: TETRAL_PROVIDER_GATEWAY_HTTP_ADDR
              value: 0.0.0.0:8080
            - name: TETRAL_PROVIDER_GATEWAY_GRPC_ADDR
              value: 0.0.0.0:9090
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.observability.deploymentEnvironment | quote }}
            - name: TETRAL_SERVICE_VERSION
              value: {{ .Values.observability.serviceVersion | quote }}
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.tetralDatabase | quote }}
                  key: gateway-url
            - name: ENGINE_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.apiSecrets | quote }}
                  key: engine-vault-key
            - name: TETRAL_INTERNAL_GRPC_AUDIENCE
              value: tetral-internal-grpc
            - name: TETRAL_INTERNAL_ALLOWED_SERVICE_ACCOUNTS
              value: tetral-agent-runtime/agent-runtime
            - name: TETRAL_BRIDGE_API_GRPC_ADDR
              value: bridge.tetral-system.svc.cluster.local:9090
            - name: TETRAL_PROVIDER_GATEWAY_BRIDGE_TOKEN_PATH
              value: /var/run/secrets/tetral-internal-grpc/bridge/token
            - name: TETRAL_RUNTIME_BINDING_TOKEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtimeBindingToken | quote }}
                  key: hmac-key
            - name: KUBERNETES_TOKEN_REVIEW_REVIEWER_TOKEN_PATH
              value: /var/run/secrets/tetral-kubernetes-api/provider-gateway-tokenreview/token
            - name: KUBERNETES_API_SERVER_URL
              value: https://kubernetes.default.svc
            - name: KUBERNETES_API_CA_CERT_PATH
              value: /var/run/secrets/tetral-kubernetes-api/ca.crt
          ports:
            - name: http
              containerPort: 8080
            - name: provider-grpc
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
{{ toYaml .Values.resources.providerGateway | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: store-trust
              mountPath: /var/run/tetral/store-trust
              readOnly: true
            - name: provider-gateway-kubernetes-api
              mountPath: /var/run/secrets/tetral-kubernetes-api
              readOnly: true
            - name: provider-gateway-bridge-token
              mountPath: /var/run/secrets/tetral-internal-grpc/bridge
              readOnly: true
      volumes:
        - name: store-trust
          configMap:
            name: {{ .Values.transport.storeTrustConfigMap | quote }}
        - name: provider-gateway-kubernetes-api
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 600
                  path: provider-gateway-tokenreview/token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: provider-gateway-bridge-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: tetral-internal-grpc
                  expirationSeconds: 600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: provider-gateway
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: provider-gateway
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: provider-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: provider-grpc
      port: 9090
      targetPort: provider-grpc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provider-gateway
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: provider-gateway
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/egress-intent: "api.anthropic.com, api.openai.com, auth.openai.com, chatgpt.com, api.deepseek.com, api.kimi.com, api.z.ai"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provider-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-agent-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
{{- toYaml .Values.network.databasePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.network.databasePort }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bridge
      ports:
        - protocol: TCP
          port: 9090
    - to:
{{- toYaml .Values.network.dnsPeers | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
{{- toYaml .Values.network.apiServerPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
    - to:
{{- toYaml .Values.network.externalEgressPeers | nindent 8 }}
      ports:
{{- range .Values.network.externalEgressPorts }}
        - protocol: TCP
          port: {{ . }}
{{- end }}
{{- if .Values.cilium.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: provider-gateway-apiserver-egress
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: provider-gateway
    app.kubernetes.io/part-of: tetral
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: provider-gateway
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
            - port: '6443'
              protocol: TCP
{{- end }}
{{- if .Values.autoscaling.providerGateway.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: provider-gateway
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: provider-gateway
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/hpa-metric-source: 'resource: cpu'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: provider-gateway
  minReplicas: 2
  maxReplicas: {{ .Values.autoscaling.providerGateway.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
