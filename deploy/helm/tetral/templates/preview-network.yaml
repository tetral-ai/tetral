{{- if .Values.preview.enabled }}
{{- range $role := list "provider-gateway" "event-stream" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $role }}-nats
  namespace: tetral-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $role }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
              app.kubernetes.io/instance: tetral-nats
      ports:
        - protocol: TCP
          port: 4222
{{- end }}
{{- end }}
