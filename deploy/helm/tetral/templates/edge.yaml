{{- if .Values.edge.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tetral-public-api
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: tetral-public-edge
    app.kubernetes.io/part-of: tetral
    tetral.ai/edge-adapter: ingress-nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    # The platform accepts a 500 MB file plus a 1 MB multipart envelope
    # (internal/files/staging.go RouteMultipartBytes); without this the
    # controller's 1 MB default rejects every upload at the edge.
    nginx.ingress.kubernetes.io/proxy-body-size: "501m"
    nginx.ingress.kubernetes.io/auth-url: "http://auth.tetral-system.svc.cluster.local:8080/internal/auth/authorize"
    nginx.ingress.kubernetes.io/auth-method: "POST"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Tetral-Internal-Principal"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-Path $tetral_original_path;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Tetral-Internal-Principal "";
      proxy_set_header X-Tetral-Internal-Workspace "";
    nginx.ingress.kubernetes.io/configuration-snippet: |
      set $tetral_original_path $uri;
      more_clear_input_headers "X-Tetral-*";
      proxy_set_header X-Api-Key "";
      proxy_set_header Authorization "";
      proxy_set_header X-Tetral-Internal-Principal $upstream_http_x_tetral_internal_principal;
      proxy_set_header X-Tetral-Internal-Workspace "";
      proxy_set_header X-Tetral-Workspace-Id "";
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /v1/api_keys
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  name: http
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tetral-event-stream
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: tetral-public-edge
    app.kubernetes.io/part-of: tetral
    tetral.ai/edge-adapter: ingress-nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    # The platform accepts a 500 MB file plus a 1 MB multipart envelope
    # (internal/files/staging.go RouteMultipartBytes); without this the
    # controller's 1 MB default rejects every upload at the edge.
    nginx.ingress.kubernetes.io/proxy-body-size: "501m"
    nginx.ingress.kubernetes.io/auth-url: "http://auth.tetral-system.svc.cluster.local:8080/internal/auth/authorize"
    nginx.ingress.kubernetes.io/auth-method: "POST"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Tetral-Internal-Principal"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-Path $tetral_original_path;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Tetral-Internal-Principal "";
      proxy_set_header X-Tetral-Internal-Workspace "";
    nginx.ingress.kubernetes.io/configuration-snippet: |
      set $tetral_original_path $uri;
      more_clear_input_headers "X-Tetral-*";
      proxy_set_header X-Api-Key "";
      proxy_set_header Authorization "";
      proxy_set_header X-Tetral-Internal-Principal $upstream_http_x_tetral_internal_principal;
      proxy_set_header X-Tetral-Internal-Workspace "";
      proxy_set_header X-Tetral-Workspace-Id "";
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /v1/sessions/[^/]+/events/stream$
            pathType: ImplementationSpecific
            backend:
              service:
                name: event-stream
                port:
                  name: http
          - path: /v1/sessions/[^/]+/threads/[^/]+/stream$
            pathType: ImplementationSpecific
            backend:
              service:
                name: event-stream
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
    tetral.ai/edge-adapter: ingress-nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.gitProxyHost | quote }}
      secretName: {{ .Values.edge.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.gitProxyHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: git-proxy
                port:
                  name: http
{{- end }}
