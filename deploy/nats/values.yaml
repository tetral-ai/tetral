# Official NATS chart values. render.py checks its archive and image locks.
fullnameOverride: tetral-nats
namespaceOverride: tetral-system
serviceAccount:
  enabled: true
  name: tetral-nats
natsBox:
  enabled: false
config:
  cluster:
    enabled: true
    replicas: 1
    noAdvertise: false
    routeURLs:
      useFQDN: true
    merge:
      authorization:
        user: << $NATS_CLUSTER_USER >>
        password: << $NATS_CLUSTER_PASSWORD >>
  jetstream:
    enabled: false
    fileStore:
      enabled: false
      pvc:
        enabled: false
  merge:
    max_payload: 1048576
    client_advertise: << $NATS_CLIENT_ADVERTISE >>
    authorization:
      users:
        - user: << $NATS_PUBLISHER_USER >>
          password: << $NATS_PUBLISHER_PASSWORD >>
          permissions:
            publish: [preview.v1.>]
            subscribe: {deny: [">"]}
        - user: << $NATS_SUBSCRIBER_USER >>
          password: << $NATS_SUBSCRIBER_PASSWORD >>
          permissions:
            publish: {deny: [">"]}
            subscribe: [preview.v1.>]
container:
  env:
    NATS_CLIENT_ADVERTISE: $(POD_NAME).tetral-nats-headless.tetral-system.svc.cluster.local:4222
    NATS_PUBLISHER_USER:
      valueFrom:
        secretKeyRef: {name: tetral-nats-server-credentials, key: publisher_user}
    NATS_PUBLISHER_PASSWORD:
      valueFrom:
        secretKeyRef: {name: tetral-nats-server-credentials, key: publisher_password}
    NATS_SUBSCRIBER_USER:
      valueFrom:
        secretKeyRef: {name: tetral-nats-server-credentials, key: subscriber_user}
    NATS_SUBSCRIBER_PASSWORD:
      valueFrom:
        secretKeyRef: {name: tetral-nats-server-credentials, key: subscriber_password}
    NATS_CLUSTER_USER:
      valueFrom:
        secretKeyRef: {name: tetral-nats-cluster-credentials, key: user}
    NATS_CLUSTER_PASSWORD:
      valueFrom:
        secretKeyRef: {name: tetral-nats-cluster-credentials, key: password}
  readinessProbe:
    httpGet: {path: /healthz, port: monitor}
  livenessProbe:
    httpGet: {path: /healthz, port: monitor}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
promExporter:
  enabled: true
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}
reloader:
  enabled: true
  merge:
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
podTemplate:
  terminationGracePeriodSeconds: 60
  topologySpreadConstraints:
    kubernetes.io/hostname:
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule
  merge:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nats
                  app.kubernetes.io/instance: tetral-nats
              topologyKey: kubernetes.io/hostname
