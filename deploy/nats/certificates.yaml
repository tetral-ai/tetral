# Protected NATS role leaves. The operator binds tetral-native to a dedicated
# intermediate; neither this file nor workload Pods contain signing keys.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tetral-nats-server-tls
  namespace: tetral-system
spec:
  secretName: tetral-nats-server-tls
  issuerRef:
    name: tetral-native
    kind: ClusterIssuer
    group: cert-manager.io
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - "tetral-nats.tetral-system.svc.cluster.local"
    - "*.tetral-nats-headless.tetral-system.svc.cluster.local"
  uris:
    - spiffe://cluster.local/ns/tetral-system/sa/tetral-nats
  usages:
    - digital signature
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
