          valueFrom:
            secretKeyRef:
              key: user
              name: tetral-nats-cluster-credentials
        - name: NATS_PUBLISHER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: publisher_password
              name: tetral-nats-server-credentials
        - name: NATS_PUBLISHER_USER
          valueFrom:
            secretKeyRef:
              key: publisher_user
              name: tetral-nats-server-credentials
        - name: NATS_ROUTE_0
          valueFrom:
            secretKeyRef:
              key: route_0
              name: tetral-nats-cluster-credentials
        - name: NATS_ROUTE_1
          valueFrom:
            secretKeyRef:
              key: route_1
              name: tetral-nats-cluster-credentials
        - name: NATS_ROUTE_2
          valueFrom:
            secretKeyRef:
              key: route_2
              name: tetral-nats-cluster-credentials
        - name: NATS_SUBSCRIBER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: subscriber_password
              name: tetral-nats-server-credentials
        - name: NATS_SUBSCRIBER_USER
          valueFrom:
            secretKeyRef:
              key: subscriber_user
              name: tetral-nats-server-credentials
        image: docker.io/nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
        lifecycle:
          preStop:
            exec:
              command:
              - nats-server
              - -sl=ldm=/var/run/nats/nats.pid
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: monitor
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: nats
        ports:
        - containerPort: 4222
          name: nats
        - containerPort: 6222
          name: cluster
        - containerPort: 8222
          name: monitor
        readinessProbe:
