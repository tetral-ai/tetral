        - -config
        - /etc/nats-certs/nats/tls.key
        image: docker.io/natsio/nats-server-config-reloader:0.23.0@sha256:64cb6c858e794906d3167378e02b7e0feb83c4e14c07b371eb8d921ef8c4a60b
