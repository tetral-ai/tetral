name: Run repository test evidence
description: Sets up pinned tools, runs one repository-owned evidence group, and uploads its structured result.
inputs:
  group:
    description: Evidence group from internal/testinfra/inventory.json, or all
    required: true
  producer:
    description: Stable producer identity consumed by Merge Gate
    required: true
  artifact-prefix:
    description: Workflow-specific structured evidence artifact prefix
    required: false
    default: evidence
  shard-index:
    description: Zero-based Go shard index
    required: false
    default: '0'
  shard-count:
    description: Number of deterministic Go shards
    required: false
    default: '1'
  needs-bun:
    description: Install the repository-pinned Bun toolchain
    required: false
    default: 'false'
  needs-buf:
    description: Install the protocol generator
    required: false
    default: 'false'
  needs-helm:
    description: Install Helm for deployment verification
    required: false
    default: 'false'
  needs-lint:
    description: Install golangci-lint without running it outside the evidence runner
    required: false
    default: 'false'
  needs-go-test-host:
    description: Prepare host capabilities required by the complete Go integration suite
    required: false
    default: 'false'
  dependency-audit:
    description: 'Online dependency audit policy: changed, always, or never'
    required: false
    default: changed
  go-cache:
    description: Which Go cache to restore. true restores the Go Build Cache entry, read-only, false setup-go's own cache, and none neither, for evidence steps after a job's first
    required: false
    default: 'false'
  time-limit-minutes:
    description: Minutes the evidence run may take before it is interrupted, records its result and fails; empty for no limit of its own
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check the evidence inputs
      shell: bash
      env:
        GO_CACHE: ${{ inputs.go-cache }}
        TIME_LIMIT_MINUTES: ${{ inputs.time-limit-minutes }}
      run: |
        set -euo pipefail
        if [[ ! "$GO_CACHE" =~ ^(true|false|none)$ ]]; then
          echo "go-cache must be true, false or none, not '$GO_CACHE'" >&2
          exit 1
        fi
        if [[ -n "$TIME_LIMIT_MINUTES" && ! "$TIME_LIMIT_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
          echo "time-limit-minutes must be a whole number of minutes, not '$TIME_LIMIT_MINUTES'" >&2
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-version: '1.26.9'
        cache: ${{ inputs.go-cache == 'false' }}
        cache-dependency-path: go.sum

    - name: Compute the Go build cache key
      id: go-cache-key
      if: inputs.go-cache == 'true'
      shell: bash
      env:
        GO_SUM_HASH: ${{ hashFiles('go.sum', 'integration/envoy-gateway-secret-helper/go.sum') }}
      run: |
        set -euo pipefail
        toolchain="go-race-v1-Linux-$(go env GOVERSION)-"
        compiler="${toolchain}cc$(gcc --version | head -n 1 | sha256sum | cut -c 1-12)-"
        modules="${compiler}${GO_SUM_HASH}-"
        key="${modules}$(git rev-parse HEAD)"
        echo "Go build cache key: $key"
        {
          echo "key=$key"
          echo "modules-prefix=$modules"
          echo "compiler-prefix=$compiler"
          echo "toolchain-prefix=$toolchain"
        } >> "$GITHUB_OUTPUT"

    - name: Record free disk before the Go build cache restore
      id: go-cache-before
      if: inputs.go-cache == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "started-ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
        echo "disk-free=$(df --output=avail -B1 "$HOME" | tail -n 1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

    # The newest entry for this commit, else for this go.sum, else for this
    # compiler, else for this Go version; Go recompiles whatever is stale. The
    # entry extracts to about 8.4 GB beside the archive, so a runner with less
    # than 25 GB free, or whose free disk could not be measured, compiles cold
    # instead.
    - name: Restore the Go build cache
      id: go-cache
      if: inputs.go-cache == 'true' && fromJSON(steps.go-cache-before.outputs.disk-free || '0') >= 25000000000
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ~/go/bin
        key: ${{ steps.go-cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.go-cache-key.outputs.modules-prefix }}
          ${{ steps.go-cache-key.outputs.compiler-prefix }}
          ${{ steps.go-cache-key.outputs.toolchain-prefix }}

    - name: Measure the Go build cache restore
      id: go-cache-restored
      if: inputs.go-cache == 'true'
      shell: bash
      env:
        STARTED_NS: ${{ steps.go-cache-before.outputs.started-ns }}
      run: |
        set -euo pipefail
        echo "elapsed-ns=$(( $(date +%s%N) - STARTED_NS ))" >> "$GITHUB_OUTPUT"
        echo "disk-free=$(df --output=avail -B1 "$HOME" | tail -n 1 | tr -d ' ')" >> "$GITHUB_OUTPUT"
        restored=0
        for directory in "$HOME/.cache/go-build" "$HOME/go/pkg/mod" "$HOME/go/bin"; do
          if [[ -d "$directory" ]]; then
            restored=$(( restored + $(du -sb "$directory" | cut -f 1) ))
          fi
        done
        echo "bytes=$restored" >> "$GITHUB_OUTPUT"

    - name: Set up Bun
      if: inputs.needs-bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: services/gateway/package.json

    - name: Set up Helm
      if: inputs.needs-helm == 'true'
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.2.0

    - name: Install buf
      if: inputs.needs-buf == 'true'
      shell: bash
      run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

    - name: Install golangci-lint
      if: inputs.needs-lint == 'true'
      uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7
      with:
        version: v2.11.4
        install-only: true

    - name: Prepare Go integration host
      if: inputs.needs-go-test-host == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
        fi
        rg --version
        if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        unshare -Ur -m true

    - name: Run ${{ inputs.group }} evidence
      shell: bash
      env:
        TETRAL_CI_PRODUCER: ${{ inputs.producer }}
        TETRAL_CI_GO_CACHE_KEY: ${{ steps.go-cache-key.outputs.key }}
        TETRAL_CI_GO_CACHE_MATCHED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
        TETRAL_CI_GO_CACHE_RESTORE_OUTCOME: ${{ steps.go-cache.outcome }}
        TETRAL_CI_GO_CACHE_RESTORE_NS: ${{ steps.go-cache-restored.outputs.elapsed-ns }}
        TETRAL_CI_GO_CACHE_RESTORED_BYTES: ${{ steps.go-cache-restored.outputs.bytes }}
        TETRAL_CI_GO_CACHE_DISK_FREE_BEFORE: ${{ steps.go-cache-before.outputs.disk-free }}
        TETRAL_CI_GO_CACHE_DISK_FREE_AFTER: ${{ steps.go-cache-restored.outputs.disk-free }}
        TIME_LIMIT_MINUTES: ${{ inputs.time-limit-minutes }}
      run: |
        set -euo pipefail
        group_args=()
        if [[ '${{ inputs.group }}' != 'all' ]]; then
          group_args=(--groups '${{ inputs.group }}')
        fi
        # At the limit tetral-test gets SIGINT, stops its command, writes its
        # result and exits, so the upload below still runs; a step
        # timeout-minutes would cancel the upload too.
        limit=()
        if [[ -n "$TIME_LIMIT_MINUTES" ]]; then
          limit=(timeout --verbose --signal=INT --kill-after=1m "${TIME_LIMIT_MINUTES}m")
        fi
        "${limit[@]}" go run ./internal/testinfra/cmd/tetral-test \
          --profile full \
          --workers 2 \
          --dependency-audit '${{ inputs.dependency-audit }}' \
          "${group_args[@]}" \
          --shard-index '${{ inputs.shard-index }}' \
          --shard-count '${{ inputs.shard-count }}' \
          --output '.test-results/${{ inputs.producer }}'

    - name: Upload structured evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-prefix }}-${{ inputs.producer }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .test-results/${{ inputs.producer }}
        if-no-files-found: error
        retention-days: 14
