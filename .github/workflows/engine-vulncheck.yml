name: engine-vulncheck

# Go dependency vulnerabilities track upstream advisories, not pull requests: a
# change to this repository cannot introduce one unless it changes the module
# graph, and an advisory published tomorrow applies to code that merged last
# week. Pull requests therefore run this gate only when the Go module graph
# (go.mod/go.sum), the test-only Envoy Gateway secret-helper module,
# scripts/check-envoy-secret-helper.py, deploy/dependencies.lock.json or this
# workflow change, and the daily schedule reports new advisories when they
# actually appear.
#
# Why the scan is split: symbol-level analysis of the whole repository peaks
# around 20 GiB of resident memory (measured 2026-08-05), and the sandbox
# service's import closure (kubernetes and AWS SDKs) accounts for almost all of
# it on its own — far beyond the hosted runner. Every other package tree fits
# comfortably, so those keep full symbol-level precision here, one tree per
# process so peaks never stack. The sandbox closure is covered by a
# module-level scan instead: it reports every advisory affecting any pinned
# dependency version (a superset of symbol-level detection, without
# reachability pruning). Triage for a module-level finding: run the Makefile's
# vulncheck target on a machine with ~24 GiB free for the full symbol-level
# verdict, and prefer fixing by bumping the dependency.

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'integration/envoy-gateway-secret-helper/**'
      - 'scripts/check-envoy-secret-helper.py'
      - 'deploy/dependencies.lock.json'
      - '.github/workflows/engine-vulncheck.yml'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

cache-mode: read

concurrency:
  group: engine-vulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum

      - name: Slice coverage guard
        run: |
          set -euo pipefail
          uncovered=$(go list ./... | grep -vE '^github.com/tetral-ai/tetral/(api|cmd|database|deploy|integration|internal|protocol|services/(agent-runtime|api|auth|bridge|cleanup|computer-hub|event-stream|gateway|git-proxy|job-runner|queue|web-connector|sandbox))(/|$)' || true)
          if [ -n "${uncovered}" ]; then
            echo "package trees missing from the vulncheck slice list:"
            echo "${uncovered}"
            exit 1
          fi

      - name: Symbol-level scan (every tree except the sandbox closure)
        run: |
          set -euo pipefail
          slices=(
            ./api/...
            ./cmd/...
            ./database/...
            ./deploy/...
            ./integration/...
            ./internal/...
            ./protocol/...
            ./services/agent-runtime/...
            ./services/api/...
            ./services/auth/...
            ./services/bridge/...
            ./services/cleanup/...
            ./services/computer-hub/...
            ./services/event-stream/...
            ./services/gateway/...
            ./services/git-proxy/...
            ./services/job-runner/...
            ./services/queue/...
            ./services/web-connector/...
          )
          # go tool exits 0 when the tool dies of a signal, so the scanner
          # binary is run directly and a killed scan fails the step.
          govulncheck="$(go tool -n govulncheck)"
          for slice in "${slices[@]}"; do
            echo "== govulncheck ${slice} =="
            "${govulncheck}" "${slice}"
          done

      - name: Module-level scan (covers the sandbox closure)
        working-directory: services/sandbox
        run: '"$(go tool -n govulncheck)" -scan module'

      - name: Separate upstream translator module and symbol scans
        run: python3 scripts/check-envoy-secret-helper.py

  # On a schedule only: opens the issue of this workflow's schedule when a job
  # failed, adds a comment while it stays red, and closes it on the schedule's
  # next green run.
  report-red:
    name: Report a Red Scheduled Run
    needs: [govulncheck]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Check out the revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'
          cache: false
      - name: Open, update or close the workflow's issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          go run ./internal/testinfra/cmd/tetral-ci-flow scheduled-issue
          --workflow "$WORKFLOW"
          --schedule "$SCHEDULE"
          --run "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --run-url "$RUN_URL"
          --commit "$GITHUB_SHA"
          --reporter 'Report a Red Scheduled Run'
