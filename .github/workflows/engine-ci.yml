name: engine-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Checkout fork SDK
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: tetral-ai/tetral-sdk-typescript
          ref: 5c506ed76bfbcec221effb9bb2b304e9c9c147e7
          path: tetral-sdk-typescript
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.12'
          cache-dependency-path: go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # golangci/golangci-lint-action@v9
        uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7
        with:
          version: v2.11.4
          args: >-
            --config .golangci.yml
            ./...

      - name: Setup Bun
        # oven-sh/setup-bun@v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install fork SDK dependencies
        # The drift gates typecheck fixtures that live inside the SDK checkout,
        # so that repository needs its own node_modules — @types/node above all.
        working-directory: ${{ github.workspace }}/tetral-sdk-typescript
        # The SDK tracks yarn.lock, and the frozen-evidence gates require its
        # tree to stay clean, so the bun lockfile this writes is removed again.
        run: |
          bun install --no-save
          rm -f bun.lock bun.lockb

      - name: Install Agent Runtime dependencies
        # The fork-SDK drift gates typecheck their fixtures with the Agent
        # Runtime's own TypeScript compiler, so this job needs its node_modules.
        working-directory: services/agent-runtime
        run: bun install --frozen-lockfile

      - name: Architecture static guards
        run: go test ./integration/static -run 'TestFinalArchitecture|TestEngineCIWorkflow|TestKubernetesManifest|Test.*Static|Test.*Boundary|Test.*Log|Test.*Secret|Test.*Redact|Test.*Import' -count=1

      - name: Fork SDK drift gates
        env:
          TETRAL_ENGINE_SDK_ROOT: ${{ github.workspace }}/tetral-sdk-typescript
        run: go test ./integration/static -run 'TestGitHubIntegrationRuntimeEventsTrackForkSDKShapes|TestForkSDKAgentModelUnionTracksDraftPinnedCatalog|TestPublicEventProjectionTracksFrozenForkSDKUnion' -count=1

      - name: SDK compatibility traceability gate
        run: ./scripts/check-sdk-compatibility-traceability.sh

  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Checkout fork SDK
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: tetral-ai/tetral-sdk-typescript
          ref: 5c506ed76bfbcec221effb9bb2b304e9c9c147e7
          path: tetral-sdk-typescript
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.12'
          cache-dependency-path: go.sum

      - name: Install buf
        # The protocol freshness gates regenerate with buf and diff the result,
        # so the generator version is part of what they assert. Keep it pinned.
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

      - name: Setup Bun
        # oven-sh/setup-bun@v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install fork SDK dependencies
        # The drift gates typecheck fixtures that live inside the SDK checkout,
        # so that repository needs its own node_modules — @types/node above all.
        working-directory: ${{ github.workspace }}/tetral-sdk-typescript
        # The SDK tracks yarn.lock, and the frozen-evidence gates require its
        # tree to stay clean, so the bun lockfile this writes is removed again.
        run: |
          bun install --no-save
          rm -f bun.lock bun.lockb

      - name: Install Agent Runtime dependencies
        # integration and integration/static drive the Bun harnesses and
        # typecheck fork-SDK fixtures with the Agent Runtime's own compiler.
        working-directory: services/agent-runtime
        run: bun install --frozen-lockfile

      - name: Allow unprivileged user namespaces
        # The sandbox helper's capture tests run the real binary inside
        # `unshare -Ur -m` so it sees a mount namespace of its own. Ubuntu 24.04
        # blocks unprivileged user namespaces through AppArmor by default, which
        # this suite has never had to ask for on a machine where it was already
        # open.
        working-directory: ${{ github.workspace }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Ur -m true && echo "user namespaces available"

      - name: Start PostgreSQL test service
        # A disposable test database protects nothing, and this suite spends its
        # time building schemas rather than running queries. Durability off,
        # data directory in RAM. These settings must never reach a deployment.
        env:
          POSTGRES_CONTAINER: tetral-postgres-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        run: |
          docker rm -f "$POSTGRES_CONTAINER" >/dev/null 2>&1 || true
          # Registry reachability is not part of what this suite tests, and a
          # single timed-out pull should not read as a failing build.
          for attempt in 1 2 3 4 5; do
            if docker pull public.ecr.aws/docker/library/postgres:18-alpine; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "could not pull public.ecr.aws/docker/library/postgres:18-alpine after $attempt attempts" >&2
              exit 1
            fi
            echo "pull attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          docker run -d \
            --name "$POSTGRES_CONTAINER" \
            -p 127.0.0.1::5432 \
            --tmpfs /var/lib/postgresql/18/docker:rw,size=2g \
            -e POSTGRES_USER=tetral \
            -e POSTGRES_PASSWORD=tetral \
            -e POSTGRES_DB=tetral \
            public.ecr.aws/docker/library/postgres:18-alpine \
            -c fsync=off \
            -c synchronous_commit=off \
            -c full_page_writes=off \
            -c jit=off \
            -c max_connections=300
          for attempt in $(seq 1 40); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U tetral -d tetral >/dev/null 2>&1; then
              port="$(docker port "$POSTGRES_CONTAINER" 5432/tcp | sed -n 's/.*://p' | tail -n1)"
              echo "TETRAL_TEST_DATABASE_URL=postgres://tetral:tetral@127.0.0.1:$port/tetral?sslmode=disable" >> "$GITHUB_ENV"
              echo "PostgreSQL ready on port $port"
              exit 0
            fi
            echo "PostgreSQL not yet ready (attempt $attempt); sleeping"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          docker logs "$POSTGRES_CONTAINER" >&2 || true
          exit 1

      - name: Start MinIO S3-compatible test service
        env:
          MINIO_CONTAINER: tetral-minio-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        run: |
          docker rm -f "$MINIO_CONTAINER" >/dev/null 2>&1 || true
          for attempt in 1 2 3 4 5; do
            if docker pull quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "could not pull the MinIO image after $attempt attempts" >&2
              exit 1
            fi
            echo "pull attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          docker run -d \
            --name "$MINIO_CONTAINER" \
            -p 127.0.0.1::9000 \
            -e MINIO_ROOT_USER=tetralminio \
            -e MINIO_ROOT_PASSWORD=tetralminio123 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --address ":9000"
          for attempt in $(seq 1 30); do
            port="$(docker port "$MINIO_CONTAINER" 9000/tcp | sed -n 's/.*://p' | tail -n1)"
            if [ -n "$port" ]; then
              endpoint="http://127.0.0.1:$port"
              if curl -fsS "$endpoint/minio/health/ready" >/dev/null 2>&1; then
                echo "TETRAL_TEST_MINIO_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
                echo "TETRAL_TEST_MINIO_ACCESS_KEY=tetralminio" >> "$GITHUB_ENV"
                echo "TETRAL_TEST_MINIO_SECRET_KEY=tetralminio123" >> "$GITHUB_ENV"
                echo "TETRAL_TEST_MINIO_REGION=us-east-1" >> "$GITHUB_ENV"
                echo "MinIO ready at $endpoint"
                exit 0
              fi
            fi
            echo "MinIO not yet ready (attempt $attempt); sleeping"
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2
          docker logs "$MINIO_CONTAINER" >&2 || true
          exit 1

      - name: Go tests (shard ${{ matrix.shard }})
        env:
          TETRAL_ENGINE_SDK_ROOT: ${{ github.workspace }}/tetral-sdk-typescript
        run: |
          # Six packages carry most of the suite's time, and a name-ordered
          # round robin piles three of them onto one shard. Wall clock is the
          # slowest shard, so these are placed by measured cost and everything
          # else fills in around them.
          #   httpapi 262s | bridge 208s | sandbox 130s
          #   memory 115s  | sessionevent 102s | session 100s
          case "${{ matrix.shard }}" in
            0) pinned="internal/httpapi" ;;
            1) pinned="services/bridge" ;;
            2) pinned="internal/sandbox internal/session" ;;
            3) pinned="internal/memory internal/sessionevent" ;;
          esac
          all_pinned="internal/httpapi services/bridge internal/sandbox internal/session internal/memory internal/sessionevent"
          pattern="$(echo "$all_pinned" | tr ' ' '\n' | sed 's#^#github.com/tetral-ai/tetral/#' | paste -sd'|')"
          packages="$(go list ./... | sort | grep -Ev "^($pattern)$" | awk 'NR % 4 == ${{ matrix.shard }}')"
          for suffix in $pinned; do
            packages="$packages
          github.com/tetral-ai/tetral/$suffix"
          done
          packages="$(echo "$packages" | sed 's/^ *//' | grep -v '^$')"
          if [ -z "$packages" ]; then
            echo "shard ${{ matrix.shard }} selected no packages" >&2
            exit 1
          fi
          echo "$packages" | sed 's/^/  /'
          go test -race -coverprofile=coverage.out $packages

      - name: Coverage
        run: go tool cover -func=coverage.out

      - name: Stop test services
        if: always()
        env:
          MINIO_CONTAINER: tetral-minio-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          POSTGRES_CONTAINER: tetral-postgres-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        run: |
          docker rm -f "$MINIO_CONTAINER" >/dev/null 2>&1 || true
          docker rm -f "$POSTGRES_CONTAINER" >/dev/null 2>&1 || true
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.12'
          cache-dependency-path: go.sum

      - name: Install buf
        # The protocol freshness gates regenerate with buf and diff the result,
        # so the generator version is part of what they assert. Keep it pinned.
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

      - name: Setup Bun
        # oven-sh/setup-bun@v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Runtime protocol dependencies
        working-directory: services/agent-runtime
        run: bun install --frozen-lockfile

      - name: Install Gateway protocol dependencies
        working-directory: services/gateway
        run: bun install --frozen-lockfile

      - name: Buf generation freshness
        run: go test ./integration/static -run 'Test.*BufGenerationFreshness|TestFinalArchitectureTypeScriptProtocolGenerationIsServiceLocal' -count=1

      - name: Go-to-Bun gRPC interop
        env:
          TETRAL_RUN_GO_BUN_GRPC_INTEROP: "1"
        run: go test -race -count=1 ./integration/grpcinterop

  agent-runtime-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/agent-runtime
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Bun
        # oven-sh/setup-bun@v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Gateway dependencies
        # The Runtime Pod's gRPC interop harness stands its fake gateway up on the
        # real provider-gateway server options, so the typecheck reaches into that
        # package and needs its dependencies resolvable.
        working-directory: services/gateway
        run: bun install --frozen-lockfile

      - name: Install Agent Runtime dependencies
        run: bun install --frozen-lockfile

      - name: Runtime Pod typecheck
        run: bun run typecheck

      - name: Runtime Pod unit tests with coverage
        run: bun run test

      - name: Runtime Pod integration tests
        run: bun run test:integration

      - name: Runtime Pod build
        run: bun run build

  gateway-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Bun
        # oven-sh/setup-bun@v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Gateway Service dependencies
        run: bun install --frozen-lockfile

      - name: Gateway Service typecheck
        run: bun run typecheck

      - name: Gateway Service tests with coverage
        run: bun run test

      - name: Gateway Service build
        run: bun run build

  k8s-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.12'
          cache-dependency-path: go.sum

      - name: Install buf
        # The protocol freshness gates regenerate with buf and diff the result,
        # so the generator version is part of what they assert. Keep it pinned.
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

      - name: Kubernetes manifest guards
        run: go test ./integration/static ./deploy/kubernetes -run 'TestKubernetesManifest|Test.*Manifest|Test.*NetworkPolicy|Test.*Deployment|Test.*ServiceLocal' -count=1

  helm-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.12'
          cache-dependency-path: go.sum

      - name: Setup Helm
        # azure/setup-helm@v4.3.1
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.2.0

      - name: Helm lint
        run: helm lint deploy/helm/tetral

      - name: Helm equivalence and rendered manifest guards
        run: go test -count=1 ./deploy/helm/...

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.12'
          cache-dependency-path: go.sum

      - name: Setup Bun
        # oven-sh/setup-bun@v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Agent Runtime dependencies
        working-directory: services/agent-runtime
        run: bun install --frozen-lockfile

      - name: Install Gateway Service dependencies
        working-directory: services/gateway
        run: bun install --frozen-lockfile

      - name: Agent Runtime dependency audit
        working-directory: services/agent-runtime
        run: bun audit

      - name: Gateway Service dependency audit
        working-directory: services/gateway
        run: bun audit

      - name: Secret and redaction static guards
        run: go test ./integration/static -run 'Test.*Secret|Test.*Redact|Test.*Import|Test.*Boundary|Test.*Log' -count=1

  helper-privilege:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Root sandbox-helper privilege continuity
        run: ./scripts/run-helper-privilege-ci.sh

  external-smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'external-smoke'))) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Bun
        # oven-sh/setup-bun@v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Gateway Service dependencies
        working-directory: services/gateway
        run: bun install --frozen-lockfile

      - name: Resource projection live smoke
        env:
          TETRAL_RESOURCE_PROJECTION_LIVE: ${{ vars.TETRAL_RESOURCE_PROJECTION_LIVE }}
          TETRAL_RESOURCE_PROJECTION_LIVE_ARTIFACT_REF: ${{ vars.TETRAL_RESOURCE_PROJECTION_LIVE_ARTIFACT_REF }}
          DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
          DAYTONA_TARGET: ${{ vars.DAYTONA_TARGET }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          TETRAL_BLOB_ENDPOINT: ${{ secrets.TETRAL_BLOB_ENDPOINT }}
          TETRAL_BLOB_REGION: ${{ vars.TETRAL_BLOB_REGION }}
          TETRAL_BLOB_BUCKET: ${{ vars.TETRAL_BLOB_BUCKET }}
          TETRAL_BLOB_ACCESS_KEY: ${{ secrets.TETRAL_BLOB_ACCESS_KEY }}
          TETRAL_BLOB_SECRET_KEY: ${{ secrets.TETRAL_BLOB_SECRET_KEY }}
          TETRAL_R2_ACCOUNT_ID: ${{ secrets.TETRAL_R2_ACCOUNT_ID }}
          TETRAL_R2_PARENT_API_TOKEN: ${{ secrets.TETRAL_R2_PARENT_API_TOKEN }}
          TETRAL_R2_PARENT_ACCESS_KEY: ${{ secrets.TETRAL_R2_PARENT_ACCESS_KEY }}
        run: |
          echo "External smoke is operator-triggered only and requires provisioned Daytona/R2 credentials."
          go test ./services/sandbox -run 'TestLiveResourceProjection' -count=1 -v

      - name: Gateway live provider smoke
        working-directory: services/gateway
        env:
          TETRAL_GATEWAY_LIVE_PROVIDER_SMOKE: ${{ vars.TETRAL_GATEWAY_LIVE_PROVIDER_SMOKE }}
          TETRAL_LIVE_OPENAI_API_KEY: ${{ secrets.TETRAL_LIVE_OPENAI_API_KEY }}
          TETRAL_LIVE_ANTHROPIC_API_KEY: ${{ secrets.TETRAL_LIVE_ANTHROPIC_API_KEY }}
          TETRAL_LIVE_DEEPSEEK_API_KEY: ${{ secrets.TETRAL_LIVE_DEEPSEEK_API_KEY }}
          TETRAL_LIVE_KIMI_API_KEY: ${{ secrets.TETRAL_LIVE_KIMI_API_KEY }}
          TETRAL_LIVE_ZAI_API_KEY: ${{ secrets.TETRAL_LIVE_ZAI_API_KEY }}
        run: bun test packages/provider-gateway/test/live/provider-live-smoke.test.ts

      # Registration only: the live topology harness and its credential inputs
      # are intentionally not invented in the repository implementation batch.
      - name: MCP first-message delivery live smoke (registered)
        if: ${{ false }}
        run: >-
          echo "Create an agent with an MCP toolset, send one message, and
          verify that the message reaches the runtime after initial manifest
          discovery."

      - name: External Gateway smoke
        env:
          TETRAL_EXTERNAL_GATEWAY_SMOKE: ${{ vars.TETRAL_EXTERNAL_GATEWAY_SMOKE }}
          TETRAL_EXTERNAL_GATEWAY_BASE_URL: ${{ vars.TETRAL_EXTERNAL_GATEWAY_BASE_URL }}
        run: |
          if [ "${TETRAL_EXTERNAL_GATEWAY_SMOKE:-}" != "1" ]; then
            echo "External Gateway smoke disabled."
            exit 0
          fi
          : "${TETRAL_EXTERNAL_GATEWAY_BASE_URL:?TETRAL_EXTERNAL_GATEWAY_BASE_URL is required when TETRAL_EXTERNAL_GATEWAY_SMOKE=1}"
          base="${TETRAL_EXTERNAL_GATEWAY_BASE_URL%/}"
          for path in /healthz /readyz /metrics; do
            curl --fail --silent --show-error --max-time 10 "$base$path" >/dev/null
          done
