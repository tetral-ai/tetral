name: CI Benchmark

on:
  workflow_dispatch:
    inputs:
      base:
        description: Commit for side A (a SHA or origin/<branch>); empty selects the merge base of the dispatched ref with origin/main
        required: false
        default: ''

permissions:
  actions: read
  contents: read

cache-mode: read

concurrency:
  group: ci-benchmark-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  TETRAL_CI_REPOSITORY: ${{ github.repository }}
  TETRAL_CI_EVENT_HEAD_SHA: ${{ github.sha }}
  TETRAL_CI_WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
  TETRAL_CI_WORKFLOW: ${{ github.workflow }}
  TETRAL_CI_RUN_ID: ${{ github.run_id }}
  TETRAL_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
  TETRAL_CI_JOB: ${{ github.job }}

jobs:
  resolve:
    name: Resolve Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.commits.outputs.base }}
      head: ${{ steps.commits.outputs.head }}
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the base and head commits
        id: commits
        env:
          BASE_INPUT: ${{ inputs.base }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [[ -n "$BASE_INPUT" ]]; then
            base="$(git rev-parse --verify --end-of-options "${BASE_INPUT}^{commit}")"
          else
            base="$(git merge-base HEAD origin/main)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "A = $base, B = $head"

  a-go-race:
    name: A Go Race (shard ${{ matrix.shard }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TETRAL_CI_TEST_MERGE_SHA: ${{ needs.resolve.outputs.base }}
    steps:
      - name: Check out the base revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all Go packages under Race
        uses: ./.github/actions/run-test-evidence
        with:
          group: go
          producer: go-${{ matrix.shard }}
          artifact-prefix: bench-a
          shard-index: ${{ matrix.shard }}
          shard-count: '4'
          needs-helm: 'true'
          needs-bun: 'true'
          needs-buf: 'true'
          needs-go-test-host: 'true'

  b-go-race:
    name: B Go Race (shard ${{ matrix.shard }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TETRAL_CI_TEST_MERGE_SHA: ${{ needs.resolve.outputs.head }}
    steps:
      - name: Check out the head revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.resolve.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all Go packages under Race
        uses: ./.github/actions/run-test-evidence
        with:
          group: go
          producer: go-${{ matrix.shard }}
          artifact-prefix: bench-b
          shard-index: ${{ matrix.shard }}
          shard-count: '4'
          needs-helm: 'true'
          needs-bun: 'true'
          needs-buf: 'true'
          needs-go-test-host: 'true'

  compare:
    name: Compare A and B
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    needs: [resolve, a-go-race, b-go-race]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go for the comparison
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - name: Download side A evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: bench-a-*-${{ github.run_id }}-*
          path: .test-results/ci-benchmark/a
      - name: Download side B evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: bench-b-*-${{ github.run_id }}-*
          path: .test-results/ci-benchmark/b
      - name: Compare A and B
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base }}
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
        run: >-
          go run ./internal/testinfra/cmd/tetral-ci-bench compare
          --a .test-results/ci-benchmark/a --a-sha "$BASE_SHA" --a-job 'A Go Race (shard %d)'
          --b .test-results/ci-benchmark/b --b-sha "$HEAD_SHA" --b-job 'B Go Race (shard %d)'
          --output .test-results/ci-benchmark/compare.json
          --markdown "$GITHUB_STEP_SUMMARY"
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-benchmark-compare-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/ci-benchmark/compare.json
          if-no-files-found: error
          retention-days: 30
