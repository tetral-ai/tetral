name: engine-release

# One git tag, four images, one version. The tag is the release event; nothing
# else publishes. Image tags carry the version without its leading `v`, and the
# digests each build reports are what a deployment should pin.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish without the leading v (e.g. 0.1.0-alpha)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: engine-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            version="$DISPATCH_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          # SemVer 2 core plus optional pre-release. Build metadata is excluded:
          # the same value is an OCI image tag, where '+' is invalid.
          prerelease_identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${prerelease_identifier}(\\.${prerelease_identifier})*)?$"
          if [[ ! "$version" =~ $semver ]]; then
            echo "refusing to publish version '$version'; require SemVer 2 without build metadata" >&2
            exit 1
          fi
          if (( ${#version} > 128 )); then
            echo "refusing to publish version '$version'; OCI image tags are limited to 128 characters" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  sandbox-image:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Buildx
        # docker/setup-buildx-action@v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GitHub Container Registry
        # docker/login-action@v4.5.1
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sandbox
        id: build
        # docker/build-push-action@v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.sandbox
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sandbox:${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

      - name: Report digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sandbox
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo '```'
            echo "$IMAGE:$VERSION"
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every context is the repository root. Both TypeScript services carry
          # file: dependencies that reach across service boundaries — the
          # Gateway's protocol package and internal/ts-observability — so a
          # narrower context cannot resolve them.
          - image: tetral
            dockerfile: Dockerfile
          - image: gateway
            dockerfile: services/gateway/Dockerfile
          - image: agent-runtime
            dockerfile: services/agent-runtime/Dockerfile
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Buildx
        # docker/setup-buildx-action@v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GitHub Container Registry
        # docker/login-action@v4.5.1
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        id: build
        # docker/build-push-action@v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # No `latest`: a moving tag makes a deployment unreproducible, and the
          # manifests name an exact version.
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Report digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo '```'
            echo "$IMAGE:$VERSION"
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  daytona-release-smoke:
    needs: sandbox-image
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.13'
          cache-dependency-path: go.sum

      - name: Daytona published Sandbox image smoke
        env:
          TETRAL_DAYTONA_RELEASE_SMOKE: "1"
          TETRAL_DAYTONA_RELEASE_SMOKE_IMAGE: ghcr.io/${{ github.repository_owner }}/sandbox@${{ needs.sandbox-image.outputs.digest }}
          TETRAL_DAYTONA_RELEASE_SMOKE_OWNER: ${{ github.repository_id }}-${{ github.run_id }}
          DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
          DAYTONA_TARGET: ${{ vars.DAYTONA_TARGET }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: >-
          go test -tags daytona_release_smoke ./services/sandbox
          -run '^TestDaytonaPublishedImageProductionAdapterSmoke$' -count=1 -v

  chart:
    needs: [version, images, daytona-release-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Helm
        # azure/setup-helm@v4.3.1
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.2.0

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm package deploy/helm/tetral --version "$VERSION" --app-version "$VERSION"

      - name: Push chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm push "tetral-$VERSION.tgz" oci://ghcr.io/tetral-ai/charts
