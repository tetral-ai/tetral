name: Main Branch Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-verification-${{ github.sha }}
  cancel-in-progress: false

env:
  TETRAL_CI_REPOSITORY: ${{ github.repository }}
  TETRAL_CI_EVENT_HEAD_SHA: ${{ github.sha }}
  TETRAL_CI_EVENT_BASE_SHA: ${{ github.sha }}
  TETRAL_CI_TEST_MERGE_SHA: ${{ github.sha }}
  TETRAL_CI_REQUIRED_CHECK_SHA: ${{ github.sha }}
  TETRAL_CI_WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
  TETRAL_CI_WORKFLOW: ${{ github.workflow }}
  TETRAL_CI_RUN_ID: ${{ github.run_id }}
  TETRAL_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
  TETRAL_CI_JOB: ${{ github.job }}

jobs:
  integrated-correctness:
    name: Integrated Correctness and Full Race
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the merged repository
        uses: ./.github/actions/run-test-evidence
        with:
          group: all
          producer: integrated
          artifact-prefix: main-evidence
          needs-bun: 'true'
          needs-buf: 'true'
          needs-helm: 'true'
          needs-lint: 'true'
          needs-go-test-host: 'true'
          dependency-audit: never

  coverage:
    name: Report-only Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.13'
          cache-dependency-path: go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: services/gateway/package.json
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0
      - name: Prepare Go integration host
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -Ur -m true
      - name: Collect ordinary coverage
        env:
          TETRAL_CI_PRODUCER: coverage
        run: go run ./internal/testinfra/cmd/tetral-coverage --output .test-results/coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/coverage
          if-no-files-found: error
          retention-days: 14
