name: Main Branch Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-verification-${{ github.sha }}
  cancel-in-progress: false

env:
  TETRAL_CI_REPOSITORY: ${{ github.repository }}
  TETRAL_CI_EVENT_HEAD_SHA: ${{ github.sha }}
  TETRAL_CI_EVENT_BASE_SHA: ${{ github.sha }}
  TETRAL_CI_TEST_MERGE_SHA: ${{ github.sha }}
  TETRAL_CI_REQUIRED_CHECK_SHA: ${{ github.sha }}
  TETRAL_CI_WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
  TETRAL_CI_WORKFLOW: ${{ github.workflow }}
  TETRAL_CI_RUN_ID: ${{ github.run_id }}
  TETRAL_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
  TETRAL_CI_JOB: ${{ github.job }}

jobs:
  verification:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Repository Integrity
            group: repository
            producer: repository
            needs_bun: 'false'
            needs_buf: 'false'
            needs_helm: 'false'
            needs_lint: 'false'
          - name: Go Static Analysis
            group: go-static
            producer: go-static
            needs_bun: 'false'
            needs_buf: 'false'
            needs_helm: 'false'
            needs_lint: 'true'
          - name: Agent Runtime
            group: runtime
            producer: runtime
            needs_bun: 'true'
            needs_buf: 'false'
            needs_helm: 'false'
            needs_lint: 'false'
          - name: Provider Gateway
            group: gateway
            producer: gateway
            needs_bun: 'true'
            needs_buf: 'false'
            needs_helm: 'false'
            needs_lint: 'false'
          - name: Protocol and SDK Compatibility
            group: protocol
            producer: protocol
            needs_bun: 'true'
            needs_buf: 'true'
            needs_helm: 'false'
            needs_lint: 'false'
          - name: Deployment Definitions
            group: deployment
            producer: deployment
            needs_bun: 'true'
            needs_buf: 'false'
            needs_helm: 'true'
            needs_lint: 'false'
          - name: Sandbox Image
            group: sandbox-image
            producer: sandbox-image
            needs_bun: 'false'
            needs_buf: 'false'
            needs_helm: 'false'
            needs_lint: 'false'
          - name: Dependency Security
            group: security
            producer: security
            needs_bun: 'true'
            needs_buf: 'false'
            needs_helm: 'false'
            needs_lint: 'false'
    steps:
      - name: Check out the exact merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify ${{ matrix.name }}
        uses: ./.github/actions/run-test-evidence
        with:
          group: ${{ matrix.group }}
          producer: ${{ matrix.producer }}
          artifact-prefix: main-evidence
          needs-bun: ${{ matrix.needs_bun }}
          needs-buf: ${{ matrix.needs_buf }}
          needs-helm: ${{ matrix.needs_helm }}
          needs-lint: ${{ matrix.needs_lint }}
          dependency-audit: never

  go-race:
    name: Go Race (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    cache-mode: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out the exact merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all Go packages under Race
        uses: ./.github/actions/run-test-evidence
        with:
          group: go
          producer: go-${{ matrix.shard }}
          artifact-prefix: main-evidence
          shard-index: ${{ matrix.shard }}
          shard-count: '4'
          needs-helm: 'true'
          needs-bun: 'true'
          needs-buf: 'true'
          needs-go-test-host: 'true'
          dependency-audit: never
          go-cache: 'true'
