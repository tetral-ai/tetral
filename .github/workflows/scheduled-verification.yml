name: Scheduled Verification

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: scheduled-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  TETRAL_CI_REPOSITORY: ${{ github.repository }}
  TETRAL_CI_EVENT_HEAD_SHA: ${{ github.sha }}
  TETRAL_CI_EVENT_BASE_SHA: ${{ github.sha }}
  TETRAL_CI_TEST_MERGE_SHA: ${{ github.sha }}
  TETRAL_CI_REQUIRED_CHECK_SHA: ${{ github.sha }}
  TETRAL_CI_WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
  TETRAL_CI_WORKFLOW: ${{ github.workflow }}
  TETRAL_CI_RUN_ID: ${{ github.run_id }}
  TETRAL_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
  TETRAL_CI_JOB: ${{ github.job }}

jobs:
  concurrency-history:
    name: Repeated Concurrency Owners
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the scheduled revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.13'
          cache-dependency-path: go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: services/gateway/package.json
      - name: Run bounded repeated concurrency evidence
        env:
          TETRAL_CI_PRODUCER: scheduled-concurrency
        run: go run ./internal/testinfra/cmd/tetral-scheduled --output .test-results/scheduled-concurrency
      - name: Upload repeated evidence with first-failure history
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-concurrency-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/scheduled-concurrency
          if-no-files-found: error
          retention-days: 30

  compatibility-health:
    name: Compatibility and Repository Health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the scheduled revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify compatibility and hygiene candidates
        uses: ./.github/actions/run-test-evidence
        with:
          group: repository,protocol,security
          producer: scheduled-health
          artifact-prefix: scheduled-evidence
          needs-bun: 'true'
          needs-buf: 'true'

  ci-health:
    name: CI Health and Calibration
    if: always()
    needs: [concurrency-history, compatibility-health]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the scheduled revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.13'
          cache-dependency-path: go.sum
      - name: Download scheduled evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scheduled-*
          path: .test-results/downloaded
      - name: Build report-only health evidence
        run: >-
          go run ./internal/testinfra/cmd/tetral-ci-health
          --artifacts .test-results/downloaded
          --output .test-results/ci-health.json
      - name: Upload CI health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-ci-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/ci-health.json
          if-no-files-found: error
          retention-days: 30
