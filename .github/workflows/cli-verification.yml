name: CLI Verification

# No path filter: CLI results reports on every pull request, so it can be a
# required check; the changed job decides whether the build jobs run. Only
# pull request updates and manual dispatch start it: another pull request event,
# such as a label, changes no code, and its run would cancel the running one in
# the pull request's concurrency group.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      measure-builds:
        description: Measure cold and warm builds on the same runner before testing
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

cache-mode: read

concurrency:
  group: cli-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      cli: ${{ steps.products.outputs.cli }}
    steps:
      - name: Check out the pull request with its history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go for the decision
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'
          cache: false
      - name: Decide from the changed paths
        id: products
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          go run ./internal/testinfra/cmd/tetral-ci-flow decide
          --event "$EVENT_NAME"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          >> "$GITHUB_OUTPUT"

  linux:
    name: Linux CLI (${{ matrix.profile }})
    needs: changed
    if: needs.changed.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        profile: [functional, release, task-capacity]
    env:
      CLI_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Initialize the evidence directory
        id: evidence
        run: |
          mkdir -p "$RUNNER_TEMP/cli-$CLI_PROFILE"
          printf 'CLI_EVIDENCE_DIR=%s/cli-%s\n' "$RUNNER_TEMP" "$CLI_PROFILE" >> "$GITHUB_ENV"
      - name: Check out the revision under test
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Go for the reference control server
        id: go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'
          cache: false
      - name: Allow unprivileged user namespaces
        id: namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install bubblewrap for the sandboxed tool processes
        id: bubblewrap
        run: ./scripts/install-bubblewrap.sh
      - name: Install the pinned Rust toolchain
        id: rust
        working-directory: cli
        run: rustup toolchain install
      - name: Install cargo-nextest, which runs each test in its own process
        id: nextest
        run: ./scripts/install-cargo-nextest.sh
      - name: Install golangci-lint for the reference control server
        id: lint
        if: matrix.profile == 'functional'
        uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7
        with:
          version: v2.11.4
          install-only: true
      - name: Restore the compiled CLI dependencies and selected artifacts
        id: cache
        if: inputs.measure-builds != true
        uses: ./.github/actions/cli-build-cache
        with:
          profile: ${{ matrix.profile }}
          evidence-dir: ${{ env.CLI_EVIDENCE_DIR }}/cache
      - name: Measure cold and warm builds without a restored cache
        id: measure
        if: inputs.measure-builds == true
        env:
          CLI_PROFILE: ${{ matrix.profile }}
        run: |
          ./scripts/cli-build-cache.sh build "$CLI_PROFILE" cold "$CLI_EVIDENCE_DIR/builds"
          ./scripts/cli-build-cache.sh build "$CLI_PROFILE" warm "$CLI_EVIDENCE_DIR/builds"
      # `exec`: a cancelled or timed-out job signals the step's process, which
      # must be the run command, so that it stops its tests and keeps their
      # records.
      - name: Verify the selected CLI behavior
        id: verify
        env:
          CLI_PROFILE: ${{ matrix.profile }}
        run: exec python3 scripts/verify-cli.py "$CLI_PROFILE" --evidence-dir "$CLI_EVIDENCE_DIR/verification"
      # The reference control server is a Go module of its own; its checks run
      # here and in no workflow of Engine. They run also when the CLI's tests
      # failed, so that one run shows both results.
      - name: Check the reference control server in its own Go module
        id: reference
        if: ${{ !cancelled() && matrix.profile == 'functional' && steps.go.outcome == 'success' && steps.lint.outcome == 'success' }}
        timeout-minutes: 10
        run: exec python3 scripts/verify-cli.py reference --evidence-dir "$CLI_EVIDENCE_DIR/reference"
      - name: Record setup and verification outcomes
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$CLI_EVIDENCE_DIR"
          printf '%s\n' "$STEP_RESULTS" > "$CLI_EVIDENCE_DIR/steps.json"
          {
            printf 'revision=%s\nrunner=%s/%s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH"
            (cd cli && rustc -vV && cargo -V) || true
            go version || true
            df -h .
          } > "$CLI_EVIDENCE_DIR/environment.txt"
      - name: Retain CLI logs, timings and acceptance records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.profile }}-${{ github.run_attempt }}
          path: ${{ env.CLI_EVIDENCE_DIR }}
          if-no-files-found: warn

  macos:
    name: macOS CLI (${{ matrix.profile }})
    needs: changed
    if: needs.changed.outputs.cli == 'true'
    runs-on: macos-15
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        profile: [functional, release, full-ledger]
    env:
      CLI_PROFILE: ${{ matrix.profile }}
    steps:
      # The runner indexes its own preinstalled toolchains for Spotlight while
      # the job builds and tests, on a third of its processors.
      - name: Turn off Spotlight indexing
        id: spotlight
        run: sudo mdutil -a -i off
      - name: Initialize the evidence directory
        id: evidence
        run: |
          mkdir -p "$RUNNER_TEMP/cli-macos-$CLI_PROFILE"
          printf 'CLI_EVIDENCE_DIR=%s/cli-macos-%s\n' "$RUNNER_TEMP" "$CLI_PROFILE" >> "$GITHUB_ENV"
      - name: Check out the revision under test
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Go for the reference control server
        id: go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'
          cache: false
      - name: Install the pinned Rust toolchain
        id: rust
        working-directory: cli
        run: rustup toolchain install
      - name: Install cargo-nextest, which runs each test in its own process
        id: nextest
        run: ./scripts/install-cargo-nextest.sh
      - name: Verify the selected CLI behavior
        id: verify
        run: exec python3 scripts/verify-cli.py "$CLI_PROFILE" --evidence-dir "$CLI_EVIDENCE_DIR/verification"
      - name: Record setup and verification outcomes
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$CLI_EVIDENCE_DIR"
          printf '%s\n' "$STEP_RESULTS" > "$CLI_EVIDENCE_DIR/steps.json"
          {
            printf 'revision=%s\nrunner=%s/%s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH"
            (cd cli && rustc -vV && cargo -V) || true
            go version || true
            sw_vers || true
            df -h .
          } > "$CLI_EVIDENCE_DIR/environment.txt"
      - name: Retain CLI logs, timings and acceptance records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-macos-${{ matrix.profile }}-${{ github.run_attempt }}
          path: ${{ env.CLI_EVIDENCE_DIR }}
          if-no-files-found: warn

  results:
    name: CLI results
    needs: [changed, linux, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Go for the gate
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'
          cache: false
      - name: Require every job that ran to pass
        env:
          TETRAL_CI_NEEDS: ${{ toJSON(needs) }}
        run: go run ./internal/testinfra/cmd/tetral-ci-flow needs --deciding changed --product cli
      # Last, so the time counts everything the gate did before it.
      - name: Fail a run that took thirty minutes or more
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TETRAL_CI_REPOSITORY: ${{ github.repository }}
          TETRAL_CI_RUN_ID: ${{ github.run_id }}
          TETRAL_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: go run ./internal/testinfra/cmd/tetral-ci-flow duration --gate "CLI results"
