name: CLI Verification

# No path filter: CLI results reports on every pull request, so it can be a
# required check; the changed job decides whether the build jobs run.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

cache-mode: read

concurrency:
  group: cli-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.paths.outputs.cli }}
    steps:
      - name: Check out the pull request with its history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find changes to the CLI
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The three-dot range lists what the pull request changes since its
          # merge base, not what the base branch gained since. -z prints each
          # path verbatim, ended by NUL; without it git quotes a path holding a
          # non-ASCII byte, a quote or a control character, and the quoted form
          # would miss the pattern.
          changed="$RUNNER_TEMP/changed-paths"
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$changed"
          cli=false
          while IFS= read -r -d '' path; do
            case "$path" in
              cli/*|protocol/*|go.mod|go.sum|internal/pathvalidation/*|.github/workflows/cli-verification.yml)
                cli=true
                break
                ;;
              # These owners do not enter the CLI build or its reference
              # server. Keep this list aligned with their dependencies.
              services/*|deploy/*|docs/*|README.md)
                ;;
              # Unknown ownership runs verification, including new build
              # configuration and dependencies outside the CLI workspace.
              *)
                cli=true
                break
                ;;
            esac
          done < "$changed"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"

  linux:
    needs: changed
    if: needs.changed.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Go for the reference control server
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.10'
          cache: false
      - name: Allow unprivileged user namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install bubblewrap for the sandboxed tool processes
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Install the pinned Rust toolchain
        working-directory: cli
        run: rustup toolchain install
      - name: Build
        working-directory: cli
        run: cargo build --locked
      - name: Test
        working-directory: cli
        env:
          TETRAL_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
        run: cargo test --locked

  results:
    name: CLI results
    needs: [changed, linux]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job that ran to pass
        env:
          CHANGED_RESULT: ${{ needs.changed.result }}
          CLI_CHANGED: ${{ needs.changed.outputs.cli }}
          BUILD_RESULT: ${{ needs.linux.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGED_RESULT" != "success" ]; then
            echo "the changed job ended with $CHANGED_RESULT"
            exit 1
          fi
          case "$CLI_CHANGED:$BUILD_RESULT" in
            true:success|false:skipped|false:success)
              exit 0
              ;;
            *)
              echo "CLI selection was '$CLI_CHANGED' and its build ended with '$BUILD_RESULT'"
              exit 1
              ;;
          esac
