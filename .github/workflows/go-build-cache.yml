name: Go Build Cache

# The only writer of go-race-v1 entries in main's cache scope.

on:
  push:
    branches: [main]
  schedule:
    - cron: '11 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-build-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the Go Race cache
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    cache-mode: write
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Go without its own cache
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'
          cache: false
      - name: Compute the Go build cache key
        id: go-cache-key
        shell: bash
        run: ./scripts/go-build-cache-key.sh
      # A daily run finds the push run's entry and stops here; it rebuilds only
      # after the Go or gcc version changed or the entry was evicted or expired.
      - name: Look up the entry for this revision
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ steps.go-cache-key.outputs.key }}
          lookup-only: true
      - name: Build what Go Race compiles
        if: steps.lookup.outputs.cache-hit != 'true'
        run: ./scripts/build-go-cache.sh
      - name: Save the entry
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ steps.go-cache-key.outputs.key }}

  # On a schedule only: opens this workflow's issue when a job failed, adds a
  # comment while it stays red, and closes it on the next green run.
  report-red:
    name: Report a Red Scheduled Run
    needs: [build]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Check out the revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'
          cache: false
      - name: Open, update or close the workflow's issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          go run ./internal/testinfra/cmd/tetral-ci-flow scheduled-issue
          --workflow "$WORKFLOW"
          --run "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --run-url "$RUN_URL"
          --commit "$GITHUB_SHA"
          --reporter 'Report a Red Scheduled Run'
