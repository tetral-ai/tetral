name: Base Image Maintenance

on:
  workflow_dispatch:
    inputs:
      source:
        description: Immutable upstream image (repository@sha256:digest)
        required: true
        type: string
      target_repository:
        description: Approved mirror repository without a tag
        required: true
        default: ghcr.io/tetral-ai/mirror/manual
        type: string
      platform:
        description: Explicit source platform
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: base-image-maintenance-${{ inputs.target_repository }}-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror immutable base
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate immutable identities
        id: identity
        env:
          SOURCE: ${{ inputs.source }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "source must be repository@sha256:digest" >&2
            exit 1
          fi
          if [[ ! "$TARGET_REPOSITORY" =~ ^ghcr\.io/tetral-ai/mirror/[a-z0-9._/-]+$ ]]; then
            echo "target repository is outside the approved mirror namespace" >&2
            exit 1
          fi
          test "$PLATFORM" = "linux/amd64"
          source_digest="${SOURCE##*@sha256:}"
          target_tag="sha256-$source_digest"
          echo "target=$TARGET_REPOSITORY:$target_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror without overwrite
        id: mirror
        env:
          SOURCE: ${{ inputs.source }}
          PLATFORM: ${{ inputs.platform }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET: ${{ steps.identity.outputs.target }}
        run: |
          set -euo pipefail
          source_repository="${SOURCE%@*}"
          source_raw="$(docker buildx imagetools inspect "$SOURCE" --raw)"
          source_media="$(jq -r .mediaType <<<"$source_raw")"
          if test "$source_media" = application/vnd.oci.image.index.v1+json || test "$source_media" = application/vnd.docker.distribution.manifest.list.v2+json; then
            selected_digest="$(jq -r '[.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64")] | if length == 1 then .[0].digest else error("linux/amd64 child is not unique") end' <<<"$source_raw")"
            selected_media="$(jq -r --arg digest "$selected_digest" '.manifests[] | select(.digest==$digest) | .mediaType' <<<"$source_raw")"
            selected_source="$source_repository@$selected_digest"
          else
            selected_digest="${SOURCE##*@}"
            selected_media="$source_media"
            selected_source="$SOURCE"
          fi
          source_identity="$(docker buildx imagetools inspect "$selected_source" --raw)"
          if existing="$(docker buildx imagetools inspect "$TARGET" --format '{{json .Manifest}}' 2>/dev/null)"; then
            existing_digest="$(jq -r .digest <<<"$existing")"
            test "$existing_digest" = "$selected_digest" || {
              echo "target identity already exists with different bytes" >&2
              exit 1
            }
          else
            docker buildx imagetools create --prefer-index=false --tag "$TARGET" "$selected_source"
          fi
          mirrored="$(docker buildx imagetools inspect "$TARGET" --raw)"
          mirrored_descriptor="$(docker buildx imagetools inspect "$TARGET" --format '{{json .Manifest}}')"
          mirrored_digest="$(jq -r .digest <<<"$mirrored_descriptor")"
          test "$mirrored_digest" = "$selected_digest" && test "$mirrored" = "$source_identity" || {
            echo "mirrored identity differs from the selected source" >&2
            exit 1
          }
          {
            echo "selected_source=$selected_source"
            echo "selected_digest=$selected_digest"
            echo "selected_media=$selected_media"
            echo "target_digest=$TARGET_REPOSITORY@$mirrored_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Report the Gate-protected source update
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ steps.identity.outputs.target }}
          TARGET_DIGEST: ${{ steps.mirror.outputs.target_digest }}
          SELECTED_DIGEST: ${{ steps.mirror.outputs.selected_digest }}
          SELECTED_MEDIA: ${{ steps.mirror.outputs.selected_media }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          {
            echo "### Immutable base image"
            echo
            echo "- source: \`$SOURCE\`"
            echo "- mirror: \`$TARGET\`"
            echo "- immutable mirror: \`$TARGET_DIGEST\`"
            echo "- platform: \`$PLATFORM\`"
            echo "- selected child: \`$SELECTED_DIGEST\` ($SELECTED_MEDIA)"
            echo
            echo "Update the owning Dockerfile and internal/release/base_images.json through a normal Merge Gate-protected pull request using the exact mirror digest above."
          } >> "$GITHUB_STEP_SUMMARY"
