name: Pull Request Verification

on:
  pull_request:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

cache-mode: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  TETRAL_CI_REPOSITORY: ${{ github.repository }}
  TETRAL_CI_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TETRAL_CI_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  TETRAL_CI_TEST_MERGE_SHA: ${{ github.sha }}
  TETRAL_CI_REQUIRED_CHECK_SHA: ${{ github.event.pull_request.head.sha }}
  TETRAL_CI_WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
  TETRAL_CI_WORKFLOW: ${{ github.workflow }}
  TETRAL_CI_RUN_ID: ${{ github.run_id }}
  TETRAL_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
  TETRAL_CI_JOB: ${{ github.job }}
  TETRAL_CI_PULL_REQUEST: ${{ github.event.pull_request.number }}

jobs:
  repository-sandbox-security-runtime:
    name: Repository, Sandbox Image, Security and Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify repository integrity
        timeout-minutes: 13
        uses: ./.github/actions/run-test-evidence
        with:
          group: repository
          producer: repository
          artifact-prefix: pr-evidence
          time-limit-minutes: 10
      # Before any Bun install, so the image build context holds no node_modules.
      - name: Verify the local Sandbox image
        if: ${{ !cancelled() }}
        timeout-minutes: 23
        uses: ./.github/actions/run-test-evidence
        with:
          group: sandbox-image
          producer: sandbox-image
          artifact-prefix: pr-evidence
          time-limit-minutes: 20
          go-cache: none
      - name: Verify dependencies and redaction boundaries
        if: ${{ !cancelled() }}
        timeout-minutes: 23
        uses: ./.github/actions/run-test-evidence
        with:
          group: security
          producer: security
          artifact-prefix: pr-evidence
          needs-bun: 'true'
          dependency-audit: changed
          time-limit-minutes: 20
          go-cache: none
      - name: Verify the Runtime service
        if: ${{ !cancelled() }}
        timeout-minutes: 23
        uses: ./.github/actions/run-test-evidence
        with:
          group: runtime
          producer: runtime
          artifact-prefix: pr-evidence
          needs-bun: 'true'
          time-limit-minutes: 20
          go-cache: none

  go-static-analysis:
    name: Go Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Go build and static analysis
        uses: ./.github/actions/run-test-evidence
        with:
          group: go-static
          producer: go-static
          artifact-prefix: pr-evidence
          needs-lint: 'true'

  go-race:
    name: Go Race (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all Go packages under Race
        uses: ./.github/actions/run-test-evidence
        with:
          group: go
          producer: go-${{ matrix.shard }}
          artifact-prefix: pr-evidence
          shard-index: ${{ matrix.shard }}
          shard-count: '5'
          needs-helm: 'true'
          needs-bun: 'true'
          needs-buf: 'true'
          needs-go-test-host: 'true'
          go-cache: 'true'

  provider-gateway:
    name: Provider Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the Gateway service
        uses: ./.github/actions/run-test-evidence
        with:
          group: gateway
          producer: gateway
          artifact-prefix: pr-evidence
          needs-bun: 'true'

  deployment-protocol:
    name: Deployment and Protocol
    runs-on: ubuntu-latest
    timeout-minutes: 44
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Kubernetes and Helm definitions
        timeout-minutes: 18
        uses: ./.github/actions/run-test-evidence
        with:
          group: deployment
          producer: deployment
          artifact-prefix: pr-evidence
          needs-bun: 'true'
          needs-helm: 'true'
          time-limit-minutes: 15
          go-cache: 'true'
      - name: Verify protocol and SDK contracts
        if: ${{ !cancelled() }}
        timeout-minutes: 23
        uses: ./.github/actions/run-test-evidence
        with:
          group: protocol
          producer: protocol
          artifact-prefix: pr-evidence
          needs-bun: 'true'
          needs-buf: 'true'
          time-limit-minutes: 20
          go-cache: none

  merge-gate:
    name: Merge Gate
    if: always()
    needs:
      - repository-sandbox-security-runtime
      - go-static-analysis
      - go-race
      - provider-gateway
      - deployment-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TETRAL_CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go for reconciliation
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.sum
      - name: Download all evidence results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: pr-evidence-*-${{ github.run_id }}-*
          path: .test-results/downloaded
      - name: Reconcile exact-head evidence
        run: >-
          go run ./internal/testinfra/cmd/tetral-ci-gate
          --artifacts .test-results/downloaded
          --output .test-results/merge-gate.json
      - name: Upload Merge Gate verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-merge-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/merge-gate.json
          if-no-files-found: error
          retention-days: 14
