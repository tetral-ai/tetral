name: Pull Request Verification

on:
  pull_request:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

cache-mode: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  TETRAL_CI_REPOSITORY: ${{ github.repository }}
  TETRAL_CI_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TETRAL_CI_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  TETRAL_CI_TEST_MERGE_SHA: ${{ github.sha }}
  TETRAL_CI_REQUIRED_CHECK_SHA: ${{ github.event.pull_request.head.sha }}
  TETRAL_CI_WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
  TETRAL_CI_WORKFLOW: ${{ github.workflow }}
  TETRAL_CI_RUN_ID: ${{ github.run_id }}
  TETRAL_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
  TETRAL_CI_JOB: ${{ github.job }}
  TETRAL_CI_PULL_REQUEST: ${{ github.event.pull_request.number }}

jobs:
  # Merge Gate is a required check, so the workflow starts on every pull
  # request and this job decides whether Engine's jobs run.
  decide:
    name: Decide What Runs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      engine: ${{ steps.products.outputs.engine }}
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go for the decision
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'
          cache: false
      - name: Decide from the changed paths
        id: products
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          go run ./internal/testinfra/cmd/tetral-ci-flow decide
          --event "$EVENT_NAME"
          --base "$TETRAL_CI_EVENT_BASE_SHA"
          --head "$TETRAL_CI_EVENT_HEAD_SHA"
          >> "$GITHUB_OUTPUT"

  repository-security-runtime:
    name: Repository, Security and Runtime
    needs: decide
    if: needs.decide.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify repository integrity
        timeout-minutes: 5
        uses: ./.github/actions/run-test-evidence
        with:
          group: repository
          producer: repository
          artifact-prefix: pr-evidence
          time-limit-minutes: 2
      - name: Verify dependencies and redaction boundaries
        if: ${{ !cancelled() }}
        timeout-minutes: 7
        uses: ./.github/actions/run-test-evidence
        with:
          group: security
          producer: security
          artifact-prefix: pr-evidence
          needs-bun: 'true'
          dependency-audit: changed
          time-limit-minutes: 4
          go-cache: none
      - name: Verify the Runtime service
        if: ${{ !cancelled() }}
        timeout-minutes: 9
        uses: ./.github/actions/run-test-evidence
        with:
          group: runtime
          producer: runtime
          artifact-prefix: pr-evidence
          needs-bun: 'true'
          time-limit-minutes: 6
          go-cache: none

  # Its own job: the image build's limit does not fit beside other steps under
  # the job timeout, and its build context holds no node_modules of a Bun
  # install.
  sandbox-image:
    name: Sandbox Image
    needs: decide
    if: needs.decide.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the local Sandbox image
        uses: ./.github/actions/run-test-evidence
        with:
          group: sandbox-image
          producer: sandbox-image
          artifact-prefix: pr-evidence
          time-limit-minutes: 20

  go-static-analysis:
    name: Go Static Analysis
    needs: decide
    if: needs.decide.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Go build and static analysis
        uses: ./.github/actions/run-test-evidence
        with:
          group: go-static
          producer: go-static
          artifact-prefix: pr-evidence
          needs-lint: 'true'

  go-race:
    name: Go Race (shard ${{ matrix.shard }})
    needs: decide
    if: needs.decide.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all Go packages under Race
        uses: ./.github/actions/run-test-evidence
        with:
          group: go
          producer: go-${{ matrix.shard }}
          artifact-prefix: pr-evidence
          shard-index: ${{ matrix.shard }}
          shard-count: '5'
          needs-helm: 'true'
          needs-bun: 'true'
          needs-buf: 'true'
          needs-go-test-host: 'true'
          go-cache: 'true'

  provider-gateway:
    name: Provider Gateway
    needs: decide
    if: needs.decide.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the Gateway service
        uses: ./.github/actions/run-test-evidence
        with:
          group: gateway
          producer: gateway
          artifact-prefix: pr-evidence
          needs-bun: 'true'

  deployment-protocol:
    name: Deployment and Protocol
    needs: decide
    if: needs.decide.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Kubernetes and Helm definitions
        timeout-minutes: 12
        uses: ./.github/actions/run-test-evidence
        with:
          group: deployment
          producer: deployment
          artifact-prefix: pr-evidence
          needs-bun: 'true'
          needs-helm: 'true'
          time-limit-minutes: 9
          go-cache: 'true'
      - name: Verify protocol contracts
        if: ${{ !cancelled() }}
        timeout-minutes: 9
        uses: ./.github/actions/run-test-evidence
        with:
          group: protocol
          producer: protocol
          artifact-prefix: pr-evidence
          needs-bun: 'true'
          needs-buf: 'true'
          time-limit-minutes: 6
          go-cache: none

  merge-gate:
    name: Merge Gate
    if: always()
    needs:
      - decide
      - repository-security-runtime
      - sandbox-image
      - go-static-analysis
      - go-race
      - provider-gateway
      - deployment-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      TETRAL_CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Check out the exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go for reconciliation
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum
      - name: Download all evidence results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: pr-evidence-*-${{ github.run_id }}-*
          path: .test-results/downloaded
      - name: Reconcile exact-head evidence
        run: >-
          go run ./internal/testinfra/cmd/tetral-ci-gate
          --artifacts .test-results/downloaded
          --output .test-results/merge-gate.json
      - name: Upload Merge Gate verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-merge-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/merge-gate.json
          if-no-files-found: error
          retention-days: 14
      # Last, so the time counts everything the gate did before it.
      - name: Fail a run that took thirty minutes or more
        if: ${{ !cancelled() }}
        run: go run ./internal/testinfra/cmd/tetral-ci-flow duration --gate "Merge Gate"
