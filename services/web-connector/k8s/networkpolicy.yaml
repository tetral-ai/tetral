apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-connector
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: web-connector
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/egress-intent: "s.jina.ai, r.jina.ai, blob.example.internal"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-connector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 9464
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tetral-agent-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
      ports:
        - protocol: TCP
          port: 9092
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: web-connector-apiserver-egress
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: web-connector
    app.kubernetes.io/part-of: tetral
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: web-connector
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
            - port: '6443'
              protocol: TCP
