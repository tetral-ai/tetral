apiVersion: v1
kind: Service
metadata:
  name: computer-hub
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: computer-hub
    app.kubernetes.io/component: computer-hub
    app.kubernetes.io/part-of: tetral
    tetral.ai/exposure: public
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: computer-hub
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: computer-hub-metrics
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: computer-hub
    app.kubernetes.io/component: computer-hub
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: computer-hub
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
