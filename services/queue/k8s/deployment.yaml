apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: tetral
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queue
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: queue
        app.kubernetes.io/part-of: tetral
    spec:
      serviceAccountName: queue
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: queue
          image: ghcr.io/tetral-ai/tetral:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/tetral-queue
          env:
            - name: TETRAL_DATABASE_TLS_CA_PATH
              value: /var/run/tetral/store-trust/database-ca.crt
            - name: TETRAL_DATABASE_TLS_SERVER_NAME
              value: "tetral-postgres.tetral-system.svc.cluster.local"
            - name: TETRAL_DB_MAX_OPEN_CONNS
              value: "20"
            - name: TETRAL_DRAIN_TIMEOUT_MS
              value: "10000"
            - name: TETRAL_CANCEL_JOIN_TIMEOUT_MS
              value: "5000"
            - name: TETRAL_TRANSPORT_PROFILE
              value: "standard-routed"
            - name: TETRAL_QUEUE_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_HTTP_ADDR
            - name: TETRAL_QUEUE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_GRPC_ADDR
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_DEPLOYMENT_ENVIRONMENT
            - name: TETRAL_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_SERVICE_VERSION
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "queue-database"
                  key: url
            - name: TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_LEASE_RECLAIM_INTERVAL_SECONDS
            - name: TETRAL_QUEUE_LEASE_RECLAIM_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_LEASE_RECLAIM_LIMIT
            - name: TETRAL_QUEUE_RETRY_BASE_MS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_BASE_MS
            - name: TETRAL_QUEUE_RETRY_CAP_MS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_CAP_MS
            - name: TETRAL_QUEUE_RETRY_MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: queue-config
                  key: TETRAL_QUEUE_RETRY_MAX_ATTEMPTS
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: store-trust
              mountPath: /var/run/tetral/store-trust
              readOnly: true
          resources:

            limits:
              cpu: 500m
              ephemeral-storage: 512Mi
              memory: 512Mi
            requests:
              cpu: 100m
              ephemeral-storage: 128Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: store-trust
          configMap:
            name: "tetral-store-trust"
