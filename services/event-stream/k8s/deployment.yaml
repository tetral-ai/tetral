apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-stream
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: event-stream
    app.kubernetes.io/component: event-stream
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-stream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-stream
        app.kubernetes.io/component: event-stream
        app.kubernetes.io/part-of: tetral
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: event-stream
      automountServiceAccountToken: false
      containers:
        - name: event-stream
          image: ghcr.io/tetral-ai/tetral:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/event-stream
          env:
            - name: TETRAL_DATABASE_TLS_CA_PATH
              value: /var/run/tetral/store-trust/database-ca.crt
            - name: TETRAL_DATABASE_TLS_SERVER_NAME
              value: "tetral-postgres.tetral-system.svc.cluster.local"
            - name: TETRAL_DB_MAX_OPEN_CONNS
              value: "20"
            - name: TETRAL_EVENT_STREAM_HTTP_ADDR
              value: ":8080"
            - name: TETRAL_EVENT_STREAM_METRICS_ADDR
              value: ":8081"
            - name: TETRAL_EVENT_STREAM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "tetral-event-stream-database"
                  key: url
            - name: TETRAL_AUTH_INTERNAL_PRINCIPAL_PUBLIC_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: "auth-internal-principal"
                  key: public_key_b64
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: store-trust
              mountPath: /var/run/tetral/store-trust
              readOnly: true
          resources:

            limits:
              cpu: 500m
              ephemeral-storage: 512Mi
              memory: 512Mi
            requests:
              cpu: 50m
              ephemeral-storage: 64Mi
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: store-trust
          configMap:
            name: "tetral-store-trust"
