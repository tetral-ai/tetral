apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  engine-vault-key: replace_me_with_32_byte_hex_vault_key
---
apiVersion: v1
kind: Secret
metadata:
  name: api-database
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  url: postgres://tetral_api:replace_me@postgres.tetral-system.svc.cluster.local:5432/tetral?sslmode=verify-full

# api also requires TETRAL_AUTH_INTERNAL_PRINCIPAL_PUBLIC_KEY_B64 from
# the auth-internal-principal Secret documented by
# services/auth/k8s/secret.example.yaml. api consumes only
# public_key_b64; auth bootstrap and signing material stay owned by auth.
