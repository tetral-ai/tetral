syntax = "proto3";

package tetral.bridge.v1;

option go_package = "github.com/tetral-ai/tetral/services/bridge/gen/tetral/bridge/v1;bridgev1";

service AgentRuntimeBridgeService {
  rpc LoadContext(LoadContextRequest) returns (LoadContextResponse);
  rpc RefreshRuntimeBindingToken(RefreshRuntimeBindingTokenRequest) returns (RefreshRuntimeBindingTokenResponse);
  rpc CommitInputs(CommitInputsRequest) returns (CommitInputsResponse);
  rpc CommitTaskNotificationResult(CommitTaskNotificationResultRequest) returns (CommitTaskNotificationResultResponse);
  rpc WriteEvent(WriteEventRequest) returns (WriteEventResponse);
  rpc SettleToolResult(SettleToolResultRequest) returns (SettleToolResultResponse);
  rpc WriteRequestEnd(WriteRequestEndRequest) returns (WriteRequestEndResponse);
  rpc FinishIdle(FinishIdleRequest) returns (FinishIdleResponse);
  rpc CreateSubagentThread(CreateSubagentThreadRequest) returns (CreateSubagentThreadResponse);
  rpc EnsureApprovalReviewerTrunk(EnsureApprovalReviewerTrunkRequest) returns (EnsureApprovalReviewerTrunkResponse);
  rpc EnsureApprovalReviewerSidecar(EnsureApprovalReviewerSidecarRequest) returns (EnsureApprovalReviewerSidecarResponse);
  rpc AdmitApprovalReviewInput(AdmitApprovalReviewInputRequest) returns (AdmitApprovalReviewInputResponse);
  rpc ResolveChildThread(ResolveChildThreadRequest) returns (ResolveChildThreadResponse);
  rpc ListChildThreads(ListChildThreadsRequest) returns (ListChildThreadsResponse);
  rpc DeliverInterAgentMail(DeliverInterAgentMailRequest) returns (DeliverInterAgentMailResponse);
  rpc ReadAgentMail(ReadAgentMailRequest) returns (ReadAgentMailResponse);
  rpc AdmitChildInterrupt(AdmitChildInterruptRequest) returns (AdmitChildInterruptResponse);
  rpc AwaitChildInterrupt(AwaitChildInterruptRequest) returns (AwaitChildInterruptResponse);
  rpc CloseChildControl(CloseChildControlRequest) returns (CloseChildControlResponse);
  rpc CloseApprovalReviewer(CloseApprovalReviewerRequest) returns (CloseApprovalReviewerResponse);
  rpc MarkChildThreadActive(MarkChildThreadActiveRequest) returns (MarkChildThreadActiveResponse);
  rpc AcceptSandboxExecution(AcceptSandboxExecutionRequest) returns (AcceptSandboxExecutionResponse);
  rpc AwaitSandboxExecution(AwaitSandboxExecutionRequest) returns (AwaitSandboxExecutionResponse);
  rpc ReadCommandResult(ReadCommandResultRequest) returns (ReadCommandResultResponse);
  rpc SendCommandInput(SendCommandInputRequest) returns (SendCommandInputResponse);
  rpc CancelCommand(CancelCommandRequest) returns (CancelCommandResponse);
  rpc RunMemory(RunMemoryRequest) returns (RunMemoryResponse);
  rpc ResolveTransientAttachment(ResolveTransientAttachmentRequest) returns (ResolveTransientAttachmentResponse);
  rpc ResolveFileAttachmentMetadata(ResolveFileAttachmentMetadataRequest) returns (ResolveFileAttachmentMetadataResponse);
  rpc ReadFileAttachmentChunk(ReadFileAttachmentChunkRequest) returns (ReadFileAttachmentChunkResponse);
  rpc McpManifestChanged(McpManifestChangedRequest) returns (McpManifestChangedResponse);
  rpc ClaimMcpToolResult(ClaimMcpToolResultRequest) returns (ClaimMcpToolResultResponse);
  rpc CommitMcpToolResult(CommitMcpToolResultRequest) returns (CommitMcpToolResultResponse);
  rpc RelinquishMcpToolResult(RelinquishMcpToolResultRequest) returns (RelinquishMcpToolResultResponse);
  rpc CommitInternalToolRepair(CommitInternalToolRepairRequest) returns (CommitInternalToolRepairResponse);
  rpc CommitRuntimeTermination(CommitRuntimeTerminationRequest) returns (CommitRuntimeTerminationResponse);
}

enum BridgeWriteStatus {
  BRIDGE_WRITE_STATUS_UNSPECIFIED = 0;
  BRIDGE_WRITE_STATUS_COMMITTED = 1;
  BRIDGE_WRITE_STATUS_DUPLICATE = 2;
  BRIDGE_WRITE_STATUS_REJECTED = 3;
}

enum RuntimeMessageCreateKind {
  RUNTIME_MESSAGE_CREATE_KIND_UNSPECIFIED = 0;
  RUNTIME_MESSAGE_CREATE_KIND_USER_INPUT = 1;
  RUNTIME_MESSAGE_CREATE_KIND_APPROVAL_INPUT = 2;
  RUNTIME_MESSAGE_CREATE_KIND_REVIEWER_INPUT = 3;
  RUNTIME_MESSAGE_CREATE_KIND_AGENT_MAIL_INPUT = 4;
  RUNTIME_MESSAGE_CREATE_KIND_TASK_NOTIFICATION = 5;
  RUNTIME_MESSAGE_CREATE_KIND_REJECTION = 6;
  RUNTIME_MESSAGE_CREATE_KIND_COMPLETION_MAIL = 7;
  RUNTIME_MESSAGE_CREATE_KIND_COMPACTION_CHECKPOINT = 8;
  RUNTIME_MESSAGE_CREATE_KIND_INTERNAL_TOOL_REPAIR = 9;
  RUNTIME_MESSAGE_CREATE_KIND_TERMINATION = 10;
}

enum DurableEventDisposition {
  DURABLE_EVENT_DISPOSITION_UNSPECIFIED = 0;
  DURABLE_EVENT_DISPOSITION_EXISTING = 1;
  DURABLE_EVENT_DISPOSITION_CREATED = 2;
}

enum DurableProjectionDisposition {
  DURABLE_PROJECTION_DISPOSITION_UNSPECIFIED = 0;
  DURABLE_PROJECTION_DISPOSITION_CREATED = 1;
  DURABLE_PROJECTION_DISPOSITION_UPDATED = 2;
}

enum PrefixConsumptionDisposition {
  PREFIX_CONSUMPTION_DISPOSITION_UNSPECIFIED = 0;
  PREFIX_CONSUMPTION_DISPOSITION_CONSUMED = 1;
}

enum ReceiptApplicationDisposition {
  RECEIPT_APPLICATION_DISPOSITION_UNSPECIFIED = 0;
  RECEIPT_APPLICATION_DISPOSITION_CURRENT_CUSTODY = 1;
  RECEIPT_APPLICATION_DISPOSITION_STALE_CUSTODY = 2;
}

enum RequestRescheduleDisposition {
  REQUEST_RESCHEDULE_DISPOSITION_UNSPECIFIED = 0;
  REQUEST_RESCHEDULE_DISPOSITION_ACCEPTED = 1;
  REQUEST_RESCHEDULE_DISPOSITION_DENIED_ATTEMPT_MISMATCH = 2;
  REQUEST_RESCHEDULE_DISPOSITION_DENIED_BUDGET_EXHAUSTED = 3;
}

enum ChildLifecycleDisposition {
  CHILD_LIFECYCLE_DISPOSITION_UNSPECIFIED = 0;
  CHILD_LIFECYCLE_DISPOSITION_CLOSED = 1;
  CHILD_LIFECYCLE_DISPOSITION_ALREADY_CLOSED = 2;
  CHILD_LIFECYCLE_DISPOSITION_RESUMED = 3;
  CHILD_LIFECYCLE_DISPOSITION_ALREADY_ACTIVE = 4;
  CHILD_LIFECYCLE_DISPOSITION_PRESERVED_FAILED = 5;
  CHILD_LIFECYCLE_DISPOSITION_PRESERVED_TERMINATED = 6;
}

enum ChildControlAction {
  CHILD_CONTROL_ACTION_UNSPECIFIED = 0;
  CHILD_CONTROL_ACTION_INTERRUPT = 1;
  CHILD_CONTROL_ACTION_CLOSE = 2;
}

enum ChildInterruptDisposition {
  CHILD_INTERRUPT_DISPOSITION_UNSPECIFIED = 0;
  CHILD_INTERRUPT_DISPOSITION_PENDING_CONTROL = 1;
  CHILD_INTERRUPT_DISPOSITION_ALREADY_CLOSED = 2;
  CHILD_INTERRUPT_DISPOSITION_PRESERVED_FAILED = 3;
  CHILD_INTERRUPT_DISPOSITION_PRESERVED_TERMINATED = 4;
}

enum ChildInterruptOutcome {
  CHILD_INTERRUPT_OUTCOME_UNSPECIFIED = 0;
  CHILD_INTERRUPT_OUTCOME_COMPLETED = 1;
  CHILD_INTERRUPT_OUTCOME_DUPLICATE = 2;
  CHILD_INTERRUPT_OUTCOME_PRESERVED_FAILED = 3;
  CHILD_INTERRUPT_OUTCOME_PRESERVED_TERMINATED = 4;
  CHILD_INTERRUPT_OUTCOME_DELIVERY_FAILED = 5;
}

message RuntimeMessageCreate {
  RuntimeMessageCreateKind message_kind = 2;
  string message_info_json = 3;
  repeated RuntimePartCreate parts = 4;
}

message RuntimePartCreate {
  string part_kind = 1;
  string part_json = 2;
}

message RuntimeAssistantPartAppend {
  repeated RuntimePartCreate parts = 1;
}

message RuntimeToolSettlement {
  string tool_use_event_id = 1;
  oneof outcome {
    RuntimeToolCompleted completed = 2;
    RuntimeToolError error = 3;
    RuntimeToolCancelled cancelled = 4;
  }
}

message RuntimeToolCompleted {
  string output_json = 1;
  ServerToolUseUsage server_tool_use = 2;
}

message RuntimeToolError {
  string error_json = 1;
  ServerToolUseUsage server_tool_use = 2;
}

message RuntimeToolCancelled {
  optional string error_json = 1;
}

message DurableEventStamp {
  string session_thread_id = 1;
  string event_id = 2;
  int64 event_sequence = 3;
  DurableEventDisposition disposition = 4;
}

message DurablePartStamp {
  string part_id = 1;
  string message_id = 2;
  int64 part_sequence = 3;
  string created_at = 4;
  string updated_at = 5;
  DurableProjectionDisposition disposition = 6;
}

message DurableMessageStamp {
  string session_thread_id = 1;
  string message_id = 3;
  int64 message_sequence = 4;
  string created_at = 5;
  string updated_at = 6;
  DurableProjectionDisposition disposition = 7;
  repeated DurablePartStamp parts = 8;
}

message PrefixConsumptionStamp {
  string child_thread_id = 1;
  string parent_boundary_event_id = 2;
  string checkpoint_message_id = 3;
  PrefixConsumptionDisposition disposition = 4;
}

message PrefixConsumptionDraft {
  string child_thread_id = 1;
  string parent_boundary_event_id = 2;
}

message RequestRescheduleStamp {
  RequestRescheduleDisposition disposition = 1;
  string request_kind = 2;
  int64 attempt = 3;
  string effective_deadline = 4;
}

message ChildLifecycleStamp {
  string child_thread_id = 1;
  ChildLifecycleDisposition disposition = 2;
  string effective_at = 3;
}

message IdleCloseoutStamp {
  string durable_turn_id = 1;
  string idle_event_id = 2;
  int64 idle_event_sequence = 3;
  string committed_idle_at = 4;
}

message RequestStartStamp {
  string request_kind = 1;
  int64 context_through_message_sequence = 2;
}

message DeclarationReceipt {
  string session_thread_id = 1;
  string operation_kind = 2;
  string source_kind = 3;
  string operation_id = 4;
  repeated DurableEventStamp events = 5;
  repeated DurableMessageStamp messages = 6;
  repeated string pending_attachment_delta_json = 7;
  reserved 8;
  repeated PrefixConsumptionStamp prefix_consumptions = 9;
  string declaration_digest = 10;
  RequestRescheduleStamp request_reschedule = 11;
  repeated ChildLifecycleStamp child_lifecycle = 12;
  RequestStartStamp request_start = 13;
  IdleCloseoutStamp idle_closeout = 14;
  optional int64 compacted_through_message_sequence = 15;
  repeated InterruptToolProjection interrupt_tool_projections = 16;
}

message InterruptToolProjection {
  string tool_use_event_id = 1;
  DurableEventStamp result_event = 2;
  oneof terminal_state {
    RuntimeToolError error = 3;
    RuntimeToolCancelled cancelled = 4;
  }
}

message DeclarationResponse {
  repeated DeclarationReceipt receipts = 1;
  string observed_binding_id = 2;
  int64 observed_binding_generation = 3;
  ReceiptApplicationDisposition application_disposition = 4;
}

message RuntimeBindingRef {
  string binding_id = 1;
  int64 binding_generation = 2;
  string target_pod_uid = 3;
}

message RuntimeScope {
  reserved 1;
  reserved "request_id";
  string workspace_id = 2;
  string session_id = 3;
  string session_thread_id = 4;
  RuntimeBindingRef binding = 5;
}

message BridgeWriteAck {
  BridgeWriteStatus status = 1;
  string runtime_input_id = 2;
  string runtime_write_id = 3;
  string error_code = 4;
}

message LoadContextRequest {
  RuntimeScope scope = 1;
  string runtime_input_id = 2;
  int64 sequence_from = 3;
  int64 sequence_to = 4;
  reserved 5;
  reserved "agent_mail_source_thread_id";
}

message LoadContextResponse {
  BridgeWriteAck ack = 1;
  string context_json = 2;
  string runtime_binding_token = 3;
}

message RefreshRuntimeBindingTokenRequest {
  RuntimeScope scope = 1;
}

message RefreshRuntimeBindingTokenResponse {
  string runtime_binding_token = 1;
}

message CommitInputsRequest {
  RuntimeScope scope = 1;
  string runtime_input_id = 2;
  RuntimeInputDisposition disposition = 3;
  repeated string approval_review_text = 4;
}

message CommitInputsResponse {
  oneof outcome {
    CommitInputsCommitted committed = 1;
    CommitInputsDuplicate duplicate = 2;
    CommitInputsStale stale = 3;
  }
}

enum RuntimeInputDisposition {
  RUNTIME_INPUT_DISPOSITION_UNSPECIFIED = 0;
  RUNTIME_INPUT_DISPOSITION_COMMIT = 1;
  RUNTIME_INPUT_DISPOSITION_DEFER = 2;
  RUNTIME_INPUT_DISPOSITION_REJECT = 3;
}

message RuntimeContextToolFailed { string error_json = 1; }
message RuntimeContextToolCancelled { optional string error_json = 1; }

message RuntimeInterruptToolResult {
  string tool_use_event_id = 1;
  oneof outcome {
    RuntimeContextToolFailed error = 2;
    RuntimeContextToolCancelled cancelled = 3;
  }
}

message CommitInputsContextApplication {
  repeated int64 assigned_context_sequences = 1;
  repeated string pending_attachment_json = 2;
}

message CommitInputsInterruptApplication {
  repeated RuntimeInterruptToolResult interrupt_tool_results = 1;
}

message CommitInputsCommitted {
  reserved 1, 2, 3;
  reserved "context_delta", "interrupt_tool_results", "pending_attachment_json";
  oneof application {
    CommitInputsContextApplication context = 4;
    CommitInputsInterruptApplication interrupt = 5;
  }
}
message CommitInputsDuplicate {
  reserved 1, 2, 3;
  reserved "context_delta", "interrupt_tool_results", "pending_attachment_json";
  oneof application {
    CommitInputsContextApplication context = 4;
    CommitInputsInterruptApplication interrupt = 5;
  }
}
message CommitInputsStale {}

message CommitTaskNotificationResultRequest {
  RuntimeScope scope = 1;
  string runtime_input_id = 2;
  RuntimeInputDisposition disposition = 3;
}

message CommitTaskNotificationResultResponse {
  oneof outcome {
    CommitTaskNotificationResultCommitted committed = 1;
    CommitTaskNotificationResultDuplicate duplicate = 2;
    CommitTaskNotificationResultStale stale = 3;
    CommitTaskNotificationResultDeferred deferred = 4;
    CommitTaskNotificationResultRejected rejected = 5;
  }
}

message CommitTaskNotificationResultCommitted {
  reserved 1;
  reserved "context_delta";
  repeated int64 assigned_context_sequences = 2;
}
message CommitTaskNotificationResultDuplicate {
  reserved 1;
  reserved "context_delta";
  repeated int64 assigned_context_sequences = 2;
}
message CommitTaskNotificationResultStale {}
message CommitTaskNotificationResultDeferred {}
message CommitTaskNotificationResultRejected { TaskNotificationRejectionReason reason = 1; }

enum TaskNotificationRejectionReason {
  TASK_NOTIFICATION_REJECTION_REASON_UNSPECIFIED = 0;
  TASK_NOTIFICATION_REJECTION_REASON_DURABLE_RESULT_INVALID = 1;
  TASK_NOTIFICATION_REJECTION_REASON_TARGET_INVALID = 2;
}

message McpManifestChangedRequest {
  string workspace_id = 1;
  string session_id = 2;
  string mcp_server_name = 3;
  string manifest_etag = 4;
}

message McpManifestChangedResponse {
  oneof outcome {
    McpManifestCommitted committed = 1;
    McpManifestDuplicate duplicate = 2;
  }
}

message McpManifestCommitted {}
message McpManifestDuplicate {}

message ClaimMcpToolResultRequest {
  RuntimeScope scope = 1;
  string tool_use_event_id = 2;
  string claim_id = 3;
  reserved 4, 5, 6;
  reserved "mcp_server_name", "tool_name", "input_json";
}

message ClaimMcpToolResultResponse {
  oneof outcome {
    McpToolClaimAcquired acquired = 1;
    McpToolAlreadyCompleted already_completed = 2;
    McpToolClaimInFlight in_flight = 3;
    McpToolClaimStale stale = 4;
  }
}

message McpToolClaimAcquired {
  string mcp_server_name = 1;
  string tool_name = 2;
  string input_json = 3;
}

message McpToolAlreadyCompleted { string result_json = 1; }
message McpToolClaimInFlight {}
message McpToolClaimStale {}

message CommitMcpToolResultRequest {
  RuntimeScope scope = 1;
  string tool_use_event_id = 2;
  string claim_id = 3;
  reserved 4, 5, 6;
  reserved "mcp_server_name", "tool_name", "input_json";
  string result_json = 7;
  repeated McpInlineMedia inline_media = 8;
}

message McpInlineMedia {
  bytes data = 1;
  string mime = 2;
  string suggested_filename = 3;
}

message CommitMcpToolResultResponse {
  oneof outcome {
    McpToolCommitCommitted committed = 1;
    McpToolCommitDuplicate duplicate = 2;
    McpToolCommitStale stale = 3;
  }
}

message McpToolCommitCommitted {}
message McpToolCommitDuplicate {}
message McpToolCommitStale {}

message RelinquishMcpToolResultRequest {
  RuntimeScope scope = 1;
  string tool_use_event_id = 2;
  string claim_id = 3;
}

message RelinquishMcpToolResultResponse {
  oneof outcome {
    McpToolRelinquishRelinquished relinquished = 1;
    McpToolRelinquishDuplicate duplicate = 2;
    McpToolRelinquishStale stale = 3;
  }
}

message McpToolRelinquishRelinquished {}
message McpToolRelinquishDuplicate {}
message McpToolRelinquishStale {}

message CommitInternalToolRepairRequest {
  RuntimeScope scope = 1;
  string model_request_id = 2;
  string model_tool_call_id = 3;
  string tool_name = 4;
  RuntimeMessageCreate message_create = 5;
}

message CommitInternalToolRepairResponse {
  BridgeWriteAck ack = 1;
  DeclarationResponse declaration = 2;
}

message CommitRuntimeTerminationRequest {
  RuntimeScope scope = 1;
  string runtime_write_id = 2;
  string failure_json = 3;
  reserved 4, 5, 6;
  reserved "tool_settlements", "completion_mail_create";
}

message CommitRuntimeTerminationResponse {
  oneof outcome {
    RuntimeTerminationCommitted committed = 1;
    RuntimeTerminationDuplicate duplicate = 2;
    RuntimeTerminationStale stale = 3;
  }
}

message RuntimeTerminationCommitted {
  string failure_event_id = 1;
  string closeout_event_id = 2;
}

message RuntimeTerminationDuplicate {
  string failure_event_id = 1;
  string closeout_event_id = 2;
}

message RuntimeTerminationStale {}

message TransientAttachmentRef {
  string attachment_ref = 1;
  string mime = 2;
  string filename = 3;
  string source_tool_use_event_id = 4;
  string source_path = 5;
  string page_range = 6;
  string detail = 7;
}

message ResolveTransientAttachmentRequest {
  RuntimeScope scope = 1;
  string attachment_ref = 2;
  reserved 3;
  reserved "source_tool_use_event_id";
}

message ResolvedTransientAttachment {
  string attachment_ref = 1;
  string mime = 2;
  string filename = 3;
  string source_path = 4;
  string page_range = 5;
  string detail = 6;
  bytes data = 7;
}

message TransientAttachmentUnavailable {}

message ResolveTransientAttachmentResponse {
  oneof outcome {
    ResolvedTransientAttachment resolved = 1;
    TransientAttachmentUnavailable unavailable = 2;
  }
}

message FileAttachmentPair {
  string source_event_id = 1;
  string file_id = 2;
}

message ResolveFileAttachmentMetadataRequest {
  RuntimeScope scope = 1;
  repeated FileAttachmentPair attachments = 2;
}

message FileAttachmentMetadata {
  FileAttachmentPair attachment = 1;
  string mime = 2;
  int64 size_bytes = 3;
  string filename = 4;
}

enum FileAttachmentRejectionReason {
  FILE_ATTACHMENT_REJECTION_REASON_UNSPECIFIED = 0;
  FILE_ATTACHMENT_REJECTION_REASON_DELETED = 1;
}

message FileAttachmentRejection {
  FileAttachmentPair attachment = 1;
  FileAttachmentRejectionReason reason = 2;
}

message FileAttachmentMetadataResult {
  oneof outcome {
    FileAttachmentMetadata metadata = 1;
    FileAttachmentRejection rejected = 2;
  }
}

message ResolveFileAttachmentMetadataResponse {
  repeated FileAttachmentMetadataResult attachments = 1;
}

message ReadFileAttachmentChunkRequest {
  RuntimeScope scope = 1;
  FileAttachmentPair attachment = 2;
  int64 offset = 3;
  int64 length = 4;
}

message ReadFileAttachmentChunkResponse {
  oneof outcome {
    bytes data = 1;
    FileAttachmentRejection rejected = 2;
  }
}

message WriteEventRequest {
  RuntimeScope scope = 1;
  string runtime_write_id = 2;
  string model_request_id = 3;
  string event_type = 4;
  string payload_json = 5;
  reserved 6;
  bool session_visible = 7;
  reserved 8, 9;
  reserved "server_tool_use";
  RuntimeAssistantPartAppend assistant_part_append = 10;
  reserved 11, 12;
  reserved "mcp_materialization_handle", "sandbox_result_digest";
  optional int64 context_through_message_sequence = 13;
  string request_kind = 14;
  reserved 15;
  reserved "tool_settlement";
}

message ServerToolUseUsage {
  int64 web_search_requests = 1;
  int64 web_fetch_requests = 2;
}

message WriteEventResponse {
  BridgeWriteAck ack = 1;
  string event_id = 2;
  int64 sequence = 3;
  DeclarationResponse declaration = 4;
}

message SettleToolResultRequest {
  RuntimeScope scope = 1;
  RuntimeToolSettlement settlement = 2;
  reserved 3;
  reserved "server_tool_use";
}

message SettleToolResultResponse {
  oneof outcome {
    ToolResultCommitted committed = 1;
    ToolResultDuplicate duplicate = 2;
    ToolResultStale stale = 3;
  }
}

message ToolResultCommitted {}
message ToolResultDuplicate {}
message ToolResultStale {}

message WriteRequestEndRequest {
  RuntimeScope scope = 1;
  string runtime_write_id = 2;
  string model_request_id = 3;
  string finish_reason = 4;
  string usage_json = 5;
  string model_request_start_event_id = 6;
  bool is_error = 7;
  string error_kind = 8;
  repeated string consumed_attachment_refs = 9;
  string request_kind = 10;
  RequestEndReschedule reschedule = 11;
  reserved 12;
  repeated FileAttachmentPair consumed_file_attachments = 13;
  RuntimeAssistantPartAppend trailing_part_append = 14;
  PrefixConsumptionDraft prefix_consumption = 15;
  optional int64 compacted_through_message_sequence = 16;
  string compaction_event_payload_json = 17;
  RequestEndInterruptSettlement interrupt_settlement = 18;
  RuntimeMessageCreate compaction_checkpoint_create = 19;
}

message RequestEndInterruptSettlement {
  string runtime_input_id = 1;
}

message WriteRequestEndResponse {
  BridgeWriteAck ack = 1;
  reserved 2;
  DeclarationResponse declaration = 3;
}

message RequestEndReschedule {
  int32 attempt = 1;
  string deadline = 2;
  int64 backoff_ms = 3;
}

message RequestEndRescheduleDisposition {
  string status = 1;
  string denial_reason = 2;
  int32 attempt = 3;
  string effective_deadline = 4;
}

message FinishIdleRequest {
  RuntimeScope scope = 1;
  reserved 2, 3;
  string stop_reason_json = 4;
  string durable_turn_id = 5;
  RuntimeMessageCreate completion_mail_create = 6;
}

message FinishIdleResponse {
  BridgeWriteAck ack = 1;
  DeclarationResponse declaration = 2;
}

message CreateSubagentThreadRequest {
  RuntimeScope scope = 1;
  string source_tool_use_event_id = 2;
  string task_name = 3;
  string agent_type = 4;
  string fork_turns = 5;
}

message CreateSubagentThreadResponse {
  oneof outcome {
    CreateSubagentThreadCommitted committed = 1;
    CreateSubagentThreadDuplicate duplicate = 2;
  }
}
message CreateSubagentThreadCommitted { string child_thread_id = 1; }
message CreateSubagentThreadDuplicate { string child_thread_id = 1; }

message EnsureApprovalReviewerTrunkRequest {
  RuntimeScope scope = 1;
  string ensure_operation_id = 2;
}
message EnsureApprovalReviewerTrunkResponse {
  oneof outcome {
    EnsureApprovalReviewerTrunkCommitted committed = 1;
    EnsureApprovalReviewerTrunkDuplicate duplicate = 2;
  }
}
message EnsureApprovalReviewerTrunkCommitted { string reviewer_thread_id = 1; }
message EnsureApprovalReviewerTrunkDuplicate { string reviewer_thread_id = 1; }

message EnsureApprovalReviewerSidecarRequest {
  RuntimeScope scope = 1;
  string review_id = 2;
}
message EnsureApprovalReviewerSidecarResponse {
  oneof outcome {
    EnsureApprovalReviewerSidecarCommitted committed = 1;
    EnsureApprovalReviewerSidecarDuplicate duplicate = 2;
  }
}
message EnsureApprovalReviewerSidecarCommitted { string reviewer_thread_id = 1; }
message EnsureApprovalReviewerSidecarDuplicate { string reviewer_thread_id = 1; }

message AdmitApprovalReviewInputRequest {
  RuntimeScope scope = 1;
  string reviewer_thread_id = 2;
  string review_id = 3;
}
message AdmitApprovalReviewInputResponse {
  oneof outcome {
    AdmitApprovalReviewInputCommitted committed = 1;
    AdmitApprovalReviewInputDuplicate duplicate = 2;
  }
}
message AdmitApprovalReviewInputCommitted { string runtime_input_id = 1; }
message AdmitApprovalReviewInputDuplicate { string runtime_input_id = 1; }

message ResolveChildThreadRequest {
  RuntimeScope scope = 1;
  string child_thread_id = 2;
}

message ResolveChildThreadResponse {
  oneof outcome { ResolveChildThreadResolved resolved = 1; }
}
message ResolveChildThreadResolved { ChildThreadFact child = 1; }

message ListChildThreadsRequest {
  RuntimeScope scope = 1;
  string parent_thread_id = 2;
}

message ListChildThreadsResponse {
  oneof outcome { ListChildThreadsCompleted completed = 1; }
}
message ListChildThreadsCompleted { repeated ChildThreadFact children = 1; }
message ChildThreadFact {
  string child_thread_id = 1;
  string parent_thread_id = 2;
  string role = 3;
  string visibility = 4;
  string task_name = 5;
  string agent_type = 6;
  string status = 7;
}

message DeliverInterAgentMailRequest {
  RuntimeScope scope = 1;
  string delivery_id = 2;
  string target_thread_id = 3;
  string source_tool_use_event_id = 4;
  string content = 5;
}

message DeliverInterAgentMailResponse {
  oneof outcome {
    DeliverInterAgentMailCommitted committed = 1;
    DeliverInterAgentMailDuplicate duplicate = 2;
  }
}
message DeliverInterAgentMailCommitted {}
message DeliverInterAgentMailDuplicate {}

message ReadAgentMailRequest {
  RuntimeScope scope = 1;
  string source_thread_id = 2;
}
