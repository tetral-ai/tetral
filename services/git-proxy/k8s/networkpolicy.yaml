apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/egress-intent: "github.com"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: git-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tetral.ai/network-role: public-ingress
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: tetral
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tetral-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
