apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: git-proxy
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: git-proxy
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/hpa-metric-source: "prometheus-adapter: gitproxy_active_connections and rate(gitproxy_bytes_relayed_total[2m])"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: git-proxy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: gitproxy_active_connections
        target:
          type: AverageValue
          averageValue: "100"
    - type: Pods
      pods:
        metric:
          name: gitproxy_bytes_relayed_per_second
          selector:
            matchLabels:
              direction: in
        target:
          type: AverageValue
          averageValue: 20Mi
    - type: Pods
      pods:
        metric:
          name: gitproxy_bytes_relayed_per_second
          selector:
            matchLabels:
              direction: out
        target:
          type: AverageValue
          averageValue: 20Mi
