apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: cleanup
    app.kubernetes.io/part-of: tetral
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cleanup
            app.kubernetes.io/part-of: tetral
        spec:
          serviceAccountName: cleanup
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: ghcr.io/tetral-ai/tetral:0.0.0-dev
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/tetral-cleanup
              env:
                - name: TETRAL_LOG_BURST
                  value: "1"
                - name: TETRAL_LOG_LEVEL
                  value: "info"
                - name: TETRAL_LOG_MAX_RECORD_BYTES
                  value: "16384"
                - name: TETRAL_LOG_SUMMARY_INTERVAL_MS
                  value: "30000"
                - name: TETRAL_DEPLOYMENT_ENVIRONMENT
                  value: "local"
                - name: TETRAL_SERVICE_VERSION
                  value: "dev"
                - name: TETRAL_DATABASE_TLS_CA_PATH
                  value: /var/run/tetral/store-trust/database-ca.crt
                - name: TETRAL_DATABASE_TLS_SERVER_NAME
                  value: "tetral-postgres.tetral-system.svc.cluster.local"
                - name: TETRAL_DB_MAX_OPEN_CONNS
                  value: "20"
                - name: TETRAL_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: "tetral-database"
                      key: cleanup-url
                - name: TETRAL_CLEANUP_CLAIM_LIMIT
                  value: "100"
              volumeMounts:
                - name: store-trust
                  mountPath: /var/run/tetral/store-trust
                  readOnly: true
              resources:

                limits:
                  cpu: 500m
                  ephemeral-storage: 512Mi
                  memory: 256Mi
                requests:
                  cpu: 100m
                  ephemeral-storage: 128Mi
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: store-trust
              configMap:
                name: "tetral-store-trust"
