apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: cleanup
    app.kubernetes.io/part-of: tetral
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cleanup
            app.kubernetes.io/part-of: tetral
        spec:
          serviceAccountName: cleanup
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: ghcr.io/tetral-ai/tetral:0.0.0-dev
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/tetral-cleanup
              env:
                - name: TETRAL_SCHEMA_MODE
                  value: verify
                - name: TETRAL_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: tetral-database
                      key: cleanup-url
                - name: TETRAL_CLEANUP_CLAIM_LIMIT
                  value: "100"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
                  ephemeral-storage: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
