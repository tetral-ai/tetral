# Only the drive CronJob reaches the blob store; the per-minute cleanup keeps
# database, DNS and OTLP egress alone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cleanup-drives
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: cleanup-drives
    app.kubernetes.io/part-of: tetral
  annotations:
    tetral.ai/egress-intent: "blob.example.internal"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cleanup-drives
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tetral-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
