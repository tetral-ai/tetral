apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: tetral
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: auth
      automountServiceAccountToken: false
      containers:
        - name: auth
          image: ghcr.io/tetral-ai/tetral:0.1.0-alpha
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/tetral-auth
          env:
            - name: TETRAL_AUTH_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_AUTH_HTTP_ADDR
            - name: TETRAL_AUTH_METRICS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_AUTH_METRICS_ADDR
            - name: TETRAL_DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_DEPLOYMENT_ENVIRONMENT
            - name: TETRAL_SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_SERVICE_VERSION
            - name: ENGINE_BOOTSTRAP_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: ENGINE_BOOTSTRAP_WORKSPACE_ID
            - name: TETRAL_AUTH_INTERNAL_PRINCIPAL_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: TETRAL_AUTH_INTERNAL_PRINCIPAL_TTL_SECONDS
            - name: ENGINE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-bootstrap
                  key: engine-api-key
            - name: TETRAL_AUTH_INTERNAL_PRINCIPAL_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: auth-internal-principal
                  key: private_key_b64
            - name: TETRAL_SCHEMA_MODE
              value: verify
            - name: TETRAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-database
                  key: url
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
