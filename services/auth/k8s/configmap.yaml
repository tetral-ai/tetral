apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: tetral
    app.kubernetes.io/managed-by: kustomize
data:
  TETRAL_AUTH_HTTP_ADDR: ":8080"
  TETRAL_AUTH_METRICS_ADDR: ":8081"
  TETRAL_DEPLOYMENT_ENVIRONMENT: local
  TETRAL_SERVICE_VERSION: dev
  ENGINE_BOOTSTRAP_WORKSPACE_ID: existing-workspace-id
  TETRAL_AUTH_INTERNAL_PRINCIPAL_TTL_SECONDS: "60"
