apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-connector-tokenreview
  labels:
    app.kubernetes.io/name: mcp-connector
    app.kubernetes.io/part-of: tetral
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-connector-tokenreview
  labels:
    app.kubernetes.io/name: mcp-connector
    app.kubernetes.io/part-of: tetral
subjects:
  - kind: ServiceAccount
    name: mcp-connector
    namespace: tetral-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-connector-tokenreview
