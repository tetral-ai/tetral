apiVersion: v1
kind: Service
metadata:
  name: mcp-connector
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: mcp-connector
    app.kubernetes.io/part-of: tetral
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-connector
  ports:
    - name: mcp-grpc
      port: 9091
      targetPort: mcp-grpc
    - name: mcp-http
      port: 8081
      targetPort: mcp-http
