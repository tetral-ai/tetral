apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-config
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: sandbox
    app.kubernetes.io/part-of: tetral
data:
  DAYTONA_API_URL: https://daytona.example.internal/api
  DAYTONA_TARGET: us
  # Environment artifact builds start FROM this image; it must be the same
  # sandbox image this release deploys, or every packages build fails at its
  # first Dockerfile line.
  TETRAL_SANDBOX_BASE_IMAGE: ghcr.io/tetral-ai/sandbox:0.1.0-alpha
  TETRAL_QUEUE_GRPC_ADDR: queue.tetral-system.svc.cluster.local:9090
  TETRAL_GIT_PROXY_HOST: git.tetral.example
  TETRAL_SANDBOX_LEASE_HEARTBEAT_INTERVAL: 15s
  TETRAL_SANDBOX_JOB_LEASE_DURATION: 120s
  TETRAL_SANDBOX_PROVIDER_COMMAND_TIMEOUT: 45s
  TETRAL_SANDBOX_LATE_COMMAND_MARGIN: 30s
  TETRAL_SANDBOX_JOB_POLL_INTERVAL: 1s
  TETRAL_SANDBOX_DEBUG_LOGGING: "false"
  TETRAL_SANDBOX_ENVIRONMENT_BUILD_CONCURRENCY: "1"
  TETRAL_SANDBOX_ENVIRONMENT_READY_FANOUT_CONCURRENCY: "1"
  TETRAL_SANDBOX_WORKER_CONCURRENCY: "1"
  TETRAL_SANDBOX_DAYTONA_STOP_TIMEOUT: 30s
  TETRAL_SANDBOX_AUTO_STOP_INTERVAL: 30m
  TETRAL_SANDBOX_AUTO_ARCHIVE_INTERVAL: 24h
  TETRAL_SANDBOX_AUTO_DELETE_INTERVAL: 720h
  TETRAL_BLOB_ENDPOINT: https://blob.example.internal
  TETRAL_BLOB_REGION: local
  TETRAL_BLOB_BUCKET: tetral-files
  TETRAL_R2_ACCOUNT_ID: replace-me
  TETRAL_RESOURCE_CRED_TTL: 24h
  TETRAL_RESOURCE_CRED_REFRESH_MARGIN: 30m
  TETRAL_RCLONE_VFS_CACHE_MAX_SIZE: 2G
  TETRAL_RCLONE_VFS_MIN_FREE: 1G
