  name: sandbox-daytona
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: sandbox
    app.kubernetes.io/part-of: tetral
type: Opaque
stringData:
  DAYTONA_API_KEY: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: tetral-database
  namespace: tetral-system
  labels:
    app.kubernetes.io/name: sandbox
    app.kubernetes.io/part-of: tetral
type: Opaque
stringData:
  # Consumer manifests: services/bridge/k8s/deployment.yaml (bridge-url),
  # services/job-runner/k8s/deployment.yaml (job-runner-url),
  # services/gateway/k8s/provider-gateway/deployment.yaml (provider-gateway-url),
  # services/gateway/k8s/mcp-connector/deployment.yaml (mcp-connector-url),
  # services/cleanup/k8s/cronjob.yaml (cleanup-url),
  # services/git-proxy/k8s/deployment.yaml (git-proxy-url), and
  # services/sandbox/k8s/deployment.yaml (TETRAL_POSTGRES_DSN).
  # sslmode=verify-full requires every consumer to trust the PostgreSQL
  # server CA. Each database consumer verifies the server through
  # TETRAL_DATABASE_TLS_CA_PATH, mounted from the tetral-store-trust
  # ConfigMap key database-ca.crt.
  bridge-url: postgres://tetral_bridge:replace-me@postgres.tetral-system.svc.cluster.local:5432/tetral?sslmode=verify-full
  cleanup-url: postgres://tetral_cleanup:replace-me@postgres.tetral-system.svc.cluster.local:5432/tetral?sslmode=verify-full
  job-runner-url: postgres://tetral_job_runner:replace-me@postgres.tetral-system.svc.cluster.local:5432/tetral?sslmode=verify-full
  mcp-connector-url: postgres://tetral_mcp_connector:replace-me@postgres.tetral-system.svc.cluster.local:5432/tetral?sslmode=verify-full
  provider-gateway-url: postgres://tetral_provider_gateway:replace-me@postgres.tetral-system.svc.cluster.local:5432/tetral?sslmode=verify-full
  git-proxy-url: postgres://tetral_gitproxy:replace-me@postgres.tetral-system.svc.cluster.local:5432/tetral?sslmode=verify-full
  TETRAL_POSTGRES_DSN: postgres://tetral-sandbox:replace-me@postgres.tetral-system.svc.cluster.local:5432/tetral?sslmode=verify-full
---
