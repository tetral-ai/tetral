syntax = "proto3";

package tetral.sandbox.v1;

option go_package = "github.com/tetral-ai/tetral/services/sandbox/gen/tetral/sandbox/v1;tetralsandboxv1";

service SandboxService {
  rpc ReleaseSandbox(ReleaseSandboxRequest) returns (ReleaseSandboxResponse);
}

message ReleaseSandboxRequest {
  string workspace_id = 1;
  string session_id = 2;
  string sandbox_id = 3;
  string binding_id = 4;
  int64 binding_generation = 5;
  string reason = 6;
  string idempotency_key = 7;
  string preparation_attempt_id = 8;
  string delete_cleanup_id = 9;
}

enum ReleaseSandboxStatus {
  RELEASE_SANDBOX_STATUS_UNSPECIFIED = 0;
  RELEASE_SANDBOX_STATUS_RELEASED = 1;
  RELEASE_SANDBOX_STATUS_ALREADY_RELEASED = 2;
  RELEASE_SANDBOX_STATUS_RETRY_LATER = 3;
  RELEASE_SANDBOX_STATUS_FAILED = 4;
  RELEASE_SANDBOX_STATUS_ARCHIVED = 5;
}

message ReleaseSandboxResponse {
  ReleaseSandboxStatus status = 1;
  string sandbox_status = 2;
}
